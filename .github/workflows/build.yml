                              Pair("online", "只用線上 (Google 翻譯,直接輸出繁體)"),
                              Pair("offline", "只用離線 (不用網路,品質較差)"),
                              Pair("ai", "AI 翻譯 (先辨識文字再交給 AI,需下方 AI 設定)"),
                              Pair("aiv", "AI 看圖翻譯 (把對話框截圖給 AI,最準,需視覺模型)")
                          ),
                          cfg
                      )
                  )

                  root.addView(makeAiSettings(cfg))

                  val gTitle = TextView(this)
                  gTitle.text = "自訂專有名詞 (每行一條,格式:日文=中文)。要修正翻錯的詞,用「>錯的譯法=正確譯法」。這裡的設定優先於內建名詞表。"
                  gTitle.setPadding(0, dp(12), 0, 0)
                  root.addView(gTitle)
                  val gEdit = EditText(this)
                  gEdit.hint = "例:\nリナ=莉娜\n>麗娜=莉娜"
                  gEdit.minLines = 4
                  gEdit.gravity = Gravity.TOP
                  gEdit.setText(cfg.getString("glossary_user", ""))
                  gEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
