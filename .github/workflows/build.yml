          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.util.TypedValue
          import android.view.MotionEvent
          import android.view.View

          /**
           * 可以用手指移動、調整大小的譯文框 (自動翻譯模式使用)。
           * 拖曳框的任何地方 = 移動;拖曳右下角的三角形 = 調整大小。
           * 文字會自動縮小到剛好放得進框裡。
           */
          class SubtitleView(context: Context) : View(context) {

              var zh: String = ""
              var orig: String = ""
              var showOrig: Boolean = true

              // 手指拖曳時通知 service,由它更新視窗位置並儲存
              var onMove: ((Int, Int) -> Unit)? = null
              var onResize: ((Int, Int) -> Unit)? = null
              var onFinish: (() -> Unit)? = null

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xE6101820.toInt()
              }
              private val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
              }
              private val origPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFD54F.toInt()
              }
              private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xCCFFFFFF.toInt()
              }

              private var mode = 0
              private var lastX = 0f
              private var lastY = 0f

              private fun sp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, v, resources.displayMetrics)

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)

              private fun makeLayout(paint: TextPaint, text: String, size: Float, width: Int): StaticLayout {
                  paint.textSize = size
                  return StaticLayout.Builder.obtain(text, 0, text.length, paint, width)
                      .setAlignment(Layout.Alignment.ALIGN_NORMAL)
                      .build()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  canvas.drawRoundRect(RectF(0f, 0f, w, h), dp(8f), dp(8f), bgPaint)

                  val pad = dp(8f)
                  val inner = maxOf(1, (w - 2 * pad).toInt())
                  val minSize = sp(10f)
                  val withOrig = showOrig && orig.isNotEmpty()

                  var size = sp(26f)
                  var layout = makeLayout(textPaint, zh, size, inner)
                  var oLayout: StaticLayout? = if (withOrig) makeLayout(origPaint, orig, maxOf(size * 0.55f, sp(9f)), inner) else null
                  while (layout.height + (oLayout?.height ?: 0) + 2 * pad > h && size > minSize) {
                      size -= 1f
                      layout = makeLayout(textPaint, zh, size, inner)
                      oLayout = if (withOrig) makeLayout(origPaint, orig, maxOf(size * 0.55f, sp(9f)), inner) else null
                  }

                  val ol = oLayout
                  canvas.save()
                  canvas.translate(pad, pad)
                  if (ol != null) {
                      ol.draw(canvas)
                      canvas.translate(0f, ol.height.toFloat())
                  }
                  layout.draw(canvas)
                  canvas.restore()

                  // 右下角的調整大小把手
                  val hs = dp(22f)
                  val path = Path()
                  path.moveTo(w - 2f, h - hs)
                  path.lineTo(w - 2f, h - 2f)
                  path.lineTo(w - hs, h - 2f)
                  path.close()
                  canvas.drawPath(path, handlePaint)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          val hs = dp(44f)
                          mode = if (e.x > width - hs && e.y > height - hs) 2 else 1
                          lastX = e.rawX
                          lastY = e.rawY
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = (e.rawX - lastX).toInt()
                          val dy = (e.rawY - lastY).toInt()
                          lastX = e.rawX
                          lastY = e.rawY
                          if (mode == 1) {
                              onMove?.invoke(dx, dy)
                          } else if (mode == 2) {
                              onResize?.invoke(dx, dy)
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          mode = 0
                          onFinish?.invoke()
                          return true
                      }
                  }
                  return true
              }
          }
