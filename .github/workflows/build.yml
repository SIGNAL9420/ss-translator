          # 格式: >錯的譯法=正確譯法   翻譯完成後,把機器翻錯的詞換成正確的
          # 這些是通用譯名的起點,不保證是台灣官方版本。可在 App 主畫面的「自訂專有名詞」覆蓋。

          # --- 角色 ---
