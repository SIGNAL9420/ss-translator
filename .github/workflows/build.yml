              private var regionEditor: RegionEditView? = null

              private fun showRegionEditor() {
                  if (regionEditor != null) return
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val mt = readMetrics()
                  val rows = regionRows(mt[1])
                  val v = RegionEditView(this)
                  v.rTop = rows[0]
                  v.rBot = rows[1]
                  v.screenH = mt[1]
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  v.onDone = { t, b ->
                      val tp = (t * 100f / mt[1]).toInt().coerceIn(0, 95)
                      val bp = (b * 100f / mt[1] + 0.5f).toInt().coerceIn(tp + 1, 100)
                      prefs.edit().putInt("top", tp).putInt("bot", bp).apply()
                      try {
                          wm.removeView(v)
                      } catch (e: Exception) {
                          // ignore
                      }
                      regionEditor = null
                      curSig = null
                      toast("翻譯範圍已儲存:" + tp + "% ~ " + bp + "%")
                  }
                  wm.addView(v, lp)
                  regionEditor = v
                  bringButtonToFront()
              }

