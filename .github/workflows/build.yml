              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M28,32h52v9h-52z M28,50h52v9h-52z M28,68h34v9h-34z" />
          </vector>
          __SSFILE_EOF__
          cat > 'app/src/main/res/values/strings.xml' <<'__SSFILE_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SS日文翻譯</string>
          </resources>
          __SSFILE_EOF__
          cat > 'build.gradle.kts' <<'__SSFILE_EOF__'
