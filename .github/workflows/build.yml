              private fun recognizeAndTranslate(src: Bitmap, topOffset: Int, auto: Boolean = false, skipGate: Boolean = false): List<ResultView.Item> {
                  val tStart = SystemClock.uptimeMillis()
                  lastRegion = Rect(0, topOffset, src.width, topOffset + src.height)
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val engine = prefs.getString("engine", "smart") ?: "smart"

                  val tr = translator ?: throw IllegalStateException("translator")
                  val rec = recognizer ?: throw IllegalStateException("recognizer")

                  val spellModeOn = prefs.getBoolean("spell_mode", false)
                  var menuFrame = false
                  fun runAiv(): List<ResultView.Item> {
                      // 魔法選單模式會把翻譯範圍往上延伸到畫面最上面,看圖時只送原本設定的範圍,圖小比較快
                      var img = src
                      var dy = 0
                      if (spellModeOn) {
                          val cut = regionRows(readMetrics()[1])[0] - topOffset
                          if (cut > 0 && cut < src.height - 40) {
                              img = Bitmap.createBitmap(src, 0, cut, src.width, src.height - cut)
                              dy = cut
                          }
                      }
                      try {
                          val s2 = signature(img)
                          val ls = lastAivSig
                          val lr = lastAivResult
                          if (ls != null && lr != null && ls.size == s2.size && sigDiff(ls, s2) <= 20) return lr
                          ui.post { setLabel("AI") }
                          val r = AiClient.translateImage(applicationContext, img, aiHistory.toList())
                          if (r == null) return emptyList()
                          val zh = Glossary.fix(applicationContext, r.second)
                          rememberAi(zh)
                          val rect = Rect(0, topOffset + dy, src.width, topOffset + src.height)
                          val res = listOf(ResultView.Item(rect, zh, maxOf(1, img.height / 3), r.first))
                          lastAivSig = s2
                          lastAivResult = res
                          return res
                      } catch (e: Exception) {
                          val msg = e.message ?: e.toString()
                          if (msg.contains("429")) {
                              throw IllegalStateException("AI 額度滿了 (429),請到選單改用線上或離線翻譯")
                          }
                          throw IllegalStateException("AI 看圖失敗:" + msg.take(60) + " (可到選單改用線上或離線翻譯)")
                      } finally {
                          if (img !== src) img.recycle()
                      }
                  }
                  if (engine == "aiv" && !spellModeOn && !auto) return runAiv()
                  if (spellModeOn && !skipGate) {
                      // 魔法選單模式會把範圍延伸到畫面最上面,辨識很慢。先用一次很快的文字辨識看是不是魔法清單 / HELP 說明,
                      // 不是的話就只處理原本設定的範圍 (對話翻譯速度才不會被拖慢)
                      var looksMenu = false
                      try {
                          // 平常 (沒有魔法選單) 用縮小一半的圖快速確認,選單開著時才用原圖仔細看,對話翻譯才快
                          val menuActive = lastWasSpell || helpBoxRect != null
                          val gateBmp = if (menuActive) src else Bitmap.createScaledBitmap(src, maxOf(1, src.width / 2), maxOf(1, src.height / 2), true)
                          val qt = try {
                              Tasks.await(rec.process(InputImage.fromBitmap(gateBmp, 0)), 6, TimeUnit.SECONDS)
                          } finally {
                              if (gateBmp !== src) gateBmp.recycle()
                          }
                          val all = qt.text.uppercase()
                          if (all.contains("PAGE") || all.contains("HELP") || all.contains("STEP") || all.contains("HIT") || all.contains("えらんで") || all.contains("呪文")) looksMenu = true
                          if (!looksMenu) {
                              var n = 0
                              for (bl in qt.textBlocks) {
                                  for (ln in bl.lines) {
                                      if (SpellGuide.match(applicationContext, ln.text) != null) n++
                                  }
                              }
                              if (n >= 1) looksMenu = true
                          }
                      } catch (e: Exception) {
                          looksMenu = false
                      }
                      menuFrame = looksMenu
                      if (looksMenu) {
                          // 遊戲的魔法選單 / HELP 還在,魔法翻譯欄就繼續留著
                          ui.post { lastSpellOk = SystemClock.uptimeMillis() }
                      } else {
                          // 遊戲的魔法選單已經完全關掉了,說明框和魔法翻譯欄才一起收起來
                          spellChar = null
                          spellPage = 0
                          lastSpellList = null
                          ui.post {
                              hideHelpBox()
                              if (lastWasSpell) hideOverlay()
                          }
                          if (engine == "aiv" && !auto) return runAiv()
                          val cut = regionRows(readMetrics()[1])[0] - topOffset
                          if (cut > 0 && cut < src.height - 40) {
                              val c = Bitmap.createBitmap(src, 0, cut, src.width, src.height - cut)
                              try {
                                  return recognizeAndTranslate(c, topOffset + cut, auto, true)
                              } finally {
                                  c.recycle()
                              }
                          }
                      }
                  }
                  if (engine != "online" && engine != "ai" && engine != "aiv" && engine != "aifirst") {
                      try {
                          Tasks.await(tr.downloadModelIfNeeded(DownloadConditions.Builder().build()), 90, TimeUnit.SECONDS)
                      } catch (e: Exception) {
                          if (engine == "offline") {
                              throw IllegalStateException("尚未下載翻譯模型,請回主畫面按「②」")
                          }
                      }
                  }

                  // 同一張畫面做多種版本再各自辨識:原圖、放大加強對比、放大反相、只留金色字
                  val variants = ArrayList<Pair<Bitmap, Float>>()
                  variants.add(Pair(src, 1f))
                  variants.add(Pair(enhance(src, 2f, 1.8f), 2f))
                  if (!menuFrame) {
                      // 魔法選單 / HELP 的字是白字或粉紅字,不需要反相和金色版本,少做兩個比較快
                      variants.add(Pair(goldMask(src, 2f), 2f))
                  }

                  val raw = StringBuilder()
                  val cands = ArrayList<Cand>()
                  var helpRect: Rect? = null
                  var pageNoRaw: Int? = null
                  try {
                      // 4 種版本同時送去辨識,比一個一個等快很多
                      ui.post { setLabel("辨") }
                      val jobs = ArrayList<com.google.android.gms.tasks.Task<com.google.mlkit.vision.text.Text>?>()
                      for (vi in variants.indices) {
                          jobs.add(
                              try {
                                  rec.process(InputImage.fromBitmap(variants[vi].first, 0))
                              } catch (e: Exception) {
                                  null
                              }
                          )
                      }
                      for (vi in variants.indices) {
                          val job = jobs[vi] ?: continue
                          val scale = variants[vi].second
                          val text = try {
                              Tasks.await(job, 40, TimeUnit.SECONDS)
                          } catch (e: Exception) {
                              null
                          }
                          if (text == null) continue
                          raw.append(text.text.replace("\n", " ")).append(" | ")
                          for (b in text.textBlocks) {
                              for (ln in b.lines) {
                                  val box = ln.boundingBox ?: continue
                                  val up = ln.text.uppercase()
                                  if (pageNoRaw == null) {
                                      val mm = Regex("PAGE\\s*([0-9])\\s*/\\s*[0-9]").find(up)
                                      if (mm != null) pageNoRaw = mm.groupValues[1].toInt()
                                  }
                                  if (helpRect == null && (up.contains("HELP") || (up.contains("NEXT") && up.contains("END")))) {
                                      helpRect = Rect(
                                          (box.left / scale).toInt(),
                                          (box.top / scale).toInt() + topOffset,
                                          (box.right / scale).toInt(),
                                          (box.bottom / scale).toInt() + topOffset
                                      )
                                  }
                                  val jp = cleanLine(ln.text) ?: continue
                                  if (!isJapanese(jp)) continue
                                  val r = Rect(
                                      (box.left / scale).toInt(),
                                      (box.top / scale).toInt() + topOffset,
                                      (box.right / scale).toInt(),
                                      (box.bottom / scale).toInt() + topOffset
                                  )
                                  cands.add(Cand(vi, Blk(r, jp, maxOf(1, r.height()))))
                              }
                          }
                      }
                  } finally {
                      for (v in variants) {
                          if (v.first !== src) v.first.recycle()
                      }
                  }
                  lastRaw = raw.toString()
                  lastOcrMs = SystemClock.uptimeMillis() - tStart
                  var blocks = pickBestRows(cands)
                  // 戰鬥畫面下方的角色數值欄 (リナ 135/135 ...):整欄都是名字和數字,不是對話,不要翻
                  if (!menuFrame) {
                      val nSlash = Regex("[0-9]{2,3}\\s*[/／]").findAll(lastRaw).count()
                      val nNum = Regex("[0-9]{3}").findAll(lastRaw).count()
                      if (nSlash >= 1 || nNum >= 4) {
                          blocks = ArrayList(blocks.filter { x -> x.text.length >= 5 && !SpellGuide.onlyNames(x.text) && x.text.count { c -> c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF' } >= 2 })
                      }
                  }

                  // HELP 說明:標題列下面那幾行是說明文字,單獨翻譯,顯示在另一個說明框 (黃框位置),跟 HELP 一起開關
                  var helpZh: String? = null
                  var helpJp = ""
                  val hb0 = helpBoxRect
                  if (hb0 != null) blocks = ArrayList(blocks.filter { x -> !Rect.intersects(x.rect, hb0) })
                  val hr = helpRect
                  if (hr != null) {
                      val lim = hr.bottom + maxOf(260, 10 * hr.height())
                      val body = blocks.filter { x -> x.rect.top >= hr.bottom - 4 && x.rect.top <= lim }.sortedBy { x -> x.rect.top }
                      blocks = ArrayList(blocks.filter { x -> !body.contains(x) })
                      helpJp = body.joinToString("") { x -> x.text }.replace(Regex("[·・.．…‥•]{2,}"), "・・・")
                      if (helpJp.length >= 4) {
                          val fixed = SpellGuide.helpText(applicationContext, helpJp)
                          if (fixed != null) {
                              helpZh = fixed
                          } else if (lastHelpZh.isNotEmpty() && SpellGuide.helpHead(helpJp) == SpellGuide.helpHead(lastHelpJp) && (helpJp == lastHelpJp || (lastHelpJp.isNotEmpty() && levDist(helpJp, lastHelpJp) <= maxOf(2, maxOf(helpJp.length, lastHelpJp.length) / 5)))) {
                              helpZh = lastHelpZh
                          } else {
                              try {
                                  // 魔法名稱用固定譯名,效果說明照畫面內容翻譯
                                  val sh = SpellGuide.splitHelp(applicationContext, helpJp)
                                  val z = if (sh != null && sh.second.length >= 4) sh.first + ":" + translateHelpPart(tr, sh.second, engine) else if (sh != null) sh.first else translateHelpPart(tr, helpJp, engine)
                                  if (z.isNotBlank()) {
                                      helpZh = z
                                      lastHelpJp = helpJp
                                      lastHelpZh = z
                                  }
                              } catch (e: Exception) {
                                  helpZh = null
                              }
                          }
                      }
                      val hz = helpZh
                      if (hz != null) {
                          val bodyBottom = body.maxOfOrNull { x -> x.rect.bottom } ?: hr.bottom
                          val top = maxOf(bodyBottom + 10, hr.bottom + (hr.height() * 4.8f).toInt())
                          if (src.height + topOffset - top > 100) {
                              val br = Rect(src.width / 20, top, src.width - src.width / 20, top + 100)
                              ui.post { showHelpBox(hz, br, helpJp) }
                          }
                      } else {
                          ui.post { helpMissed() }
                      }
                  } else {
                      ui.post { helpMissed() }
                  }

                  // 魔法選單:辨識到魔法名稱就顯示中文名、範圍、消耗 MP 和效果,不去翻譯
                  val spellHits = ArrayList<SpellGuide.Spell>()
                  val spellMiss = ArrayList<String>()
                  for (b in blocks.sortedBy { x -> x.rect.top }) {
                      val sp = SpellGuide.match(applicationContext, b.text)
                      if (sp != null) {
                          if (spellHits.none { x -> x.key == sp.key }) spellHits.add(sp)
                      } else if (SpellGuide.charOf(b.text) == null) {
                          // 像魔法名稱、但資料裡找不到的,照原文列出來,不要默默漏掉
                          val t = SpellGuide.stripIcon(b.text.replace(" ", "").replace("　", ""))
                          val k = t.count { c -> c in '゠'..'ヿ' }
                          if (k >= 5 && k * 10 >= t.length * 7 && spellMiss.none { m -> m == t }) spellMiss.add(t)
                      }
                  }
                  val spellMode = prefs.getBoolean("spell_mode", false)
                  // 畫面上有「呪文をえらんでね」就是魔法選單,認不出來的行不要當對話亂翻
                  val spellBanner = spellMode && blocks.any { x -> x.text.contains("えらんで") || x.text.contains("呪文を") }
                  // 左邊狀態欄的角色名稱 (最上面那個)
                  var who: String? = null
                  var whoTop = Int.MAX_VALUE
                  for (b in blocks) {
                      val zhName = SpellGuide.charOf(b.text) ?: continue
                      if (b.rect.top < whoTop) {
                          whoTop = b.rect.top
                          who = zhName
                      }
                  }
                  val nowMs = SystemClock.uptimeMillis()
                  if (who != null) {
                      spellChar = who
                      spellCharAt = nowMs
                  }
                  // 這一幀沒看到角色名稱時,沿用 20 秒內看到的 (HELP 蓋住選單時用)
                  val cur = spellChar
                  val rawPage = pageNoRaw
                  if (rawPage != null) {
                      spellPage = rawPage
                      spellPageAt = nowMs
                  }
                  val pageNo: Int? = if (rawPage != null) rawPage else if (spellPage > 0) spellPage else null
                  // 知道角色和頁碼就直接用那一頁的固定清單,不管這一幀認得出幾個魔法名稱
                  val fixedPage = if (spellMode && menuFrame && cur != null && pageNo != null) SpellGuide.pageFor(applicationContext, cur, spellHits, pageNo) else null
                  // 魔法選單模式開著的時候,一定要先確認畫面上真的有遊戲的魔法選單 (PAGE / HELP / 狀態列),
                  // 戰鬥畫面右上角的招式名稱、對話裡的魔法名稱都不會再讓魔法翻譯欄跑出來
                  val spellAllowed = !spellMode || menuFrame
                  if (spellAllowed && spellBanner && spellHits.isEmpty() && fixedPage == null) return emptyList()
                  if (spellAllowed && (fixedPage != null || spellHits.size >= 2 || (spellHits.size == 1 && (spellMode || spellBanner)))) {
                      val rect = Rect(0, topOffset, src.width, topOffset + src.height)
                      var page = fixedPage ?: SpellGuide.pageFor(applicationContext, cur, spellHits, pageNo)
                      // 這一幀認不出是哪一頁時,如果認到的魔法都在剛才顯示的那一頁裡,就繼續用那一頁 (游標移動時選單字會被辨識錯,避免亂跳)
                      val prevList = lastSpellList
                      if (page == null && prevList != null && spellHits.isNotEmpty() && spellHits.all { h -> prevList.any { x -> x.key == h.key } }) page = prevList
                      if (page != null) lastSpellList = page
                      val listHits: List<SpellGuide.Spell> = page ?: spellHits
                      if (page != null) spellMiss.clear()
                      val zh = listHits.joinToString("\n") { x -> x.name + ":" + x.info.split(" / ").filter { q -> !q.startsWith("MP ") }.joinToString(" / ") }
                      val zhList = if (spellMiss.isEmpty()) zh else zh + "\n" + spellMiss.joinToString("\n") { m -> m + ":(魔法資料裡找不到)" }
                      val zhAll = zhList
                      val res = listOf(ResultView.Item(rect, zhAll, maxOf(1, src.height / 6), "\u0001" + listHits.joinToString(" ") { x -> x.key }))
                      return res
                  }

                  if (helpZh != null) return emptyList()
                  // 戰鬥指令畫面 (PUSH R1/2、攻撃設定、ユニットをえらんでね…):這些是遊戲介面,不是對話,不翻
                  // (魔法選單偵測到了、卻沒有清單可顯示的畫面,剩下的字也一律不當對話翻)
                  if (auto && (menuFrame || Regex("PUSH|R1/2|PAGE[0-9]|STEP[0-9]|HIT[+±]|HELP|C:NEXT|START:END|どこにいどうする|えらんで|ちょっとまって|ただいま戦闘中|攻撃設定|呪文設定|移動設定|行動設定|待機設定|戦闘設定|アイテム設定")
                          .containsMatchIn(lastRaw.replace(" ", "").replace("　", "")))) return emptyList()
                  if (engine == "aiv" && !auto) return runAiv()

                  val out = ArrayList<ResultView.Item>()
                  val merged = merge(blocks)
                  if (auto) {
                      val jpAll = merged.joinToString("") { x -> x.text }
                      val prevItems = shownItems
                      // 畫面上的字比上次顯示的「更長」(逐字長出來的後半句) 就不是同一句,一定要重新處理,不能沿用舊的半句
                      val longer = jpAll.replace(" ", "").length > shownJp.replace(" ", "").length + 1
                      if (prevItems != null && shownJp.isNotEmpty() && !longer && sameSentence(jpAll, shownJp)) return prevItems
                  }
                  ui.post { setLabel("譯") }
                  for (m in merged) {
                      m.text = tidyJp(m.text)
                      if (m.text.length < 2) continue
                      // 只有角色名字、或太短的碎字 (狀態欄的名字、畫面雜訊) 不當對話翻
                      if (auto && (SpellGuide.onlyNames(m.text) || (m.text.length < 3 && m.text.last() !in "。！？!?」』♪♥♡…~～"))) continue
                      if (auto && merged.size == 1) {
                          // 自動模式:辨識完先把整句日文記下來,翻譯丟到背景,辨識不用等翻譯 (也不會因為辨識多吃翻譯次數)
                          out.add(ResultView.Item(m.rect, cacheGet(if (engine == "aiv") "ai" else engine, m.text) ?: "", m.lineH, m.text))
                      } else {
                          out.add(ResultView.Item(m.rect, translateText(tr, m.text, if (engine == "aiv") "ai" else engine), m.lineH, m.text))
                      }
                  }
                  lastTrMs = SystemClock.uptimeMillis() - tStart - lastOcrMs
                  return out
              }

              private fun autoOn(): Boolean =
                  (getSharedPreferences("cfg", Context.MODE_PRIVATE).getString("mode", "auto") ?: "auto") == "auto"

              private var paused = false
              @Volatile
              private var lastOcrMs = 0L
              @Volatile
              private var lastTrMs = 0L

              // 譯文框保留最近 10 段對話,框內可上下滑動看前後文
              private class Hist(var orig: String, var zh: String, var at: Long = SystemClock.uptimeMillis(), var tries: Int = 0)

              private val history = ArrayList<Hist>()
              private var hideQueued = false
              private val emptyHide = Runnable {
                  hideQueued = false
                  hideOverlay()
              }

              private fun pushHistory(list: List<ResultView.Item>) {
                  val orig = list.joinToString(" ") { x -> x.orig }
                  val zh = list.joinToString("\n") { x -> x.text }
                  val last = history.lastOrNull()
                  val nO = orig.replace(" ", "").replace("　", "")
                  val nL = last?.orig?.replace(" ", "")?.replace("　", "") ?: ""
                  // 逐字顯示的對話:上一筆只是這句的開頭 (中間有一兩個字辨識不同也算),就直接換成完整的這一句
                  val sL = nL.filter { c -> c.isLetterOrDigit() }
                  val sO = nO.filter { c -> c.isLetterOrDigit() }
                  // 上一筆沒有句尾標點 = 還沒講完的半句,容許多幾個字辨識不同
                  val lastDone = nL.isNotEmpty() && nL.last() in "。！？!?」』♪♥♡…~～"
                  val tol = if (lastDone) maxOf(1, sL.length / 4) else maxOf(2, sL.length / 3)
                  // 半句的字有 8 成以上都出現在完整句裡 (名字和句子順序不同也算) → 也當作同一句
                  val partOf = last != null && !lastDone && sL.length >= 4 && sL.length < sO.length && run {
                      val bs = (0 until sL.length - 1).map { i -> sL.substring(i, i + 2) }
                      bs.count { b -> sO.contains(b) } * 10 >= bs.size * 8
                  }
                  val grown = last != null && sL.isNotEmpty() && sL.length < sO.length &&
                      (levDist(sL, sO.take(sL.length)) <= tol || partOf)
                  if (last != null && !grown && last.zh != "…" && nO.length <= nL.length + 1 && sameSentence(orig, last.orig)) {
                      // 同一句重新辨識只差一兩個字:保留已經翻好的,不要讓譯文跳來跳去
                      return
                  }
                  if (last != null && (grown || sameSentence(orig, last.orig))) {
                      last.orig = orig
                      last.zh = zh
                      last.at = SystemClock.uptimeMillis()
                      last.tries = 0
                  } else {
                      // 上一句已經講完 (下一句接上來了),不用再等,馬上翻
                      if (last != null && last.zh == "…") scheduleTranslate(last.orig, true, 0L)
                      history.add(Hist(orig, zh))
                      while (history.size > 10) history.removeAt(0)
                  }
              }

              private fun levDist(a: String, b: String): Int {
                  var prev = IntArray(b.length + 1) { j -> j }
                  for (i in 1..a.length) {
                      val cur = IntArray(b.length + 1)
                      cur[0] = i
                      for (j in 1..b.length) {
                          val c = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c)
                      }
                      prev = cur
                  }
                  return prev[b.length]
              }

              private fun renderHistory() {
                  if (history.isEmpty()) return
                  val zhAll = if (history.size == 1) history[0].zh else history.joinToString("\n") { h -> "▸ " + h.zh }
                  showSubtitle(zhAll, history.last().orig)
              }

              // 目前畫面上顯示的那一句 (原文 + 譯文),自動模式下辨識到同一句就不再翻譯
              @Volatile
              private var shownJp = ""
              @Volatile
              private var shownItems: List<ResultView.Item>? = null

              private fun sameSentence(a: String, b: String): Boolean {
                  if (a == b) return true
                  val x = jpBigrams(a)
                  val y = jpBigrams(b)
                  if (x.size < 3 || y.size < 3) return false
                  val inter = x.count { t -> y.contains(t) }
                  val union = x.size + y.size - inter
                  return union > 0 && inter.toFloat() / union >= 0.55f
              }

              private fun pauseAuto() {
                  paused = true
                  ui.removeCallbacks(stableRun)
                  latestCrop?.recycle()
                  latestCrop = null
                  clearAutoQueue()
                  history.clear()
                  ui.removeCallbacks(emptyHide)
                  hideSubtitle()
                  hideGuideHint()
                  hideHelpBox()
                  lastWasSpell = false
                  setLabel(baseLabel())
                  toast("已暫停自動翻譯。短按懸浮球可以恢復")
              }

              private fun resumeAuto() {
                  paused = false
                  curSig = null
                  doneJp = ""
                  shownJp = ""
                  shownItems = null
                  setLabel(baseLabel())
                  toast("已恢復自動翻譯")
              }

              private fun baseLabel(): String = if (paused && autoOn()) "停" else if (autoOn()) "自" else "譯"

              // 魔法選單模式:翻譯範圍往上延伸到畫面最上方,才看得到右上角的魔法清單
              private fun captureRows(h: Int): IntArray {
                  val r = regionRows(h)
                  if (getSharedPreferences("cfg", Context.MODE_PRIVATE).getBoolean("spell_mode", false)) r[0] = 0
                  return r
              }

              // 翻譯範圍 (以螢幕高度的百分比設定),回傳 [上緣, 下緣] 的像素位置
              private fun regionRows(h: Int): IntArray {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val topPct = minOf(90, prefs.getInt("top", 18))
                  val botPct = prefs.getInt("bot", 34)
                  val top = (h.toLong() * topPct / 100).toInt()
                  var bottom = (h.toLong() * botPct / 100).toInt()
                  if (bottom < top + 40) bottom = top + 40
                  if (bottom > h) bottom = h
                  return intArrayOf(top, bottom)
              }

              // 只把翻譯範圍那幾列像素複製成圖片 (比整個螢幕省很多)
              private fun cropRegion(img: android.media.Image, rows: IntArray): Bitmap {
                  val plane = img.planes[0]
                  val ps = plane.pixelStride
                  val rs = plane.rowStride
                  val cropH = rows[1] - rows[0]
                  val wideW = rs / ps
                  val wide = Bitmap.createBitmap(wideW, cropH, Bitmap.Config.ARGB_8888)
                  val buf = plane.buffer
                  buf.position(rs * rows[0])
                  wide.copyPixelsFromBuffer(buf)
                  if (wideW == img.width) return wide
                  val cropped = Bitmap.createBitmap(wide, 0, 0, img.width, cropH)
                  wide.recycle()
                  return cropped
              }

              // 縮成小灰階圖,拿來判斷範圍內的畫面有沒有變化
              private fun signature(b: Bitmap): IntArray {
                  val sw = 160
                  val sh = 48
                  val sm = Bitmap.createScaledBitmap(b, sw, sh, true)
                  val px = IntArray(sw * sh)
                  sm.getPixels(px, 0, sw, 0, 0, sw, sh)
                  if (sm !== b) sm.recycle()
                  val out = IntArray(px.size)
                  for (i in px.indices) {
                      val c = px[i]
                      val r = (c shr 16) and 0xFF
                      val g = (c shr 8) and 0xFF
                      val bl = c and 0xFF
                      out[i] = (r * 3 + g * 6 + bl) / 10
                  }
                  return out
              }

              private fun sigDiff(a: IntArray, b: IntArray): Int {
                  var n = 0
                  for (i in a.indices) {
                      if (Math.abs(a[i] - b[i]) > 40) n++
                  }
                  return n
              }

              private fun onAutoFrame(crop: Bitmap, top: Int) {
                  if (button == null || !autoOn() || paused) {
                      crop.recycle()
                      return
                  }
                  try {
                      ensureDisplay()
                  } catch (e: Exception) {
                      // 忽略
                  }
                  val sig = signature(crop)
                  val prev = curSig
                  if (prev != null && prev.size == sig.size && sigDiff(prev, sig).let { d -> d == 0 || (d <= 6 && System.currentTimeMillis() - lastAcceptAt < 1500L) }) {
                      // 畫面幾乎沒變:留住最新一張,停止變動 0.7 秒後再完整辨識一次,確保逐字出現的最後一個字不會漏掉
                      if (!settleDone) {
                          settleCrop?.recycle()
                          settleCrop = crop
                          if (!settlePosted) {
                              settlePosted = true
                              ui.postDelayed(settleRun, 350)
                          }
                      } else {
                          crop.recycle()
                      }
                      return
                  }
                  // 畫面大幅改變 (按了下一句、整句消失):上一個畫面還沒辨識的最後一張,先排進辨識佇列,不能丟掉
                  val bigChange = prev == null || prev.size != sig.size || sigDiff(prev, sig) > 120
                  if (bigChange && !lastWasSpell && helpBoxRect == null) {
                      val nowT = SystemClock.uptimeMillis()
                      val gap = nowT - statLastChangeAt
                      if (statLastChangeAt > 0 && gap < 20000) {
                          if (gap < statMinGap) statMinGap = gap
                          statGapSum += gap
                          statGapN++
                      }
                      statLastChangeAt = nowT
                      val oldS = settleCrop
                      val old = oldS ?: latestCrop
                      if (old != null) {
                          if (oldS != null) {
                              latestCrop?.recycle()
                              settleCrop = null
                          } else {
                              // latestCrop 就是 old
                          }
                          latestCrop = null
                          autoQueue.addLast(Pair(old, latestTop))
                          while (autoQueue.size > 8) {
                      autoQueue.removeFirst().first.recycle()
                      statDrops++
                  }
                          ui.post { drainAuto() }
                      }
                  }
                  settleDone = false
                  ui.removeCallbacks(settleRun)
                  settlePosted = false
                  settleCrop?.recycle()
                  settleCrop = null
                  lastAcceptAt = System.currentTimeMillis()
                  curSig = sig
                  latestTop = top
                  if (!lastWasSpell && helpBoxRect == null) {
                      // 對話:每一張有變化的畫面都直接排進辨識佇列 (辨識一張只要 0.2~0.5 秒),
                      // 只有 0.1 秒內連續的逐字畫面才合併,所以「這句講完那一刻」的畫面不會被下一句蓋掉
                      val nowQ = SystemClock.uptimeMillis()
                      if (autoQueue.isNotEmpty() && nowQ - slotAt < 100) {
                          autoQueue.pollLast().first.recycle()
                      } else {
                          slotAt = nowQ
                      }
                      autoQueue.addLast(Pair(crop, top))
                      while (autoQueue.size > 8) {
                          autoQueue.removeFirst().first.recycle()
                          statDrops++
                      }
                      if (!autoBusy && !busy) drainAuto()
                      return
                  }
                  latestCrop?.recycle()
                  latestCrop = crop
                  // 魔法選單 / HELP 只看最新畫面,停住 0.2 秒後才辨識
                  ui.removeCallbacks(stableRun)
                  ui.postDelayed(stableRun, 200)
              }

              // 背景翻譯:整句日文已經記在譯文框裡,翻好再換成中文;按太快的句子也會一句一句翻完
              private val trWorker = Executors.newFixedThreadPool(3)

              private var trPending = 0

              // 對話結束後,等排隊中的翻譯都完成;完成後譯文框保留,由使用者按 ✕ 關閉
              private val hideWhenDone = object : Runnable {
                  override fun run() {
                      if (trPending > 0 || history.any { h -> h.zh == "…" }) {
                          ui.postDelayed(this, 500)
                      }
                      // 全部翻完之後譯文框一直留著,由使用者按 ✕ 關閉
                  }
              }

              // 正在翻譯中的原文 (同一句不重複送出)
              private val inflight = HashMap<String, Int>()
              private var sweeping = false

              // 保險:每 1.5 秒檢查一次,還停在「…」又沒有人在翻的句子,補送翻譯 (翻失敗的最多重試 3 次)
              private val sweepRun = object : Runnable {
                  override fun run() {
                      val now = SystemClock.uptimeMillis()
                      var any = false
                      for (h in ArrayList(history)) {
                          if (h.zh != "…") continue
                          any = true
                          if (now - h.at > 1200 && (inflight[h.orig] ?: 0) == 0) scheduleTranslate(h.orig, true)
                      }
                      if (any) ui.postDelayed(this, 1500) else sweeping = false
                  }
              }

              private fun ensureSweep() {
                  if (!sweeping) {
                      sweeping = true
                      ui.postDelayed(sweepRun, 1500)
                  }
              }

              private fun endFlight(jp: String) {
                  val n = (inflight[jp] ?: 1) - 1
                  if (n <= 0) inflight.remove(jp) else inflight[jp] = n
                  trPending--
              }

              // 逐字長出來的句子先不翻:等這句日文停住 0.6 秒沒再變長 (或已經被下一句接上) 才翻完整的那一句
              private fun scheduleTranslate(jp: String, force: Boolean = false, delayMs: Long = 600L) {
                  ensureSweep()
                  val jc = jp.replace(" ", "")
                  if (!force && jc.length < 6 && jc.isNotEmpty() && jc.last() !in "。！？!?」』♪♥♡…~～") return
                  trPending++
                  inflight[jp] = (inflight[jp] ?: 0) + 1
                  ui.postDelayed({
                      // 這一筆已經被更完整的取代 (還在逐字長出來) 就不翻
                      if (history.none { h -> pendingMatch(h, jp) }) {
                          endFlight(jp)
                          return@postDelayed
                      }
                      trWorker.execute {
                          val tr = translator
                          if (tr == null) {
                              ui.post { endFlight(jp) }
                              return@execute
                          }
                          val eng0 = getSharedPreferences("cfg", Context.MODE_PRIVATE).getString("engine", "smart") ?: "smart"
                          val errBox = arrayOf("")
                          val zr: String? = try {
                              translateText(tr, jp, if (eng0 == "aiv") "ai" else eng0)
                          } catch (e: Exception) {
                              errBox[0] = "(翻譯失敗:" + (e.message ?: "未知錯誤").take(40) + ")"
                              null
                          }
                          val err = errBox[0]
                          ui.post {
                              endFlight(jp)
                              if (zr != null && zr.isNotBlank()) {
                                  applyTranslation(jp, zr)
                              } else {
                                  // 失敗:不顯示錯誤字,稍後自動重試,連續 3 次都失敗才顯示
                                  for (h in history) {
                                      if (pendingMatch(h, jp)) {
                                          h.tries++
                                          h.at = SystemClock.uptimeMillis()
                                      }
                                  }
                                  if (history.any { h -> pendingMatch(h, jp) && h.tries >= 3 }) applyTranslation(jp, if (err.isNotEmpty()) err else "(翻譯失敗)")
                              }
                          }
                      }
                  }, delayMs)
              }

              // 等待翻譯的那一筆:一定要原文完全一樣 (半句的舊譯文不能套到後來變完整的句子上)
              private fun pendingMatch(h: Hist, jp: String): Boolean = h.zh == "…" && h.orig == jp

              private fun flushDeferred() {
                  for (h in ArrayList(history)) {
                      if (h.zh == "…") scheduleTranslate(h.orig, true)
                  }
              }

              private fun applyTranslation(jp: String, z: String) {
                  var changed = false
                  for (h in history) {
                      if (pendingMatch(h, jp)) {
                          val lat = SystemClock.uptimeMillis() - h.at
                          statLatSum += lat
                          statLatN++
                          if (lat > statLatMax) statLatMax = lat
                          h.zh = z
                          changed = true
                      }
                  }
                  val items = shownItems
                  if (items != null) {
                      shownItems = items.map { x -> if (x.text == "…" && x.orig == jp) ResultView.Item(x.rect, z, x.lineH, x.orig) else x }
                  }
                  if (changed && autoOn() && !paused && !lastWasSpell) renderHistory()
              }

              // 對話畫面一句一句排隊處理,不會因為還在翻譯上一句就漏掉你已經按過去的下一句
              private val autoQueue = java.util.ArrayDeque<Pair<Bitmap, Int>>()

              private fun clearAutoQueue() {
                  while (true) {
                      val x = autoQueue.pollFirst() ?: break
                      x.first.recycle()
                  }
              }

              private fun runAuto() {
                  val c0 = latestCrop ?: return
                  latestCrop = null
                  // 魔法選單 / HELP 開著的時候只看最新的畫面,舊的不用排隊 (排隊會讓說明晚很久才出來)
                  if (lastWasSpell || helpBoxRect != null) clearAutoQueue()
                  autoQueue.addLast(Pair(c0, latestTop))
                  while (autoQueue.size > 8) {
                      autoQueue.removeFirst().first.recycle()
                      statDrops++
                  }
                  drainAuto()
              }

              private fun drainAuto() {
                  if (autoBusy || busy) {
                      if (autoQueue.isNotEmpty()) ui.postDelayed({ drainAuto() }, 400)
                      return
                  }
                  val item = autoQueue.pollFirst() ?: return
                  val c = item.first
                  autoBusy = true
                  val top = item.second
                  setLabel("…")
                  worker.execute {
                      val result = try {
                          Result.success(recognizeAndTranslate(c, top, true))
                      } catch (e: Exception) {
                          Result.failure<List<ResultView.Item>>(e)
                      }
                      c.recycle()
                      ui.post {
                          autoBusy = false
                          if (autoQueue.isNotEmpty()) ui.post { drainAuto() }
                          setLabel(baseLabel())
                          val list = result.getOrNull()
                          if (list == null) {
                              toast("翻譯失敗:" + (result.exceptionOrNull()?.message ?: result.exceptionOrNull()?.toString() ?: "未知錯誤"))
                          } else if (list.isEmpty()) {
                              doneJp = ""
                              shownJp = ""
                              shownItems = null
                              if (helpBoxRect != null) {
                                  // HELP 說明正在顯示 (只有說明、沒有清單),先不收起來
                                  ui.removeCallbacks(emptyHide)
                              } else if (autoOn()) {
                                  // 對話框消失了,譯文先留著讓你看完,20 秒後自動收起
                                  ui.removeCallbacks(emptyHide)
                                  // 魔法選單還開著的時候 (例如被 HELP 蓋住一半) 不收;選單關了由上面的偵測收起來
                              } else if (history.isNotEmpty()) {
                                  // 對話結束了:後台還在翻的句子要翻完,框才收起來
                                  flushDeferred()
                                  if (!hideQueued) {
                                      hideQueued = true
                                      ui.post(hideWhenDone)
                                  }
                              } else {
                                  hideOverlay()
                              }
                          } else {
                              ui.removeCallbacks(hideWhenDone)
                              ui.removeCallbacks(emptyHide)
                              hideQueued = false
                              val jpNow = list.joinToString("") { x -> x.orig }
                              if (jpNow != doneJp) {
                                  val shownList = list.map { x -> if (x.text.isEmpty()) ResultView.Item(x.rect, "…", x.lineH, x.orig) else x }
                                  doneJp = jpNow
                                  shownJp = jpNow
                                  shownItems = shownList
                                  showResult(shownList)
                                  for (x in list) {
                                      if (x.text.isEmpty()) scheduleTranslate(x.orig)
                                  }
                              }
                          }
                      }
                  }
              }

              // 依設定選擇翻譯方式:線上 (Google 翻譯,直接輸出繁體) / 離線 (ML Kit + 簡轉繁)
              private fun cjkCount(s: String): Int {
                  var n = 0
                  for (c in s) {
                      if (c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF') n++
                  }
                  return n
              }

              private fun bigrams(s: String): Set<String> {
                  val clean = s.filter { c -> c in '\u4E00'..'\u9FFF' }
                  val out = HashSet<String>()
                  for (i in 0 until clean.length - 1) out.add(clean.substring(i, i + 2))
                  return out
              }

              private fun jpBigrams(s: String): Set<String> {
                  val clean = s.filter { c -> c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF' }
                  val out = HashSet<String>()
                  for (i in 0 until clean.length - 1) out.add(clean.substring(i, i + 2))
                  return out
              }

              // 回譯檢查:把 Google 的中文翻回日文,和原句比對。差很多代表翻譯可能偏離原意。回傳相似度 0~1,無法檢查回傳 -1
              private fun backSimilarity(jp: String, zh: String): Float {
                  return try {
                      val back = onlineTranslate(zh, "zh-TW", "ja")
                      val a = jpBigrams(jp)
                      val b = jpBigrams(back)
                      if (a.size < 3 || b.isEmpty()) return -1f
                      val inter = a.count { x -> b.contains(x) }
                      val union = a.size + b.size - inter
                      if (union == 0) -1f else inter.toFloat() / union
                  } catch (e: Exception) {
                      -1f
                  }
              }

              // 判斷 Google 的翻譯有沒有問題。嚴格度 0=寬鬆(省 AI 額度) 1=標準 2=嚴格。回傳原因,正常回傳 null
              private fun suspicious(tr: Translator, jp: String, zh: String): String? {
                  val jl = cjkCount(jp)
                  if (jl == 0) return null
                  val level = getSharedPreferences("cfg", Context.MODE_PRIVATE).getInt("strict", 1)
                  val why = StringBuilder()
                  var hard = false
                  var soft = 0

                  // 一定有問題的跡象 (每個嚴格度都檢查)
                  if (Regex("[A-Za-z]{3,}").containsMatchIn(zh)) {
                      hard = true
                      why.append("夾雜英文 ")
                  }
                  val zl = zh.count { c -> c in '\u4E00'..'\u9FFF' }
                  if (jl >= 6 && (zl < jl * 0.35 || zl > jl * 1.8)) {
                      hard = true
                      why.append("長度不合 ")
                  }
                  if (Regex("[ぁ-ん][ァ-ヶ][ぁ-ん]").containsMatchIn(jp) || Regex("[ぁ-ん][玉王土士][ぁ-んァ-ヶ]").containsMatchIn(jp)) {
                      hard = true
                      why.append("辨識可能有錯字 ")
                  }
                  if (hard) return why.toString().trim()

                  // 回譯檢查:翻回日文後和原句差很多
                  if (jl >= 6) {
                      val sim = backSimilarity(jp, zh)
                      if (sim >= 0f) {
                          val limit = when (level) {
                              0 -> 0.12f
                              1 -> 0.2f
                              else -> 0.3f
                          }
                          if (sim < limit) {
                              return "回譯差很多"
                          }
                      }
                  }

                  // 標準以上:主詞或時間詞憑空冒出來
                  if (level >= 1) {
                      if (zh.contains("我") && !Regex("私|わたし|ワタシ|あたし|僕|ぼく|俺|おれ|われ|我").containsMatchIn(jp)) {
                          soft += 1
                          why.append("主詞可疑 ")
                      }
                      if (Regex("小時候|從前|曾經|以前").containsMatchIn(zh) &&
                          !Regex("昔|子供|子ども|頃|前|かつて|むかし|ちいさ|小さ").containsMatchIn(jp)
                      ) {
                          soft += 1
                          why.append("時間詞可疑 ")
                      }
                      if (soft >= 1) return why.toString().trim()
                  }

                  // 嚴格:口語語尾、長句都換 AI
                  if (level >= 2) {
                      if (Regex("ひょっと|んじゃない|かしら|わね|だわ|じゃん|だよね|ちゃう|ってば|なんて|とか|るわ|のよ|でしょ").containsMatchIn(jp)) {
                          return "口語"
                      }
                      if (jl >= 15 || jp.count { c -> c == '、' } >= 2) return "句子長"
                  }
                  return null
              }

              private val aiHistory = java.util.ArrayDeque<String>()

              private fun rememberAi(zh: String) {
                  aiHistory.addLast(zh)
                  while (aiHistory.size > 3) aiHistory.removeFirst()
              }

              // 譯文快取:同一句 (或 OCR 稍有出入的同一句) 不重複翻,省 AI 額度
              private val trCache = LinkedHashMap<String, String>()
              private val trCacheKeys = java.util.ArrayDeque<String>()

              private fun cacheKey(engine: String, jp: String): String =
                  engine + "|" + jp.filter { c -> c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF' || c in 'A'..'Z' || c in 'a'..'z' }

              private fun cacheGet(engine: String, jp: String): String? {
                  val key = cacheKey(engine, jp)
                  trCache[key]?.let { return it }
                  val mine = jpBigrams(jp)
                  if (mine.size < 4) return null
                  for (k in trCacheKeys) {
                      if (!k.startsWith("$engine|")) continue
                      val other = jpBigrams(k.substring(engine.length + 1))
                      if (other.isEmpty()) continue
                      val inter = mine.count { x -> other.contains(x) }
                      val union = mine.size + other.size - inter
                      if (union > 0 && inter.toFloat() / union >= 0.8f) return trCache[k]
                  }
                  return null
              }

              private fun cachePut(engine: String, jp: String, zh: String) {
                  val key = cacheKey(engine, jp)
                  if (!trCache.containsKey(key)) trCacheKeys.addFirst(key)
                  trCache[key] = zh
                  while (trCacheKeys.size > 120) {
                      val old = trCacheKeys.removeLast()
                      trCache.remove(old)
                  }
              }

              // AI 額度用完 (429) 後暫停一段時間不再呼叫,避免一直失敗

              // guarded = 智慧模式:收到 429 就暫停 AI 1 分鐘。使用者自己選「每句都用 AI」時不暫停,每句都照樣送 AI
              private fun aiCall(jp: String, guarded: Boolean): String? {
                  val cfg = AiClient.config(applicationContext)
                  if (cfg == null || cfg.key.isEmpty()) {
                      if (!guarded) throw IllegalStateException("還沒設定 AI 金鑰,請回主畫面填寫,或到選單改用線上/離線翻譯")
                      return null
                  }
                  if (guarded) {
                      val denied = AiQuota.tryAcquire(applicationContext)
                      if (denied != null) return null
                  }
                  return try {
                      val z = AiClient.translateText(applicationContext, jp, aiHistory.toList())
                      val fixed = Glossary.fix(applicationContext, z)
                      rememberAi(fixed)
                      fixed
                  } catch (e: Exception) {
                      val msg = e.message ?: e.toString()
                      if (msg.contains("429")) {
                          if (guarded) {
                              AiQuota.onServer429(applicationContext, msg)
                              ui.post { toast("AI 額度滿了 (429),暫停 AI 1 分鐘,這段先用 Google 翻譯") }
                          } else {
                              // 使用者自己選了「每句都用 AI」,額度滿了不自動換翻譯方式,由使用者到選單自己切換
                              throw IllegalStateException("AI 額度滿了 (429),請到選單改用線上或離線翻譯")
                          }
                      } else {
                          if (guarded && (msg.contains("503") || msg.contains("UNAVAILABLE", true) || msg.contains("overloaded", true))) {
                              AiQuota.onServerBusy()
                          }
                          if (!guarded) throw IllegalStateException("AI 失敗:" + msg.take(60) + " (可到選單改用線上或離線翻譯)")
                          ui.post { toast("AI 失敗,改用 Google 翻譯:" + msg.take(60)) }
                      }
                      null
                  }
              }

              private var lastAivSig: IntArray? = null
              private var lastAivResult: List<ResultView.Item>? = null

              private fun translateText(tr: Translator, jp0: String, engine: String): String {
                  val hit = cacheGet(engine, jp0)
                  if (hit != null) return hit
                  val z = translateUncached(tr, jp0, engine)
                  cachePut(engine, jp0, z)
                  return z
              }

              private val checker = Executors.newSingleThreadExecutor()

              private fun scheduleSmartCheck(tr: Translator, jp: String, z1: String) {
                  checker.execute {
                      val why = try {
                          suspicious(tr, jp, z1)
                      } catch (e: Exception) {
                          null
                      }
                      if (why == null) {
                          rememberAi(z1)
                          return@execute
                      }
                      val ai = aiCall(jp, true) ?: return@execute
                      cachePut("smart", jp, ai)
                      ui.post { upgradeShown(jp, z1, ai) }
                  }
              }

              // 背景檢查發現 Google 翻得怪、AI 翻好了,就把畫面上的譯文換成 AI 的
              private fun upgradeShown(jp: String, old: String, ai: String) {
                  var changed = false
                  for (h in history) {
                      if (h.zh.contains(old)) {
                          h.zh = h.zh.replace(old, ai)
                          changed = true
                      }
                  }
                  val items = shownItems
                  if (items != null) {
                      shownItems = items.map { x -> if (x.orig == jp) ResultView.Item(x.rect, ai, x.lineH, x.orig) else x }
                  }
                  // HELP 說明框的譯文被 AI 換成比較好的
                  val hv = helpView
                  val hr0 = helpBoxRect
                  if (hv != null && hr0 != null && hv.visibility == View.VISIBLE) {
                      val curText = hv.text.toString().removePrefix("【說明】").substringBefore("\n")
                      if (curText.contains(old)) showHelpBox(curText.replace(old, ai), hr0)
                  }
                  if (lastHelpZh.contains(old)) lastHelpZh = lastHelpZh.replace(old, ai)
                  if (changed && autoOn() && !paused) renderHistory()
              }

              private fun translateUncached(tr: Translator, jp00: String, engine: String): String {
                  // 專有名詞 (魔法名稱) 一律先換成固定譯名,所有翻譯方式都一樣
                  val jp0 = SpellGuide.replaceNames(applicationContext, jp00)
                  val jp = if (engine == "ai" || engine == "aiv") jp0 else Glossary.pre(applicationContext, jp0)
                  if (engine == "smart") {
                      val z1 = translateText(tr, jp0, "both")
                      if (autoOn()) {
                          // 自動模式:先把 Google 的結果顯示出來,檢查和 AI 在背景進行,有更好的再換掉
                          scheduleSmartCheck(tr, jp0, z1)
                          return z1
                      }
                      val why = suspicious(tr, jp0, z1)
                      if (why == null) {
                          rememberAi(z1)
                          return z1
                      }
                      return aiCall(jp0, true) ?: z1
                  }
                  if (engine == "aifirst") {
                      return aiCall(jp0, true) ?: translateText(tr, jp0, "both")
                  }
                  if (engine == "ai" || engine == "aiv") {
                      return aiCall(jp, false) ?: throw IllegalStateException("AI 沒有回應,請到選單改用線上或離線翻譯")
                  }
                  // 句子很長 (超過 45 字) 才拆開翻,短的前後句一起翻,語氣才會連貫
                  val parts = jp.split(Regex("(?<=[。！？!?…])")).map { x -> x.trim() }.filter { x -> x.isNotEmpty() }
                  if (parts.size >= 3 || (parts.size > 1 && jp.length > 45)) {
                      return parts.joinToString("") { x -> translateOne(tr, x, engine) }
                  }
                  return translateOne(tr, jp, engine)
              }

              // HELP 說明:魔法名稱先換成暗號,翻完再換回固定譯名,避免被翻成羅馬拼音或怪字
              /** 一句一句分開翻 (整段一起丟給翻譯引擎,遇到辨識有缺字的長句常常翻得離譜) */
              private fun translateSentences(tr: Translator, jp: String, engine: String): String {
                  val parts = jp.split("。").map { x -> x.trim() }.filter { x -> x.isNotEmpty() }
                  if (parts.size <= 1) return translateText(tr, jp, engine)
                  return parts.joinToString("") { x -> translateText(tr, x, engine).trimEnd('。', '.', ' ') + "。" }
              }

              private fun translateHelpPart(tr: Translator, jp: String, engine: String): String {
                  val terms = ArrayList<String>()
                  val pre = SpellGuide.replaceNames(applicationContext, jp, terms)
                  if (terms.isEmpty()) return translateSentences(tr, pre, engine)
                  // 「(前面說明)魔法名の○○バージョン。」這種固定句型,直接組句,不交給翻譯引擎重排
                  val pm = Regex("^(.*?)W([0-9]+)Wの(.+?)バ[ー一ｰ-]?ジョン[。.]?$").find(pre.replace(" ", ""))
                  if (pm != null) {
                      val n = pm.groupValues[2].toIntOrNull() ?: 0
                      if (n in 1..terms.size) {
                          val head = pm.groupValues[1]
                          val mid = pm.groupValues[3]
                          val hz = if (head.isBlank()) "" else translateText(tr, head, engine).trimEnd('。', '.', ' ') + "。"
                          val mz = if (mid == "強化") "強化" else translateText(tr, mid, engine).trimEnd('。', '.', ' ')
                          return hz + terms[n - 1] + "的" + mz + "版。"
                      }
                  }
                  val z = translateSentences(tr, pre, engine)
                  val seen = HashSet<Int>()
                  val out = Regex("[Ww]\\s*([0-9]+)\\s*[Ww]").replace(z) { m ->
                      val n = m.groupValues[1].toIntOrNull() ?: 0
                      if (n in 1..terms.size) {
                          seen.add(n)
                          terms[n - 1]
                      } else {
                          m.value
                      }
                  }
                  if (seen.size == terms.size) return out
                  return translateText(tr, SpellGuide.replaceNames(applicationContext, jp), engine)
              }

              private fun translateOne(tr: Translator, jp: String, engine: String): String {
                  val g = Glossary.protect(applicationContext, jp)
                  var protectedResult: String? = null
                  if (g.terms.isNotEmpty()) {
                      protectedResult = Glossary.restore(translateRaw(tr, g.text, engine), g.terms)
                  }
                  // 如果專有名詞的暗號被翻譯引擎吃掉了,就退回不保護的翻譯
                  val result: String = protectedResult ?: translateRaw(tr, jp, engine)
                  return Glossary.fix(applicationContext, result)
              }

              private fun translateRaw(tr: Translator, jp: String, engine: String): String {
                  var err: Exception? = null
                  if (engine != "offline") {
                      try {
                          val z = onlineTranslate(jp)
                          if (z.isNotBlank()) return z
                      } catch (e: Exception) {
                          err = e
                      }
                      if (engine == "online") {
                          throw IllegalStateException("線上翻譯失敗:" + (err?.message ?: err?.toString() ?: "沒有回應") + " (請確認網路)")
                      }
                  }
                  val useEn = cjkCount(jp) == 0
                  val real = if (useEn) enTranslator() else tr
                  if (useEn) {
                      try {
                          Tasks.await(real.downloadModelIfNeeded(DownloadConditions.Builder().build()), 90, TimeUnit.SECONDS)
                      } catch (e: Exception) {
                          throw IllegalStateException("英文離線模型還沒下載,請回主畫面按「②」")
                      }
                  }
                  val zh = Tasks.await(real.translate(jp), 40, TimeUnit.SECONDS)
                  return Traditionalizer.convert(zh)
              }

              private var enTr: Translator? = null

              private fun enTranslator(): Translator {
                  val e = enTr
                  if (e != null) return e
                  val n = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.ENGLISH)
                          .setTargetLanguage(TranslateLanguage.CHINESE)
                          .build()
                  )
                  enTr = n
                  return n
              }

              private fun onlineTranslate(text: String, sl: String = "auto", tl: String = "zh-TW"): String {
                  val url = URL(
                      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + tl + "&dt=t&q=" +
                          URLEncoder.encode(text, "UTF-8")
                  )
                  val c = url.openConnection() as HttpURLConnection
                  c.connectTimeout = 6000
                  c.readTimeout = 8000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0")
                  try {
                      if (c.responseCode != 200) throw IllegalStateException("HTTP " + c.responseCode)
                      val body = c.inputStream.bufferedReader(Charsets.UTF_8).use { r -> r.readText() }
                      val segs = JSONArray(body).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until segs.length()) {
                          val seg = segs.optJSONArray(i) ?: continue
                          if (seg.isNull(0)) continue
                          sb.append(seg.optString(0, ""))
                      }
                      return sb.toString()
                  } finally {
                      c.disconnect()
                  }
              }

              private class Cand(val v: Int, val blk: Blk)

              // 把所有版本辨識到的「行」依高度分成幾列,每一列只採用字數最多的那個版本,避免不同版本的碎片拼成亂碼
              private fun pickBestRows(cands: List<Cand>): ArrayList<Blk> {
                  val sorted = cands.sortedBy { c -> c.blk.rect.centerY() }
                  val rows = ArrayList<ArrayList<Cand>>()
                  for (c in sorted) {
                      val row = rows.lastOrNull { r ->
                          Math.abs(r[0].blk.rect.centerY() - c.blk.rect.centerY()) <= maxOf(r[0].blk.lineH, c.blk.lineH) * 6 / 10
                      }
                      if (row != null) {
                          row.add(c)
                      } else {
                          val nr = ArrayList<Cand>()
                          nr.add(c)
                          rows.add(nr)
                      }
                  }
                  val out = ArrayList<Blk>()
                  for (row in rows) {
                      val score = HashMap<Int, Int>()
                      for (c in row) {
                          var q = 0
                          for (ch in c.blk.text) {
                              if (ch in '\u3040'..'\u30FF') q += 2 else if (ch in '\u4E00'..'\u9FFF') q += 2 else q += 1
                          }
                          if (c.v == 3) q = q * 130 / 100
                          score[c.v] = (score[c.v] ?: 0) + q
                      }
                      var bestV = -1
                      var bestS = -1
                      for (k in score.keys.sorted()) {
                          val sc = score[k] ?: 0
                          if (sc > bestS) {
                              bestS = sc
                              bestV = k
                          }
                      }
                      for (c in row.filter { x -> x.v == bestV }.sortedBy { x -> x.blk.rect.left }) {
                          out.add(c.blk)
                      }
                  }
                  return out
              }

              // 只留下金色的字 (黑字白底),對付疊在雜亂背景上的半透明金色字幕
              private fun goldMask(src: Bitmap, scale: Float): Bitmap {
                  val w = (src.width * scale).toInt()
                  val h = (src.height * scale).toInt()
                  val scaled = Bitmap.createScaledBitmap(src, w, h, true)
                  val px = IntArray(w * h)
                  scaled.getPixels(px, 0, w, 0, 0, w, h)
                  if (scaled !== src) scaled.recycle()
                  val black = 0xFF000000.toInt()
                  val white = 0xFFFFFFFF.toInt()
                  for (i in px.indices) {
                      val c = px[i]
                      val r = (c shr 16) and 0xFF
                      val g = (c shr 8) and 0xFF
                      val b = c and 0xFF
                      val gold = r > 110 && r - b > 55 && g - b > 28 && r + 10 >= g
                      px[i] = if (gold) black else white
                  }
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  out.setPixels(px, 0, w, 0, 0, w, h)
                  return out
              }

