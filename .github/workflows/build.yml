      - name: Download OpenCC dictionaries (簡轉繁字典)
        run: |
          D=app/src/main/assets/opencc
          mkdir -p "$D"
          B=https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary
          ok=1
          for f in STCharacters STPhrases TWVariants; do
            curl -fsSL --retry 3 "$B/$f.txt" -o "$D/$f.txt" || ok=0
          done
          for f in TWPhrasesIT TWPhrasesName TWPhrasesOther TWPhrases; do
            curl -fsSL --retry 3 "$B/$f.txt" -o "$D/$f.txt" || rm -f "$D/$f.txt"
          done
          if [ "$ok" = "0" ]; then
            echo "Direct download failed, trying pip package fallback"
            pip install opencc-python-reimplemented
            P=$(python3 -c "import opencc_python_reimplemented,os;print(os.path.dirname(opencc_python_reimplemented.__file__))")
            find "$P" \( -name 'ST*.txt' -o -name 'TW*.txt' \) -exec cp {} "$D/" \;
          fi
          wc -l "$D"/*.txt
          test -s "$D/STPhrases.txt"
          test -s "$D/STCharacters.txt"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo '## 編譯錯誤摘要 (請截圖這一段)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -n -E '^e: |error:|Execution failed|What went wrong' build.log | cut -c1-300 | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo '---' >> "$GITHUB_STEP_SUMMARY"
            grep -n -A 10 'What went wrong' build.log | cut -c1-300 | head -30 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -n 5 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS-Translator-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (直接下載用)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SS-Translator.apk
          gh release create "v${{ github.run_number }}" SS-Translator.apk \
            --repo "${{ github.repository }}" \
            --title "SS日文翻譯 v${{ github.run_number }}" \
            --notes "下載 SS-Translator.apk 安裝即可。"
