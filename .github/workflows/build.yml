              private var translator: Translator? = null

              private var busy = false
              @Volatile
              private var lastRaw = ""
              @Volatile
              private var lastRegion: Rect? = null
              private val wantFrame = AtomicBoolean(false)

              // ---- 自動翻譯用
              private var lastAutoTs = 0L
              private var curSig: IntArray? = null
              private var latestCrop: Bitmap? = null
              private var latestTop = 0
              private var autoBusy = false
              private var doneJp = ""
              private val stableRun = Runnable { runAuto() }

              // 畫面靜止時 (沒有新影格) 的補救措施
              private val kick = Runnable {
                  if (wantFrame.get()) {
                      try {
                          recreateReader()
                      } catch (e: Exception) {
                          // 忽略,等 giveUp 處理
                      }
                  }
              }
              private val giveUp = Runnable {
                  if (wantFrame.compareAndSet(true, false)) {
                      done("抓不到畫面,請再按一次")
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun toast(msg: String) {
                  Toast.makeText(applicationContext, msg, Toast.LENGTH_SHORT).show()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  bgThread = HandlerThread("ss-capture")
                  bgThread.start()
                  bgHandler = Handler(bgThread.looper)
                  recognizer = TextRecognition.getClient(JapaneseTextRecognizerOptions.Builder().build())
                  translator = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.JAPANESE)
                          .setTargetLanguage(TranslateLanguage.CHINESE)
                          .build()
                  )
                  worker.execute { Traditionalizer.load(applicationContext) }
              }

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent != null && intent.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (projection != null) return START_NOT_STICKY

                  createChannel()
                  val notif = buildNotification()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }

                  val code = intent?.getIntExtra(EXTRA_CODE, 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>(EXTRA_DATA)
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val p: MediaProjection? = try {
                      mpm.getMediaProjection(code, data)
                  } catch (e: Exception) {
                      null
                  }
                  if (p == null) {
                      toast("無法取得螢幕擷取權限")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  p.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          ui.post { stopSelf() }
                      }
                  }, ui)
                  projection = p

                  addButton()
                  if (autoOn()) {
                      try {
                          ensureDisplay()
                      } catch (e: Exception) {
                          toast("無法擷取畫面:" + (e.message ?: e.toString()))
                      }
                  }
                  toast(if (autoOn()) "自動翻譯已啟動" else "翻譯按鈕已啟動")
                  return START_NOT_STICKY
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "翻譯服務", NotificationManager.IMPORTANCE_LOW)
                  )
              }

              @Suppress("DEPRECATION")
              private fun buildNotification(): Notification {
                  val stopIntent = Intent(this, TranslateService::class.java)
                  stopIntent.action = ACTION_STOP
                  val stopPi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("日文翻譯執行中")
                      .setContentText("下拉通知按「停止」可關閉懸浮按鈕")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .addAction(android.R.drawable.ic_delete, "停止", stopPi)
                      .setOngoing(true)
                      .build()
              }

              // ---------------------------------------------------------------- 懸浮按鈕

              private fun addButton() {
                  val size = dp(54)
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(0xCC1E88E5.toInt())

                  val tv = TextView(this)
                  tv.text = baseLabel()
                  tv.textSize = 22f
                  tv.gravity = Gravity.CENTER
                  tv.setTextColor(Color.WHITE)
                  tv.background = bg

                  val lp = WindowManager.LayoutParams(
                      size,
                      size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(8)
                  lp.y = dp(160)

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var dragging = false
                  var longFired = false
                  val longRun = Runnable {
                      longFired = true
                      showMenu()
                  }

                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              startX = lp.x
                              startY = lp.y
                              dragging = false
                              longFired = false
                              ui.postDelayed(longRun, 500)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (!dragging && (Math.abs(dx) > dp(8) || Math.abs(dy) > dp(8))) {
                                  dragging = true
                                  ui.removeCallbacks(longRun)
                              }
                              if (dragging) {
                                  lp.x = startX + dx.toInt()
                                  lp.y = startY + dy.toInt()
                                  try {
                                      wm.updateViewLayout(tv, lp)
                                  } catch (ex: Exception) {
                                      // ignore
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              ui.removeCallbacks(longRun)
                              if (!dragging && !longFired) {
                                  startCapture()
                              }
                          }
                          MotionEvent.ACTION_CANCEL -> {
                              ui.removeCallbacks(longRun)
                          }
                      }
                      true
                  }

                  wm.addView(tv, lp)
                  button = tv
                  buttonLp = lp
              }

              private fun setLabel(s: String) {
                  button?.text = s
              }

              private fun hideOverlay() {
                  val v = overlay
                  if (v != null) {
                      v.items = emptyList()
                      v.region = null
                      v.invalidate()
                  }
                  hideSubtitle()
              }

              // ---------------------------------------------------------------- 擷取畫面

              @Suppress("DEPRECATION")
              private fun readMetrics(): IntArray {
                  val m = DisplayMetrics()
                  val dm = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  dm.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(m)
                  return intArrayOf(m.widthPixels, m.heightPixels, m.densityDpi)
              }

              private fun newReader(w: Int, h: Int): ImageReader {
                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  r.setOnImageAvailableListener({ reader ->
                      val img = try {
                          reader.acquireLatestImage()
                      } catch (e: Exception) {
                          null
                      }
                      if (img != null) {
                          try {
                              if (wantFrame.compareAndSet(true, false)) {
                                  val plane = img.planes[0]
                                  val pixelStride = plane.pixelStride
                                  val rowPadding = plane.rowStride - pixelStride * img.width
                                  val wide = Bitmap.createBitmap(
                                      img.width + rowPadding / pixelStride,
                                      img.height,
                                      Bitmap.Config.ARGB_8888
                                  )
                                  wide.copyPixelsFromBuffer(plane.buffer)
                                  val bmp = if (rowPadding == 0) {
                                      wide
                                  } else {
                                      val cropped = Bitmap.createBitmap(wide, 0, 0, img.width, img.height)
                                      wide.recycle()
                                      cropped
                                  }
                                  ui.post { onFrame(bmp) }
                              } else {
                                  val nowTs = SystemClock.uptimeMillis()
                                  if (nowTs - lastAutoTs >= 350 && autoOn()) {
                                      lastAutoTs = nowTs
                                      try {
                                          val rows = regionRows(img.height)
                                          val crop = cropRegion(img, rows)
                                          val top = rows[0]
                                          ui.post { onAutoFrame(crop, top) }
                                      } catch (e2: Exception) {
                                          // 自動模式下的單次失敗直接略過
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              ui.post { done("擷取失敗:" + (e.message ?: e.toString())) }
                          } finally {
                              img.close()
                          }
                      }
                  }, bgHandler)
                  return r
              }

              private fun ensureDisplay() {
                  val p = projection ?: throw IllegalStateException("projection")
                  val mt = readMetrics()
                  val w = mt[0]
                  val h = mt[1]
                  val dpi = mt[2]
                  val vd = virtualDisplay
                  if (vd == null) {
                      val r = newReader(w, h)
                      imageReader = r
                      virtualDisplay = p.createVirtualDisplay(
                          "ss-translate", w, h, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          r.surface, null, null
                      )
                      capW = w
                      capH = h
                      capDpi = dpi
                  } else if (w != capW || h != capH) {
                      // 螢幕轉向了:調整虛擬螢幕大小
                      val old = imageReader
                      val r = newReader(w, h)
                      imageReader = r
                      vd.resize(w, h, dpi)
                      vd.setSurface(r.surface)
                      old?.close()
                      capW = w
                      capH = h
                      capDpi = dpi
                  }
              }

              private fun recreateReader() {
                  val vd = virtualDisplay ?: return
                  val old = imageReader
                  val r = newReader(capW, capH)
                  imageReader = r
                  vd.setSurface(r.surface)
                  old?.close()
              }

              private fun startCapture() {
                  if (busy) return
                  busy = true
                  setLabel("…")
                  overlay?.visibility = View.INVISIBLE
                  button?.visibility = View.INVISIBLE
                  // 等一下讓疊加層真的消失,畫面才不會拍到譯文/按鈕
                  ui.postDelayed({
                      try {
                          ensureDisplay()
                      } catch (e: Exception) {
                          done("無法擷取畫面:" + (e.message ?: e.toString()))
                          return@postDelayed
                      }
                      wantFrame.set(true)
                      ui.postDelayed(kick, 700)
                      ui.postDelayed(giveUp, 2800)
                  }, 250)
              }

              private fun done(msg: String?) {
                  button?.visibility = View.VISIBLE
                  overlay?.visibility = View.VISIBLE
                  setLabel(baseLabel())
                  busy = false
                  if (msg != null) toast(msg)
              }

              private fun onFrame(bmp: Bitmap) {
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  button?.visibility = View.VISIBLE
                  worker.execute {
                      val result = try {
                          Result.success(process(bmp))
                      } catch (e: Exception) {
                          Result.failure<List<ResultView.Item>>(e)
                      }
                      bmp.recycle()
                      ui.post {
                          val list = result.getOrNull()
                          if (list == null) {
                              done("翻譯失敗:" + (result.exceptionOrNull()?.message ?: result.exceptionOrNull()?.toString() ?: "未知錯誤"))
                          } else if (list.isEmpty()) {
                              showResult(emptyList())
                              done("沒有辨識到日文" + (if (lastRaw.length > 6) "\n讀到:" + lastRaw.take(60) else ""))
                          } else {
                              showResult(list)
                              done(null)
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- 辨識 + 翻譯

              private fun process(full: Bitmap): List<ResultView.Item> {
                  val rows = regionRows(full.height)
                  val topOffset = rows[0]
                  val cropH = rows[1] - rows[0]
                  val src = if (cropH != full.height) {
                      Bitmap.createBitmap(full, 0, topOffset, full.width, cropH)
                  } else {
                      full
                  }
                  try {
                      return recognizeAndTranslate(src, topOffset)
                  } finally {
                      if (src !== full) src.recycle()
                  }
              }

              // src 是「翻譯範圍」裁切出來的圖,topOffset 是它在整個螢幕上的 y 位置。src 由呼叫的人負責回收。
              private fun recognizeAndTranslate(src: Bitmap, topOffset: Int): List<ResultView.Item> {
                  lastRegion = Rect(0, topOffset, src.width, topOffset + src.height)
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val engine = prefs.getString("engine", "both") ?: "both"

                  val tr = translator ?: throw IllegalStateException("translator")
                  val rec = recognizer ?: throw IllegalStateException("recognizer")

                  if (engine == "aiv") {
                      try {
                          ui.post { setLabel("AI") }
                          val r = AiClient.translateImage(applicationContext, src, aiHistory.toList())
                          if (r == null) return emptyList()
                          val zh = Glossary.fix(applicationContext, r.second)
                          rememberAi(zh)
                          val rect = Rect(0, topOffset, src.width, topOffset + src.height)
                          return listOf(ResultView.Item(rect, zh, maxOf(1, src.height / 3), r.first))
                      } catch (e: Exception) {
                          ui.post { toast("AI 看圖失敗,改用文字辨識:" + (e.message ?: e.toString())) }
                      }
                  }
                  if (engine != "online" && engine != "ai" && engine != "aiv") {
                      try {
                          Tasks.await(tr.downloadModelIfNeeded(DownloadConditions.Builder().build()), 90, TimeUnit.SECONDS)
                      } catch (e: Exception) {
                          if (engine == "offline") {
                              throw IllegalStateException("尚未下載翻譯模型,請回主畫面按「②」")
                          }
                      }
                  }

                  // 同一張畫面做多種版本再各自辨識:原圖、放大加強對比、放大反相、只留金色字
                  val variants = ArrayList<Pair<Bitmap, Float>>()
                  variants.add(Pair(src, 1f))
                  variants.add(Pair(enhance(src, 2f, 1.8f), 2f))
                  variants.add(Pair(enhance(src, 2f, -1.8f), 2f))
                  variants.add(Pair(goldMask(src, 2f), 2f))

                  val raw = StringBuilder()
                  val cands = ArrayList<Cand>()
                  try {
                      for (vi in variants.indices) {
                          val stepNow = vi + 1
                          val total = variants.size
                          ui.post { setLabel(stepNow.toString() + "/" + total) }
                          val bmp = variants[vi].first
                          val scale = variants[vi].second
                          val text = try {
                              Tasks.await(rec.process(InputImage.fromBitmap(bmp, 0)), 40, TimeUnit.SECONDS)
                          } catch (e: Exception) {
                              null
                          }
                          if (text == null) continue
                          raw.append(text.text.replace("\n", " ")).append(" | ")
                          for (b in text.textBlocks) {
                              for (ln in b.lines) {
                                  val box = ln.boundingBox ?: continue
                                  val jp = ln.text.replace(" ", "").replace("　", "")
                                  if (!isJapanese(jp)) continue
                                  val r = Rect(
                                      (box.left / scale).toInt(),
                                      (box.top / scale).toInt() + topOffset,
                                      (box.right / scale).toInt(),
                                      (box.bottom / scale).toInt() + topOffset
                                  )
                                  cands.add(Cand(vi, Blk(r, jp, maxOf(1, r.height()))))
                              }
                          }
                      }
                  } finally {
                      for (v in variants) {
                          if (v.first !== src) v.first.recycle()
                      }
                  }
                  lastRaw = raw.toString()
                  val blocks = pickBestRows(cands)

                  val out = ArrayList<ResultView.Item>()
                  ui.post { setLabel("譯") }
                  for (m in merge(blocks)) {
                      out.add(ResultView.Item(m.rect, translateText(tr, m.text, engine), m.lineH, m.text))
                  }
                  return out
              }

              private fun autoOn(): Boolean =
                  (getSharedPreferences("cfg", Context.MODE_PRIVATE).getString("mode", "auto") ?: "auto") == "auto"

              private fun baseLabel(): String = if (autoOn()) "自" else "譯"

              // 翻譯範圍 (以螢幕高度的百分比設定),回傳 [上緣, 下緣] 的像素位置
              private fun regionRows(h: Int): IntArray {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val topPct = minOf(90, prefs.getInt("top", 18))
                  val botPct = prefs.getInt("bot", 34)
                  val top = (h.toLong() * topPct / 100).toInt()
                  var bottom = (h.toLong() * botPct / 100).toInt()
                  if (bottom < top + 40) bottom = top + 40
                  if (bottom > h) bottom = h
                  return intArrayOf(top, bottom)
              }

              // 只把翻譯範圍那幾列像素複製成圖片 (比整個螢幕省很多)
              private fun cropRegion(img: android.media.Image, rows: IntArray): Bitmap {
                  val plane = img.planes[0]
                  val ps = plane.pixelStride
                  val rs = plane.rowStride
                  val cropH = rows[1] - rows[0]
                  val wideW = rs / ps
                  val wide = Bitmap.createBitmap(wideW, cropH, Bitmap.Config.ARGB_8888)
                  val buf = plane.buffer
                  buf.position(rs * rows[0])
                  wide.copyPixelsFromBuffer(buf)
                  if (wideW == img.width) return wide
                  val cropped = Bitmap.createBitmap(wide, 0, 0, img.width, cropH)
                  wide.recycle()
                  return cropped
              }

              // 縮成小灰階圖,拿來判斷範圍內的畫面有沒有變化
              private fun signature(b: Bitmap): IntArray {
                  val sw = 160
                  val sh = 48
                  val sm = Bitmap.createScaledBitmap(b, sw, sh, true)
                  val px = IntArray(sw * sh)
                  sm.getPixels(px, 0, sw, 0, 0, sw, sh)
                  if (sm !== b) sm.recycle()
                  val out = IntArray(px.size)
                  for (i in px.indices) {
                      val c = px[i]
                      val r = (c shr 16) and 0xFF
                      val g = (c shr 8) and 0xFF
                      val bl = c and 0xFF
                      out[i] = (r * 3 + g * 6 + bl) / 10
                  }
                  return out
              }

              private fun sigDiff(a: IntArray, b: IntArray): Int {
                  var n = 0
                  for (i in a.indices) {
                      if (Math.abs(a[i] - b[i]) > 40) n++
                  }
                  return n
              }

              private fun onAutoFrame(crop: Bitmap, top: Int) {
                  if (button == null || !autoOn()) {
                      crop.recycle()
                      return
                  }
                  try {
                      ensureDisplay()
                  } catch (e: Exception) {
                      // 忽略
                  }
                  val sig = signature(crop)
                  val prev = curSig
                  if (prev != null && prev.size == sig.size && sigDiff(prev, sig) <= 6) {
                      crop.recycle()
                      return
                  }
                  curSig = sig
                  latestCrop?.recycle()
                  latestCrop = crop
                  latestTop = top
                  // 字幕還在跑的時候一直重設計時,停住 0.7 秒後才開始辨識
                  ui.removeCallbacks(stableRun)
                  ui.postDelayed(stableRun, 700)
              }

              private fun runAuto() {
                  val c = latestCrop ?: return
                  if (autoBusy || busy) {
                      ui.postDelayed(stableRun, 500)
                      return
                  }
                  autoBusy = true
                  latestCrop = null
                  val top = latestTop
                  setLabel("…")
                  worker.execute {
                      val result = try {
                          Result.success(recognizeAndTranslate(c, top))
                      } catch (e: Exception) {
                          Result.failure<List<ResultView.Item>>(e)
                      }
                      c.recycle()
                      ui.post {
                          autoBusy = false
                          setLabel(baseLabel())
                          val list = result.getOrNull()
                          if (list == null) {
                              toast("翻譯失敗:" + (result.exceptionOrNull()?.message ?: result.exceptionOrNull()?.toString() ?: "未知錯誤"))
                          } else if (list.isEmpty()) {
                              doneJp = ""
                              hideOverlay()
                          } else {
                              val jpNow = list.joinToString("") { x -> x.orig }
                              if (jpNow != doneJp) {
                                  doneJp = jpNow
                                  showResult(list)
                              }
                          }
                      }
                  }
              }

              // 依設定選擇翻譯方式:線上 (Google 翻譯,直接輸出繁體) / 離線 (ML Kit + 簡轉繁)
              private val aiHistory = java.util.ArrayDeque<String>()

              private fun rememberAi(zh: String) {
                  aiHistory.addLast(zh)
                  while (aiHistory.size > 3) aiHistory.removeFirst()
              }

              private fun translateText(tr: Translator, jp: String, engine: String): String {
                  if (engine == "ai" || engine == "aiv") {
                      try {
                          val z = AiClient.translateText(applicationContext, jp, aiHistory.toList())
                          val fixed = Glossary.fix(applicationContext, z)
                          rememberAi(fixed)
                          return fixed
                      } catch (e: Exception) {
                          ui.post { toast("AI 翻譯失敗,改用一般翻譯:" + (e.message ?: e.toString())) }
                          return translateText(tr, jp, "both")
                      }
                  }
                  val g = Glossary.protect(applicationContext, jp)
                  var protectedResult: String? = null
                  if (g.terms.isNotEmpty()) {
                      protectedResult = Glossary.restore(translateRaw(tr, g.text, engine), g.terms)
                  }
                  // 如果專有名詞的暗號被翻譯引擎吃掉了,就退回不保護的翻譯
                  val result: String = protectedResult ?: translateRaw(tr, jp, engine)
                  return Glossary.fix(applicationContext, result)
              }

              private fun translateRaw(tr: Translator, jp: String, engine: String): String {
                  var err: Exception? = null
                  if (engine != "offline") {
                      try {
                          val z = onlineTranslate(jp)
                          if (z.isNotBlank()) return z
                      } catch (e: Exception) {
                          err = e
                      }
                      if (engine == "online") {
                          throw IllegalStateException("線上翻譯失敗:" + (err?.message ?: err?.toString() ?: "沒有回應") + " (請確認網路)")
                      }
                  }
                  val zh = Tasks.await(tr.translate(jp), 40, TimeUnit.SECONDS)
                  return Traditionalizer.convert(zh)
              }

              private fun onlineTranslate(text: String): String {
                  val url = URL(
                      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=zh-TW&dt=t&q=" +
                          URLEncoder.encode(text, "UTF-8")
                  )
                  val c = url.openConnection() as HttpURLConnection
                  c.connectTimeout = 6000
                  c.readTimeout = 8000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0")
                  try {
                      if (c.responseCode != 200) throw IllegalStateException("HTTP " + c.responseCode)
                      val body = c.inputStream.bufferedReader(Charsets.UTF_8).use { r -> r.readText() }
                      val segs = JSONArray(body).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until segs.length()) {
                          val seg = segs.optJSONArray(i) ?: continue
                          if (seg.isNull(0)) continue
                          sb.append(seg.optString(0, ""))
                      }
                      return sb.toString()
                  } finally {
                      c.disconnect()
                  }
              }

              private class Cand(val v: Int, val blk: Blk)

              // 把所有版本辨識到的「行」依高度分成幾列,每一列只採用字數最多的那個版本,避免不同版本的碎片拼成亂碼
              private fun pickBestRows(cands: List<Cand>): ArrayList<Blk> {
                  val sorted = cands.sortedBy { c -> c.blk.rect.centerY() }
                  val rows = ArrayList<ArrayList<Cand>>()
                  for (c in sorted) {
                      val row = rows.lastOrNull { r ->
                          Math.abs(r[0].blk.rect.centerY() - c.blk.rect.centerY()) <= maxOf(r[0].blk.lineH, c.blk.lineH) * 6 / 10
                      }
                      if (row != null) {
                          row.add(c)
                      } else {
                          val nr = ArrayList<Cand>()
                          nr.add(c)
                          rows.add(nr)
                      }
                  }
                  val out = ArrayList<Blk>()
                  for (row in rows) {
                      val score = HashMap<Int, Int>()
                      for (c in row) {
                          score[c.v] = (score[c.v] ?: 0) + c.blk.text.length
                      }
                      var bestV = -1
                      var bestS = -1
                      for (k in score.keys.sorted()) {
                          val sc = score[k] ?: 0
                          if (sc > bestS) {
                              bestS = sc
                              bestV = k
                          }
                      }
                      for (c in row.filter { x -> x.v == bestV }.sortedBy { x -> x.blk.rect.left }) {
                          out.add(c.blk)
                      }
                  }
                  return out
              }

              // 只留下金色的字 (黑字白底),對付疊在雜亂背景上的半透明金色字幕
              private fun goldMask(src: Bitmap, scale: Float): Bitmap {
                  val w = (src.width * scale).toInt()
                  val h = (src.height * scale).toInt()
                  val scaled = Bitmap.createScaledBitmap(src, w, h, true)
                  val px = IntArray(w * h)
                  scaled.getPixels(px, 0, w, 0, 0, w, h)
                  if (scaled !== src) scaled.recycle()
                  val black = 0xFF000000.toInt()
                  val white = 0xFFFFFFFF.toInt()
                  for (i in px.indices) {
                      val c = px[i]
                      val r = (c shr 16) and 0xFF
                      val g = (c shr 8) and 0xFF
                      val b = c and 0xFF
                      val gold = r > 110 && r - b > 55 && g - b > 28 && r + 10 >= g
                      px[i] = if (gold) black else white
                  }
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  out.setPixels(px, 0, w, 0, 0, w, h)
                  return out
              }

              // ---------------------------------------------------------------- 可移動的譯文框 (自動模式)

              private fun bringButtonToFront() {
                  val b = button
                  val blp = buttonLp
                  if (b != null && blp != null) {
                      try {
                          wm.removeView(b)
                          wm.addView(b, blp)
                      } catch (e: Exception) {
