          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.util.TypedValue
          import android.view.View

          /**
           * 全螢幕透明疊加層:在原本日文文字的位置畫上翻譯後的繁體中文。
           * 座標是「螢幕座標」(與螢幕擷取的圖片相同)。
           * 譯文上方用小字顯示辨識到的日文原文,方便檢查是不是讀錯字。
           */
          class ResultView(context: Context) : View(context) {

              class Item(val rect: Rect, val text: String, val lineH: Int, val orig: String = "")

              var items: List<Item> = emptyList()
              var region: Rect? = null
              var showOrig: Boolean = true

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xE6101820.toInt()
              }
              private val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
              }
              private val origPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFD54F.toInt()
              }
              private val framePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0x99FFEB3B.toInt()
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
              }

              private fun sp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, v, resources.displayMetrics)

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)

              private fun makeLayout(paint: TextPaint, text: String, size: Float, width: Int): StaticLayout {
                  paint.textSize = size
                  return StaticLayout.Builder.obtain(text, 0, text.length, paint, width)
                      .setAlignment(Layout.Alignment.ALIGN_NORMAL)
                      .build()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  val loc = IntArray(2)
                  getLocationOnScreen(loc)
                  canvas.save()
                  canvas.translate(-loc[0].toFloat(), -loc[1].toFloat())

                  val reg = region
                  if (reg != null) {
                      canvas.drawRect(RectF(reg), framePaint)
                  }
                  if (items.isEmpty()) {
                      canvas.restore()
                      return
                  }

                  val screenW = (width + loc[0]).toFloat()
                  val screenH = (height + loc[1]).toFloat()
                  val pad = dp(6f)
                  val minSize = sp(11f)
                  val maxSize = sp(26f)

                  for (item in items) {
                      val r = item.rect
                      val boxW = maxOf(r.width().toFloat(), dp(140f))
                      val innerW = maxOf(1, (boxW - 2 * pad).toInt())
                      val withOrig = showOrig && item.orig.isNotEmpty()

                      var size = minOf(item.lineH * 0.85f, maxSize)
                      if (size < minSize) size = minSize
                      var layout = makeLayout(textPaint, item.text, size, innerW)
                      var oLayout: StaticLayout? = if (withOrig) makeLayout(origPaint, item.orig, size * 0.6f, innerW) else null
                      while (layout.height + (oLayout?.height ?: 0) + 2 * pad > r.height() && size > minSize) {
                          size -= 1f
                          layout = makeLayout(textPaint, item.text, size, innerW)
                          oLayout = if (withOrig) makeLayout(origPaint, item.orig, size * 0.6f, innerW) else null
                      }

                      val ol = oLayout
                      val contentH = layout.height + (ol?.height ?: 0)
                      val boxH = maxOf(r.height().toFloat(), contentH + 2 * pad)
                      var left = r.left.toFloat()
                      var top = r.top.toFloat()
                      if (left + boxW > screenW) left = screenW - boxW
                      if (left < 0f) left = 0f
                      if (top + boxH > screenH) top = screenH - boxH
                      if (top < 0f) top = 0f

                      canvas.drawRoundRect(RectF(left, top, left + boxW, top + boxH), dp(6f), dp(6f), bgPaint)
                      canvas.save()
                      canvas.translate(left + pad, top + pad)
                      if (ol != null) {
                          ol.draw(canvas)
                          canvas.translate(0f, ol.height.toFloat())
                      }
                      layout.draw(canvas)
                      canvas.restore()
                  }
                  canvas.restore()
              }
          }
