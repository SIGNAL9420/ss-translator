      - name: Prepare guide images (攻略本圖片, guide.zip 優先, 沒有就從 archive.org 下載)
        continue-on-error: true
        run: |
          G=app/src/main/assets/guide
          mkdir -p "$G"
          Z=$(find . -iname 'guide*.zip' -not -path './app/*' -not -path './.git/*' | head -1)
          echo "guide zip found: [$Z]"
          if [ -n "$Z" ]; then
            unzip -o -j "$Z" -d "$G"
            # 檔名如果不是 p001.jpg 這種格式,就依排序重新編號
            if ! ls "$G" | grep -qE '^p[0-9]{3}\.jpg$'; then
              i=0
              for f in $(ls "$G"/*.jpg "$G"/*.JPG "$G"/*.jpeg 2>/dev/null | sort); do
                i=$((i+1))
                mv "$f" "$G/tmp_$i.jpg"
              done
              for f in $(ls "$G"/tmp_*.jpg | sort -t_ -k2 -n); do
                n=$(basename "$f" .jpg | cut -d_ -f2)
                mv "$f" "$(printf "$G/p%03d.jpg" "$n")"
              done
            fi
          else
            echo "guide.zip not found, downloading from archive.org"
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
            N=$(curl -fsSL --retry 3 https://archive.org/metadata/rp-001 | python3 -c "import sys,json;d=json.load(sys.stdin);print([f['name'] for f in d['files'] if f['name'].lower().endswith('.pdf')][0])")
            echo "PDF name: $N"
            curl -fsSL --retry 3 -G "https://archive.org/download/rp-001/$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))" "$N")" -o /tmp/guide.pdf
            mkdir -p /tmp/gimg
            pdfimages -j /tmp/guide.pdf /tmp/gimg/g
            i=0
            for f in $(ls /tmp/gimg/g-*.jpg | sort); do
              i=$((i+1))
              out=$(printf "$G/p%03d.jpg" $i)
              convert "$f" -resize 640x -quality 55 "$out"
            done
          fi
          COUNT=$(ls "$G" | wc -l)
          echo "guide images: $COUNT"
          echo "## 攻略圖片數量: $COUNT 張 (來源: ${Z:-archive.org})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -lt 50 ]; then
            echo "⚠️ 攻略圖片不足,App 內的攻略本會是空的。請確認專案最外層有 guide.zip。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download OpenCC dictionaries (簡轉繁字典)
        run: |
          D=app/src/main/assets/opencc
          mkdir -p "$D"
          B=https://raw.githubusercontent.com/BYVoid/OpenCC/master/data/dictionary
          ok=1
          for f in STCharacters STPhrases TWVariants; do
            curl -fsSL --retry 3 "$B/$f.txt" -o "$D/$f.txt" || ok=0
          done
          for f in TWPhrasesIT TWPhrasesName TWPhrasesOther TWPhrases; do
            curl -fsSL --retry 3 "$B/$f.txt" -o "$D/$f.txt" || rm -f "$D/$f.txt"
          done
          if [ "$ok" = "0" ]; then
            echo "Direct download failed, trying pip package fallback"
            pip install opencc-python-reimplemented
            P=$(python3 -c "import opencc_python_reimplemented,os;print(os.path.dirname(opencc_python_reimplemented.__file__))")
            find "$P" \( -name 'ST*.txt' -o -name 'TW*.txt' \) -exec cp {} "$D/" \;
          fi
          wc -l "$D"/*.txt
          test -s "$D/STPhrases.txt"
          test -s "$D/STCharacters.txt"

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo '## 編譯錯誤摘要 (請截圖這一段)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -n -E '^e: |error:|Execution failed|What went wrong' build.log | cut -c1-300 | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo '---' >> "$GITHUB_STEP_SUMMARY"
            grep -n -A 10 'What went wrong' build.log | cut -c1-300 | head -30 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          tail -n 5 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS-Translator-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases (直接下載用)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SS-Translator.apk
          gh release create "v${{ github.run_number }}" SS-Translator.apk \
            --repo "${{ github.repository }}" \
            --title "SS日文翻譯 v${{ github.run_number }}" \
            --notes "下載 SS-Translator.apk 安裝即可。"
