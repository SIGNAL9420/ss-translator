name: Build APK

# 在 GitHub 網站上按 Actions -> Build APK -> Run workflow 即可編譯。
# 第一次建立這個檔案時也會自動編譯一次。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Write project files
        run: |
          mkdir -p app app/src/main app/src/main/assets app/src/main/java/com/example/sstranslator app/src/main/res/drawable app/src/main/res/values
          cat > 'app/build.gradle.kts' <<'__SSFILE_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.sstranslator"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.sstranslator"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-AI"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              // 日文文字辨識 (模型內建於 APK, 完全離線)
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              // 離線機器翻譯 (模型第一次需下載, 之後離線可用)
              implementation("com.google.mlkit:translate:17.0.3")
          }
          __SSFILE_EOF__
          cat > 'app/src/main/AndroidManifest.xml' <<'__SSFILE_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TranslateService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          __SSFILE_EOF__
          cat > 'app/src/main/assets/glossary.txt' <<'__SSFILE_EOF__'
