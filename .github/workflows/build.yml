          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/AiClient.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Bitmap
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * 呼叫 OpenAI 格式的 AI 服務 (Gemini、Groq、OpenAI、其他相容服務都可以)。
           * 網址、金鑰、模型名稱由使用者在主畫面的 AI 設定填入。
           */
          object AiClient {

              class Config(val url: String, val key: String, val model: String)

              fun config(ctx: Context): Config? {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val url = (p.getString("ai_url", "https://generativelanguage.googleapis.com/v1beta/openai/") ?: "").trim()
                  val key = (p.getString("ai_key", "") ?: "").trim()
                  val model = (p.getString("ai_model", "gemini-2.0-flash") ?: "").trim()
                  if (url.isEmpty() || model.isEmpty()) return null
                  return Config(url, key, model)
              }

              private fun endpoint(base: String): String {
                  val b = base.trim().trimEnd('/')
                  return if (b.endsWith("/chat/completions")) b else b + "/chat/completions"
              }

              private fun chat(cfg: Config, messages: JSONArray): String {
                  val body = JSONObject()
                  body.put("model", cfg.model)
                  body.put("messages", messages)
                  body.put("temperature", 0.2)
                  val c = URL(endpoint(cfg.url)).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 8000
                  c.readTimeout = 40000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                  if (cfg.key.isNotEmpty()) c.setRequestProperty("Authorization", "Bearer " + cfg.key)
                  try {
                      c.outputStream.use { os -> os.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream?.bufferedReader(Charsets.UTF_8)?.use { r -> r.readText() } ?: ""
                      if (code !in 200..299) {
                          throw IllegalStateException("AI 回應 HTTP " + code + ":" + text.take(200))
                      }
                      val choices = JSONObject(text).getJSONArray("choices")
                      val msg = choices.getJSONObject(0).getJSONObject("message")
                      if (msg.isNull("content")) return ""
                      return msg.optString("content", "").trim()
                  } finally {
                      c.disconnect()
                  }
              }

              private fun systemPrompt(ctx: Context, vision: Boolean): String {
                  val terms = Glossary.promptTerms(ctx)
                  val base = if (vision) {
                      "你是日本遊戲《秀逗魔導士 (Slayers)》的專業翻譯。請把遊戲畫面裡的日文對白翻成自然流暢的臺灣繁體中文,語氣要符合角色。"
                  } else {
                      "你是日本遊戲《秀逗魔導士 (Slayers)》的專業翻譯。使用者給你的日文是從遊戲畫面辨識出來的對白,可能有錯字、漏字、重複或多餘的符號," +
                          "請依上下文與遊戲設定推測正確的原文,翻成自然流暢的臺灣繁體中文,語氣要符合角色。只輸出譯文,不要解釋,不要加引號或前綴。"
                  }
                  return if (terms.isNotEmpty()) base + "\n專有名詞請固定使用以下譯法:\n" + terms else base
              }

              private fun historyText(history: List<String>): String {
                  if (history.isEmpty()) return ""
                  val sb = StringBuilder()
                  sb.append("前面已經翻好的對白 (只供參考語氣與稱呼,不要重翻):\n")
                  for (h in history) {
                      sb.append("・").append(h).append('\n')
                  }
                  sb.append('\n')
                  return sb.toString()
              }

              private fun clean(s: String): String {
                  return s.trim()
                      .removePrefix("譯文:")
                      .removePrefix("譯文：")
                      .trim()
                      .trim('"')
                      .trim()
              }

              // 純文字翻譯:把辨識到的日文交給 AI
              fun translateText(ctx: Context, jp: String, history: List<String>): String {
                  val cfg = config(ctx) ?: throw IllegalStateException("還沒設定 AI,請到主畫面的「AI 設定」填入")
                  val msgs = JSONArray()
                  msgs.put(JSONObject().put("role", "system").put("content", systemPrompt(ctx, false)))
                  msgs.put(JSONObject().put("role", "user").put("content", historyText(history) + "請翻譯這句:\n" + jp))
                  val out = clean(chat(cfg, msgs))
                  if (out.isEmpty()) throw IllegalStateException("AI 沒有回傳內容")
                  return out
              }

              // 看圖翻譯:直接把對白框的截圖交給 AI。回傳 (日文原文, 中文譯文),畫面沒有日文時回傳 null
              fun translateImage(ctx: Context, bmp: Bitmap, history: List<String>): Pair<String, String>? {
                  val cfg = config(ctx) ?: throw IllegalStateException("還沒設定 AI,請到主畫面的「AI 設定」填入")
                  val src = if (bmp.width > 1280) {
                      Bitmap.createScaledBitmap(bmp, 1280, (bmp.height * 1280L / bmp.width).toInt(), true)
                  } else {
                      bmp
                  }
                  val bos = ByteArrayOutputStream()
                  src.compress(Bitmap.CompressFormat.JPEG, 85, bos)
                  if (src !== bmp) src.recycle()
                  val b64 = Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)

                  val ask = historyText(history) +
                      "這是遊戲對白框的截圖 (可能是半透明的小字,背景雜亂)。請讀出畫面中的日文對白,並翻成臺灣繁體中文。\n" +
                      "請嚴格用下面兩行格式輸出,不要多說別的:\n原文:<日文原文>\n譯文:<繁體中文>\n" +
                      "如果畫面裡沒有日文對白,只輸出一個字:無"
                  val content = JSONArray()
                  content.put(JSONObject().put("type", "text").put("text", ask))
                  content.put(
                      JSONObject().put("type", "image_url")
                          .put("image_url", JSONObject().put("url", "data:image/jpeg;base64," + b64))
                  )
                  val msgs = JSONArray()
                  msgs.put(JSONObject().put("role", "system").put("content", systemPrompt(ctx, true)))
                  msgs.put(JSONObject().put("role", "user").put("content", content))
                  return parseImageReply(chat(cfg, msgs))
              }

              private fun parseImageReply(out: String): Pair<String, String>? {
                  val t = out.trim()
                  if (t == "無" || t == "无" || t.isEmpty()) return null
                  val orig = StringBuilder()
                  val zh = StringBuilder()
                  var cur = 0
                  for (line in t.split('\n')) {
                      val l = line.trim()
                      if (l.startsWith("原文:") || l.startsWith("原文：")) {
                          cur = 1
                          orig.append(l.substring(3).trim())
                      } else if (l.startsWith("譯文:") || l.startsWith("譯文：")) {
                          cur = 2
                          zh.append(l.substring(3).trim())
                      } else if (l.isNotEmpty()) {
                          if (cur == 1) orig.append(l) else if (cur == 2) zh.append('\n').append(l)
                      }
                  }
                  var z = zh.toString().trim()
                  if (z.isEmpty()) z = clean(t)
                  if (z.isEmpty() || z == "無") return null
                  return Pair(orig.toString().trim(), z)
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/Glossary.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.content.Context

          /**
           * 專有名詞表:翻譯前先把名詞換成暗號,翻完再換成指定的中文。
           * 來源有兩個:內建 (assets 的 glossary.txt) 與使用者在主畫面輸入的自訂內容,自訂優先。
           */
          object Glossary {

              class Protected(val text: String, val terms: List<String>)

              private class Entry(val jp: String, val zh: String)

              private class Sets(val entries: List<Entry>, val fixes: List<Entry>)

              @Volatile
              private var builtin: Sets? = null

              private fun parse(src: String, entries: MutableList<Entry>, fixes: MutableList<Entry>) {
                  for (raw in src.split('\n')) {
                      val line = raw.trim()
                      if (line.isEmpty() || line.startsWith("#")) continue
                      val isFix = line.startsWith(">")
                      val body = if (isFix) line.substring(1) else line
                      val eq = body.indexOf('=')
                      if (eq <= 0) continue
                      val k = body.substring(0, eq).trim()
                      val v = body.substring(eq + 1).trim()
                      if (k.isEmpty() || v.isEmpty()) continue
                      if (isFix) fixes.add(Entry(k, v)) else entries.add(Entry(k, v))
                  }
              }

              private fun loadBuiltin(ctx: Context): Sets {
                  val b = builtin
                  if (b != null) return b
                  val e = ArrayList<Entry>()
                  val f = ArrayList<Entry>()
                  try {
                      ctx.assets.open("glossary.txt").bufferedReader(Charsets.UTF_8).use { r ->
                          parse(r.readText(), e, f)
                      }
                  } catch (ex: Exception) {
                      // 沒有內建名詞表就只用自訂的
                  }
                  val s = Sets(e, f)
                  builtin = s
                  return s
              }

              private fun merged(ctx: Context): Sets {
                  val user = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getString("glossary_user", "") ?: ""
                  val ue = ArrayList<Entry>()
                  val uf = ArrayList<Entry>()
                  parse(user, ue, uf)
                  val b = loadBuiltin(ctx)
                  val map = LinkedHashMap<String, Entry>()
                  for (x in ue) map[x.jp] = x
                  for (x in b.entries) {
                      if (!map.containsKey(x.jp)) map[x.jp] = x
                  }
                  val entries = map.values.sortedByDescending { x -> x.jp.length }
                  val fixes = ArrayList<Entry>()
                  fixes.addAll(uf)
                  fixes.addAll(b.fixes)
                  return Sets(entries, fixes)
              }

              // 把日文裡的專有名詞換成暗號 Q1Q、Q2Q…,同時記下每個暗號對應的中文
              fun protect(ctx: Context, text: String): Protected {
                  val set = merged(ctx)
                  val terms = ArrayList<String>()
                  val sb = StringBuilder()
                  var i = 0
                  while (i < text.length) {
                      var hit: Entry? = null
                      for (e in set.entries) {
                          if (text.startsWith(e.jp, i)) {
                              hit = e
                              break
                          }
                      }
                      if (hit != null) {
                          terms.add(hit.zh)
                          sb.append('Q').append(terms.size).append('Q')
                          i += hit.jp.length
                      } else {
                          sb.append(text[i])
                          i++
                      }
                  }
                  return Protected(sb.toString(), terms)
              }

              // 翻完之後把暗號換回指定的中文。如果有暗號被翻譯引擎吃掉了,回傳 null
              fun restore(zh: String, terms: List<String>): String? {
                  val re = Regex("[Qq]\\s*([0-9]+)\\s*[Qq]")
                  val seen = HashSet<Int>()
                  val out = re.replace(zh) { m ->
                      val n = m.groupValues[1].toIntOrNull() ?: 0
                      if (n in 1..terms.size) {
                          seen.add(n)
                          terms[n - 1]
                      } else {
                          m.value
                      }
                  }
                  if (seen.size < terms.size) return null
                  return out
              }

              // 套用「>錯的=對的」修正,並把名字中間的 = 或 ・ 改成 ·
              fun fix(ctx: Context, text: String): String {
                  var s = text
                  for (f in merged(ctx).fixes) {
                      s = s.replace(f.jp, f.zh)
                  }
                  s = Regex("([\\u4E00-\\u9FFF])[＝=・]([\\u4E00-\\u9FFF])").replace(s, "\$1·\$2")
                  return s
              }

              // 給 AI 看的名詞對照表 (每行 日文=中文)
              fun promptTerms(ctx: Context): String {
                  val sb = StringBuilder()
                  for (e in merged(ctx).entries) {
                      sb.append(e.jp).append('=').append(e.zh).append('\n')
                  }
                  return sb.toString().trim()
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/MainActivity.kt' <<'__SSFILE_EOF__'
