                  tip.text = "翻譯範圍 (數字是畫面高度的百分比)。把上緣、下緣調到剛好框住遊戲的對話框,可避免翻到選單、日期等雜訊。"
                  tip.setPadding(0, dp(12), 0, 0)
                  root.addView(tip)
                  root.addView(makeSlider("上緣", "top", 18, cfg))
                  root.addView(makeSlider("下緣", "bot", 34, cfg))

                  root.addView(
                      makeRadios(
                          "翻譯時機", "mode", "auto",
                          listOf(
                              Pair("auto", "自動翻譯 (字幕停住後自動翻,譯文在範圍下方)"),
                              Pair("manual", "手動 (按懸浮按鈕才翻,譯文蓋在原文上)")
