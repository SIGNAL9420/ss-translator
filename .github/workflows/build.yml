name: Build APK

# 在 GitHub 網站上按 Actions -> Build APK -> Run workflow 即可編譯。
# 第一次建立這個檔案時也會自動編譯一次。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Write project files
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/sstranslator app/src/main/res/drawable app/src/main/res/values
          cat > 'app/build.gradle.kts' <<'__SSFILE_EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.sstranslator"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.sstranslator"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              // 日文文字辨識 (模型內建於 APK, 完全離線)
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              // 離線機器翻譯 (模型第一次需下載, 之後離線可用)
              implementation("com.google.mlkit:translate:17.0.3")
          }
          __SSFILE_EOF__
          cat > 'app/src/main/AndroidManifest.xml' <<'__SSFILE_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TranslateService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/MainActivity.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions

          class MainActivity : Activity() {

              private val reqCapture = 1001
              private lateinit var status: TextView

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(16), dp(16), dp(16))

                  val title = TextView(this)
                  title.text = "SS 日文即時翻譯"
                  title.textSize = 22f
                  root.addView(title)

                  val intro = TextView(this)
                  intro.text = "在模擬器玩日文遊戲時,點懸浮的「譯」按鈕,就會把畫面上的日文辨識後翻成繁體中文,顯示在原文位置。\n" +
                      "辨識與翻譯都在手機本機完成。\n" +
                      "• 短按「譯」:翻譯目前畫面\n" +
                      "• 長按「譯」:隱藏譯文\n" +
                      "• 拖曳「譯」:移動位置"
                  intro.setPadding(0, dp(8), 0, dp(12))
                  root.addView(intro)

                  root.addView(makeButton("① 開啟「顯示在其他應用程式上層」權限") { openOverlaySettings() })
                  root.addView(makeButton("② 下載離線翻譯模型 (只需一次,需要網路)") { downloadModel() })

                  val cfg = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val tip = TextView(this)
                  tip.text = "翻譯範圍 (數字是畫面高度的百分比)。把上緣、下緣調到剛好框住遊戲的對話框,可避免翻到選單、日期等雜訊。"
                  tip.setPadding(0, dp(12), 0, 0)
                  root.addView(tip)
                  root.addView(makeSlider("上緣", "top", 18, cfg))
                  root.addView(makeSlider("下緣", "bot", 34, cfg))

                  root.addView(makeButton("③ 啟動翻譯懸浮按鈕") { startCapture() })
                  root.addView(makeButton("停止翻譯服務") { stopService() })

                  status = TextView(this)
                  status.text = "請依序按 ① → ② → ③,然後切換到模擬器遊戲。"
                  status.setPadding(0, dp(12), 0, 0)
                  root.addView(status)

                  val dict = TextView(this)
                  dict.text = "字典載入中…"
                  dict.setPadding(0, dp(8), 0, 0)
                  root.addView(dict)
                  Thread {
                      Traditionalizer.load(applicationContext)
                      val st = Traditionalizer.status()
                      runOnUiThread { dict.text = st }
                  }.start()

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              private fun makeSlider(label: String, key: String, def: Int, cfg: android.content.SharedPreferences): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val tv = TextView(this)
                  val sb = SeekBar(this)
                  sb.max = 100
                  val cur = cfg.getInt(key, def)
                  sb.progress = cur
                  tv.text = label + " " + cur + "%"
                  tv.setPadding(0, dp(8), 0, 0)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          tv.text = label + " " + p + "%"
                          cfg.edit().putInt(key, p).apply()
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}

                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  box.addView(tv)
                  box.addView(sb)
                  return box
              }

              private fun makeButton(label: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.isAllCaps = false
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun openOverlaySettings() {
                  if (Settings.canDrawOverlays(this)) {
                      status.text = "✅ 懸浮窗權限已開啟"
                      return
                  }
                  val i = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))
                  startActivity(i)
              }

              private fun downloadModel() {
                  status.text = "下載中… (約 60MB,請保持網路連線,完成前請勿離開)"
                  val t = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.JAPANESE)
                          .setTargetLanguage(TranslateLanguage.CHINESE)
                          .build()
                  )
                  t.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener {
                          status.text = "✅ 翻譯模型已就緒,之後可離線使用"
                          t.close()
                      }
                      .addOnFailureListener { e ->
                          status.text = "❌ 下載失敗:" + (e.message ?: e.toString())
                          t.close()
                      }
              }

              @Suppress("DEPRECATION")
              private fun startCapture() {
                  if (!Settings.canDrawOverlays(this)) {
                      status.text = "請先完成 ①:開啟懸浮窗權限"
                      return
                  }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              private fun stopService() {
                  val i = Intent(this, TranslateService::class.java)
                  i.action = TranslateService.ACTION_STOP
                  startService(i)
                  status.text = "已停止"
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != reqCapture) return
                  if (resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, TranslateService::class.java)
                      i.putExtra(TranslateService.EXTRA_CODE, resultCode)
                      i.putExtra(TranslateService.EXTRA_DATA, data)
                      startForegroundService(i)
                      status.text = "✅ 已啟動!現在切換到模擬器,畫面上會有藍色「譯」按鈕。"
                  } else {
                      status.text = "你取消了螢幕擷取授權"
                  }
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/ResultView.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.util.TypedValue
          import android.view.View

          /**
           * 全螢幕透明疊加層:在原本日文文字的位置畫上翻譯後的繁體中文。
           * 座標是「螢幕座標」(與螢幕擷取的圖片相同)。
           */
          class ResultView(context: Context) : View(context) {

              class Item(val rect: Rect, val text: String, val lineH: Int)

              var items: List<Item> = emptyList()

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xE6101820.toInt()
              }
              private val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
              }

              private fun sp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, v, resources.displayMetrics)

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)

              private fun makeLayout(text: String, size: Float, width: Int): StaticLayout {
                  textPaint.textSize = size
                  return StaticLayout.Builder.obtain(text, 0, text.length, textPaint, width)
                      .setAlignment(Layout.Alignment.ALIGN_NORMAL)
                      .build()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (items.isEmpty()) return

                  val loc = IntArray(2)
                  getLocationOnScreen(loc)
                  canvas.save()
                  canvas.translate(-loc[0].toFloat(), -loc[1].toFloat())

                  val screenW = (width + loc[0]).toFloat()
                  val screenH = (height + loc[1]).toFloat()
                  val pad = dp(6f)
                  val minSize = sp(11f)
                  val maxSize = sp(26f)

                  for (item in items) {
                      val r = item.rect
                      val boxW = maxOf(r.width().toFloat(), dp(140f))
                      val innerW = maxOf(1, (boxW - 2 * pad).toInt())

                      var size = minOf(item.lineH * 0.85f, maxSize)
                      if (size < minSize) size = minSize
                      var layout = makeLayout(item.text, size, innerW)
                      while (layout.height + 2 * pad > r.height() && size > minSize) {
                          size -= 1f
                          layout = makeLayout(item.text, size, innerW)
                      }

                      val boxH = maxOf(r.height().toFloat(), layout.height + 2 * pad)
                      var left = r.left.toFloat()
                      var top = r.top.toFloat()
                      if (left + boxW > screenW) left = screenW - boxW
                      if (left < 0f) left = 0f
                      if (top + boxH > screenH) top = screenH - boxH
                      if (top < 0f) top = 0f

                      canvas.drawRoundRect(RectF(left, top, left + boxW, top + boxH), dp(6f), dp(6f), bgPaint)
                      canvas.save()
                      canvas.translate(left + pad, top + pad)
                      layout.draw(canvas)
                      canvas.restore()
                  }
                  canvas.restore()
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/Traditionalizer.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.content.Context
          import java.io.IOException

          /**
           * 簡體 -> 繁體(台灣用詞) 離線轉換。
           * 使用 OpenCC 字典 (assets 裡的 opencc 資料夾),做法等同 OpenCC 的 s2twp:
           *   1) TSPhrases + TSCharacters  簡 -> 繁
           *   2) TWPhrases*                 詞彙改成台灣用語 (軟件 -> 軟體)
           *   3) TWVariants                 異體字 (裏 -> 裡)
           * 每一階段都用「最長詞優先」比對。
           */
          object Traditionalizer {

              private class Dict(val map: HashMap<String, String>, val maxLen: Int)

              @Volatile
              private var stages: List<Dict>? = null

              @Synchronized
              fun load(ctx: Context) {
                  if (stages != null) return
                  stages = listOf(
                      loadDicts(ctx, listOf("TSCharacters.txt", "TSPhrases.txt")),
                      loadDicts(
                          ctx,
                          listOf("TWPhrasesIT.txt", "TWPhrasesName.txt", "TWPhrasesOther.txt", "TWPhrases.txt")
                      ),
                      loadDicts(ctx, listOf("TWVariants.txt"))
                  )
              }

              private fun loadDicts(ctx: Context, names: List<String>): Dict {
                  val map = HashMap<String, String>()
                  var maxLen = 1
                  for (name in names) {
                      try {
                          ctx.assets.open("opencc/" + name).bufferedReader(Charsets.UTF_8).useLines { lines ->
                              for (line in lines) {
                                  if (line.isEmpty() || line.startsWith("#")) continue
                                  val tab = line.indexOf('\t')
                                  if (tab <= 0) continue
                                  val key = line.substring(0, tab)
                                  val value = line.substring(tab + 1).trim().split(' ', '\t').firstOrNull()
                                  if (value.isNullOrEmpty()) continue
                                  map[key] = value
                                  if (key.length > maxLen) maxLen = key.length
                              }
                          }
                      } catch (e: IOException) {
                          // 該字典檔不存在就略過
                      }
                  }
                  return Dict(map, maxLen)
              }

              // 備用:如果字典沒載入,改用 Android 內建的 ICU 簡轉繁 (只有逐字轉換)
              private val icu: android.icu.text.Transliterator? by lazy {
                  try {
                      android.icu.text.Transliterator.getInstance("Hans-Hant")
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun icuConvert(s: String): String {
                  val tr = icu ?: return s
                  return try {
                      tr.transliterate(s)
                  } catch (e: Exception) {
                      s
                  }
              }

              fun status(): String {
                  val st = stages ?: return "字典:尚未載入"
                  return "簡繁字典 " + st[0].map.size + " 筆 / 台灣用語 " + st[1].map.size + " 筆" +
                      (if (st[0].map.isEmpty()) " (字典是空的,改用內建簡轉繁)" else "")
              }

              fun convert(text: String): String {
                  val st = stages ?: return icuConvert(text)
                  if (st[0].map.isEmpty()) return icuConvert(text)
                  var s = text
                  for (d in st) {
                      s = apply(d, s)
                  }
                  return s
              }

              private fun apply(d: Dict, s: String): String {
                  if (d.map.isEmpty()) return s
                  val sb = StringBuilder(s.length)
                  val n = s.length
                  var i = 0
                  while (i < n) {
                      var len = minOf(d.maxLen, n - i)
                      var matched = false
                      while (len > 0) {
                          val v = d.map[s.substring(i, i + len)]
                          if (v != null) {
                              sb.append(v)
                              i += len
                              matched = true
                              break
                          }
                          len--
                      }
                      if (!matched) {
                          sb.append(s[i])
                          i++
                      }
                  }
                  return sb.toString()
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/TranslateService.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Paint
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import android.widget.Toast
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.TextRecognizer
          import com.google.mlkit.vision.text.japanese.JapaneseTextRecognizerOptions
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean

          class TranslateService : Service() {

              companion object {
                  const val EXTRA_CODE = "code"
                  const val EXTRA_DATA = "data"
                  const val ACTION_STOP = "com.example.sstranslator.STOP"
                  private const val CHANNEL_ID = "ss_translate"
                  private const val NOTIF_ID = 1
                  private val JP = Regex("[\\u3040-\\u30FF\\u4E00-\\u9FFF]")
              }

              private class Blk(val rect: Rect, var text: String, val lineH: Int)

              private val ui = Handler(Looper.getMainLooper())
              private val worker = Executors.newSingleThreadExecutor()
              private lateinit var bgThread: HandlerThread
              private lateinit var bgHandler: Handler
              private lateinit var wm: WindowManager

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var capW = 0
              private var capH = 0
              private var capDpi = 0

              private var button: TextView? = null
              private var buttonLp: WindowManager.LayoutParams? = null
              private var overlay: ResultView? = null

              private var recognizer: TextRecognizer? = null
              private var translator: Translator? = null

              private var busy = false
              @Volatile
              private var lastRaw = ""
              private val wantFrame = AtomicBoolean(false)

              // 畫面靜止時 (沒有新影格) 的補救措施
              private val kick = Runnable {
                  if (wantFrame.get()) {
                      try {
                          recreateReader()
                      } catch (e: Exception) {
                          // 忽略,等 giveUp 處理
                      }
                  }
              }
              private val giveUp = Runnable {
                  if (wantFrame.compareAndSet(true, false)) {
                      done("抓不到畫面,請再按一次")
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun toast(msg: String) {
                  Toast.makeText(applicationContext, msg, Toast.LENGTH_SHORT).show()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  bgThread = HandlerThread("ss-capture")
                  bgThread.start()
                  bgHandler = Handler(bgThread.looper)
                  recognizer = TextRecognition.getClient(JapaneseTextRecognizerOptions.Builder().build())
                  translator = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.JAPANESE)
                          .setTargetLanguage(TranslateLanguage.CHINESE)
                          .build()
                  )
                  worker.execute { Traditionalizer.load(applicationContext) }
              }

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent != null && intent.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (projection != null) return START_NOT_STICKY

                  createChannel()
                  val notif = buildNotification()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }

                  val code = intent?.getIntExtra(EXTRA_CODE, 0) ?: 0
                  val data = intent?.getParcelableExtra<Intent>(EXTRA_DATA)
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val p: MediaProjection? = try {
                      mpm.getMediaProjection(code, data)
                  } catch (e: Exception) {
                      null
                  }
                  if (p == null) {
                      toast("無法取得螢幕擷取權限")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  p.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          ui.post { stopSelf() }
                      }
                  }, ui)
                  projection = p

                  addButton()
                  toast("翻譯按鈕已啟動")
                  return START_NOT_STICKY
              }

              private fun createChannel() {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "翻譯服務", NotificationManager.IMPORTANCE_LOW)
                  )
              }

              @Suppress("DEPRECATION")
              private fun buildNotification(): Notification {
                  val stopIntent = Intent(this, TranslateService::class.java)
                  stopIntent.action = ACTION_STOP
                  val stopPi = PendingIntent.getService(this, 0, stopIntent, PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("日文翻譯執行中")
                      .setContentText("下拉通知按「停止」可關閉懸浮按鈕")
                      .setSmallIcon(android.R.drawable.ic_menu_edit)
                      .addAction(android.R.drawable.ic_delete, "停止", stopPi)
                      .setOngoing(true)
                      .build()
              }

              // ---------------------------------------------------------------- 懸浮按鈕

              private fun addButton() {
                  val size = dp(54)
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(0xCC1E88E5.toInt())

                  val tv = TextView(this)
                  tv.text = "譯"
                  tv.textSize = 22f
                  tv.gravity = Gravity.CENTER
                  tv.setTextColor(Color.WHITE)
                  tv.background = bg

                  val lp = WindowManager.LayoutParams(
                      size,
                      size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(8)
                  lp.y = dp(160)

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var dragging = false
                  var downTime = 0L

                  tv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              startX = lp.x
                              startY = lp.y
                              dragging = false
                              downTime = e.eventTime
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (!dragging && (Math.abs(dx) > dp(8) || Math.abs(dy) > dp(8))) {
                                  dragging = true
                              }
                              if (dragging) {
                                  lp.x = startX + dx.toInt()
                                  lp.y = startY + dy.toInt()
                                  try {
                                      wm.updateViewLayout(tv, lp)
                                  } catch (ex: Exception) {
                                      // ignore
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!dragging) {
                                  if (e.eventTime - downTime > 600) {
                                      hideOverlay()
                                  } else {
                                      startCapture()
                                  }
                              }
                          }
                      }
                      true
                  }

                  wm.addView(tv, lp)
                  button = tv
                  buttonLp = lp
              }

              private fun setLabel(s: String) {
                  button?.text = s
              }

              private fun hideOverlay() {
                  val v = overlay ?: return
                  v.items = emptyList()
                  v.invalidate()
              }

              // ---------------------------------------------------------------- 擷取畫面

              @Suppress("DEPRECATION")
              private fun readMetrics(): IntArray {
                  val m = DisplayMetrics()
                  val dm = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  dm.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(m)
                  return intArrayOf(m.widthPixels, m.heightPixels, m.densityDpi)
              }

              private fun newReader(w: Int, h: Int): ImageReader {
                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  r.setOnImageAvailableListener({ reader ->
                      val img = try {
                          reader.acquireLatestImage()
                      } catch (e: Exception) {
                          null
                      }
                      if (img != null) {
                          try {
                              if (wantFrame.compareAndSet(true, false)) {
                                  val plane = img.planes[0]
                                  val pixelStride = plane.pixelStride
                                  val rowPadding = plane.rowStride - pixelStride * img.width
                                  val wide = Bitmap.createBitmap(
                                      img.width + rowPadding / pixelStride,
                                      img.height,
                                      Bitmap.Config.ARGB_8888
                                  )
                                  wide.copyPixelsFromBuffer(plane.buffer)
                                  val bmp = if (rowPadding == 0) {
                                      wide
                                  } else {
                                      val cropped = Bitmap.createBitmap(wide, 0, 0, img.width, img.height)
                                      wide.recycle()
                                      cropped
                                  }
                                  ui.post { onFrame(bmp) }
                              }
                          } catch (e: Exception) {
                              ui.post { done("擷取失敗:" + (e.message ?: e.toString())) }
                          } finally {
                              img.close()
                          }
                      }
                  }, bgHandler)
                  return r
              }

              private fun ensureDisplay() {
                  val p = projection ?: throw IllegalStateException("projection")
                  val mt = readMetrics()
                  val w = mt[0]
                  val h = mt[1]
                  val dpi = mt[2]
                  val vd = virtualDisplay
                  if (vd == null) {
                      val r = newReader(w, h)
                      imageReader = r
                      virtualDisplay = p.createVirtualDisplay(
                          "ss-translate", w, h, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          r.surface, null, null
                      )
                      capW = w
                      capH = h
                      capDpi = dpi
                  } else if (w != capW || h != capH) {
                      // 螢幕轉向了:調整虛擬螢幕大小
                      val old = imageReader
                      val r = newReader(w, h)
                      imageReader = r
                      vd.resize(w, h, dpi)
                      vd.setSurface(r.surface)
                      old?.close()
                      capW = w
                      capH = h
                      capDpi = dpi
                  }
              }

              private fun recreateReader() {
                  val vd = virtualDisplay ?: return
                  val old = imageReader
                  val r = newReader(capW, capH)
                  imageReader = r
                  vd.setSurface(r.surface)
                  old?.close()
              }

              private fun startCapture() {
                  if (busy) return
                  busy = true
                  setLabel("…")
                  overlay?.visibility = View.INVISIBLE
                  button?.visibility = View.INVISIBLE
                  // 等一下讓疊加層真的消失,畫面才不會拍到譯文/按鈕
                  ui.postDelayed({
                      try {
                          ensureDisplay()
                      } catch (e: Exception) {
                          done("無法擷取畫面:" + (e.message ?: e.toString()))
                          return@postDelayed
                      }
                      wantFrame.set(true)
                      ui.postDelayed(kick, 700)
                      ui.postDelayed(giveUp, 2800)
                  }, 250)
              }

              private fun done(msg: String?) {
                  button?.visibility = View.VISIBLE
                  overlay?.visibility = View.VISIBLE
                  setLabel("譯")
                  busy = false
                  if (msg != null) toast(msg)
              }

              private fun onFrame(bmp: Bitmap) {
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  button?.visibility = View.VISIBLE
                  worker.execute {
                      val result = try {
                          Result.success(process(bmp))
                      } catch (e: Exception) {
                          Result.failure<List<ResultView.Item>>(e)
                      }
                      bmp.recycle()
                      ui.post {
                          val list = result.getOrNull()
                          if (list == null) {
                              done("翻譯失敗:" + (result.exceptionOrNull()?.message ?: result.exceptionOrNull()?.toString() ?: "未知錯誤"))
                          } else if (list.isEmpty()) {
                              done("沒有辨識到日文" + (if (lastRaw.length > 6) "\n讀到:" + lastRaw.take(60) else ""))
                          } else {
                              showResult(list)
                              done(null)
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- 辨識 + 翻譯

              private fun process(full: Bitmap): List<ResultView.Item> {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val topPct = minOf(90, prefs.getInt("top", 18))
                  val botPct = prefs.getInt("bot", 34)
                  val topOffset = (full.height.toLong() * topPct / 100).toInt()
                  var bottom = (full.height.toLong() * botPct / 100).toInt()
                  if (bottom < topOffset + 40) bottom = topOffset + 40
                  if (bottom > full.height) bottom = full.height
                  val cropH = bottom - topOffset
                  val src = if (cropH != full.height) {
                      Bitmap.createBitmap(full, 0, topOffset, full.width, cropH)
                  } else {
                      full
                  }

                  val tr = translator ?: throw IllegalStateException("translator")
                  val rec = recognizer ?: throw IllegalStateException("recognizer")

                  try {
                      Tasks.await(tr.downloadModelIfNeeded(DownloadConditions.Builder().build()), 90, TimeUnit.SECONDS)
                  } catch (e: Exception) {
                      throw IllegalStateException("尚未下載翻譯模型,請回主畫面按「②」")
                  }

                  // 同一張畫面做三種版本:原圖、放大加強對比、放大反相加強對比
                  val variants = ArrayList<Pair<Bitmap, Float>>()
                  variants.add(Pair(src, 1f))
                  variants.add(Pair(enhance(src, 2f, 1.8f), 2f))
                  variants.add(Pair(enhance(src, 2f, -1.8f), 2f))

                  val raw = StringBuilder()
                  val blocks = ArrayList<Blk>()
                  var step = 0
                  try {
                      for (v in variants) {
                          step++
                          val stepNow = step
                          ui.post { setLabel(stepNow.toString() + "/3") }
                          val bmp = v.first
                          val scale = v.second
                          val text = try {
                              Tasks.await(rec.process(InputImage.fromBitmap(bmp, 0)), 40, TimeUnit.SECONDS)
                          } catch (e: Exception) {
                              null
                          }
                          if (text == null) continue
                          raw.append(text.text.replace("\n", " ")).append(" | ")
                          for (b in text.textBlocks) {
                              val box = b.boundingBox ?: continue
                              val jp = b.lines.joinToString("") { it.text }.replace(" ", "").replace("\u3000", "")
                              if (!isJapanese(jp)) continue
                              val r = Rect(
                                  (box.left / scale).toInt(),
                                  (box.top / scale).toInt() + topOffset,
                                  (box.right / scale).toInt(),
                                  (box.bottom / scale).toInt() + topOffset
                              )
                              val lineCount = maxOf(1, b.lines.size)
                              addBlock(blocks, Blk(r, jp, maxOf(1, r.height() / lineCount)))
                          }
                      }
                  } finally {
                      for (v in variants) {
                          if (v.first !== full) v.first.recycle()
                      }
                  }
                  lastRaw = raw.toString()

                  val out = ArrayList<ResultView.Item>()
                  ui.post { setLabel("譯") }
                  for (m in merge(blocks)) {
                      val zh = Tasks.await(tr.translate(m.text), 40, TimeUnit.SECONDS)
                      out.add(ResultView.Item(m.rect, Traditionalizer.convert(zh), m.lineH))
                  }
                  return out
              }

              private fun enhance(src: Bitmap, scale: Float, contrast: Float): Bitmap {
                  val w = (src.width * scale).toInt()
                  val h = (src.height * scale).toInt()
                  val scaled = Bitmap.createScaledBitmap(src, w, h, true)
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val cm = ColorMatrix()
                  cm.setSaturation(0f)
                  val t = 128f * (1f - contrast)
                  cm.postConcat(
                      ColorMatrix(
                          floatArrayOf(
                              contrast, 0f, 0f, 0f, t,
                              0f, contrast, 0f, 0f, t,
                              0f, 0f, contrast, 0f, t,
                              0f, 0f, 0f, 1f, 0f
                          )
                      )
                  )
                  val p = Paint(Paint.FILTER_BITMAP_FLAG)
                  p.colorFilter = ColorMatrixColorFilter(cm)
                  Canvas(out).drawBitmap(scaled, 0f, 0f, p)
                  if (scaled !== src) scaled.recycle()
                  return out
              }

              private fun isJapanese(s: String): Boolean {
                  var n = 0
                  for (c in s) {
                      if (c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF') n++
                  }
                  return n >= 2
              }

              // 不同版本辨識到同一個位置的文字只留一份 (留比較長的)
              private fun addBlock(list: ArrayList<Blk>, b: Blk) {
                  for (o in list) {
                      val ix = minOf(o.rect.right, b.rect.right) - maxOf(o.rect.left, b.rect.left)
                      val iy = minOf(o.rect.bottom, b.rect.bottom) - maxOf(o.rect.top, b.rect.top)
                      if (ix > 0 && iy > 0) {
                          val inter = ix.toLong() * iy
                          val minArea = minOf(
                              o.rect.width().toLong() * o.rect.height(),
                              b.rect.width().toLong() * b.rect.height()
                          )
                          if (minArea > 0 && inter * 2 > minArea) {
                              if (b.text.length > o.text.length) {
                                  o.text = b.text
                                  o.rect.set(b.rect)
                              }
                              return
                          }
                      }
                  }
                  list.add(b)
              }

              // 把同一段對話的碎片合併成一句:由上到下分群,同一行的由左到右接起來
              private fun merge(list: List<Blk>): List<Blk> {
                  val sorted = list.sortedBy { it.rect.top }
                  val groups = ArrayList<ArrayList<Blk>>()
                  for (b in sorted) {
                      val g = groups.lastOrNull()
                      if (g != null) {
                          var bottom = 0
                          for (x in g) {
                              if (x.rect.bottom > bottom) bottom = x.rect.bottom
                          }
                          if (b.rect.top - bottom <= g[0].lineH) {
                              g.add(b)
                              continue
                          }
                      }
                      val ng = ArrayList<Blk>()
                      ng.add(b)
                      groups.add(ng)
                  }
                  val out = ArrayList<Blk>()
                  for (g in groups) {
                      val rows = ArrayList<ArrayList<Blk>>()
                      for (b in g.sortedBy { it.rect.top }) {
                          val row = rows.lastOrNull { r ->
                              Math.abs(r[0].rect.centerY() - b.rect.centerY()) <= maxOf(r[0].lineH, b.lineH) / 2
                          }
                          if (row != null) {
                              row.add(b)
                          } else {
                              val nr = ArrayList<Blk>()
                              nr.add(b)
                              rows.add(nr)
                          }
                      }
                      val sb = StringBuilder()
                      val rect = Rect(g[0].rect)
                      for (row in rows) {
                          for (b in row.sortedBy { it.rect.left }) {
                              sb.append(b.text)
                              rect.union(b.rect)
                          }
                      }
                      out.add(Blk(rect, sb.toString(), g[0].lineH))
                  }
                  return out
              }

              // ---------------------------------------------------------------- 顯示譯文

              private fun createOverlay(): ResultView {
                  val v = ResultView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  wm.addView(v, lp)
                  overlay = v

                  // 讓「譯」按鈕保持在譯文上方
                  val b = button
                  val blp = buttonLp
                  if (b != null && blp != null) {
                      try {
                          wm.removeView(b)
                          wm.addView(b, blp)
                      } catch (e: Exception) {
                          // ignore
                      }
                  }
                  return v
              }

              private fun showResult(list: List<ResultView.Item>) {
                  val v = overlay ?: createOverlay()
                  v.items = list
                  v.visibility = View.VISIBLE
                  v.invalidate()
              }

              // ---------------------------------------------------------------- 結束

              override fun onDestroy() {
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  try {
                      button?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  try {
                      overlay?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  button = null
                  overlay = null
                  try {
                      virtualDisplay?.release()
                  } catch (e: Exception) {
                      // ignore
                  }
                  virtualDisplay = null
                  try {
                      imageReader?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  imageReader = null
                  try {
                      projection?.stop()
                  } catch (e: Exception) {
                      // ignore
                  }
                  projection = null
                  try {
                      recognizer?.close()
                      translator?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  worker.shutdownNow()
                  bgThread.quitSafely()
                  super.onDestroy()
              }
          }
