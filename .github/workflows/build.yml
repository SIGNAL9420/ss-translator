          package com.example.sstranslator

          import android.content.Context

          /** 魔法選單:辨識到魔法名稱,就顯示中文名、攻擊範圍、消耗 MP 和效果 (資料來自攻略本 p91~94) */
          object SpellGuide {

              class Spell(val key: String, val name: String, val info: String)

              private var spells: List<Spell>? = null

              private fun norm(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) {
                      if (c == '・' || c == '•' || c == '·' || c == '‧' || c == '.' || c == '。' || c.isWhitespace()) continue
                      sb.append(c)
                  }
                  return sb.toString()
              }

              private fun load(ctx: Context): List<Spell> {
                  val s = spells
                  if (s != null) return s
                  val out = ArrayList<Spell>()
                  try {
                      ctx.assets.open("spells.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("#")) continue
                              val p = l.split("|")
                              if (p.size >= 3) out.add(Spell(p[0], p[1], p[2]))
                          }
                      }
                  } catch (e: Exception) {
                      // 沒有資料就不顯示
                  }
                  spells = out
                  return out
              }

              private fun lev(a: String, b: String): Int {
                  val d = IntArray(b.length + 1) { j -> j }
                  for (i in 1..a.length) {
                      var prev = d[0]
                      d[0] = i
                      for (j in 1..b.length) {
                          val tmp = d[j]
                          d[j] = minOf(minOf(d[j] + 1, d[j - 1] + 1), prev + if (a[i - 1] == b[j - 1]) 0 else 1)
                          prev = tmp
                      }
                  }
                  return d[b.length]
              }

              /** 魔法選單每行最前面的小圖示常被誤認成 1~2 個字,把它去掉 */
              fun stripIcon(line: String): String =
                  line.replace(Regex("^[^゠-ヿ]{1,2}(?=[゠-ヿ]{2})"), "")

              /** 這一行如果是魔法名稱就回傳對應魔法 (容許辨識錯一兩個字),否則 null */
              fun match(ctx: Context, line: String, min: Float = 0.62f): Spell? {
                  val t = stripIcon(norm(line))
                  if (t.length < 4) return null
                  // 魔法名稱都是片假名;結尾單獨的 S、C、B、F、N 是同名魔法的變化版
                  val kata = t.filter { c -> c in '゠'..'ヿ' }
                  if (kata.length < 4 || kata.length * 10 < t.length * 6) return null
                  val lastK = t.indexOfLast { c -> c in '゠'..'ヿ' }
                  val tail = t.substring(lastK + 1).filter { c -> !c.isWhitespace() && c != '・' }
                  val last0 = if (tail.isNotEmpty()) tail.first() else ' '
                  // 結尾的變化版字母常被辨識成長得像的字 (C→O/〇/0、B→8、F→E、S→5)
                  val last = when (last0) {
                      'O', '0', '〇', '○', 'Ｏ', 'ｃ', 'Ｃ', 'c' -> 'C'
                      '8', 'Ｂ', 'ß' -> 'B'
                      'E', 'Ｅ', 'Ｆ', 'f' -> 'F'
                      '5', 'Ｓ', 's' -> 'S'
                      'Ｎ', 'n' -> 'N'
                      else -> last0
                  }
                  val variant = if (last in "SCBFN") last.toString() else ""
                  val mine = kata + variant
                  var best: Spell? = null
                  var bestScore = 0f
                  // 名稱後面還有多出來的字 (被認錯的 S/C/B/F/N) → 同分時優先選有變化版字母的魔法
                  val hasTrail = t.any { c -> c !in '゠'..'ヿ' && !c.isWhitespace() && c != '・' }
                  for (sp in load(ctx)) {
                      val k = sp.key
                      val kv = k.last() in "SCBFN"
                      val score = 1f - lev(mine, k).toFloat() / maxOf(mine.length, k.length) + (if (kv == hasTrail) 0.001f else 0f)
                      if (score > bestScore) {
                          bestScore = score
                          best = sp
                      }
                  }
                  return if (bestScore >= min) best else null
              }

              private class Page(val who: String, val no: Int, val spells: List<Spell>)

              private var pages: List<Page>? = null

              private fun loadPages(ctx: Context): List<Page> {
                  val c = pages
                  if (c != null) return c
                  val out = ArrayList<Page>()
                  val all = load(ctx)
                  try {
                      ctx.assets.open("spellpages.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("#")) continue
                              val p = l.split("|")
                              if (p.size < 4) continue
                              val list = ArrayList<Spell>()
                              for (nm in p.drop(2)) {
                                  val key = norm(nm)
                                  val sp = all.firstOrNull { x -> x.key == key }
                                  if (sp != null) list.add(sp)
                              }
                              out.add(Page(p[0], p[1].trim().toIntOrNull() ?: 0, list))
                          }
                      }
                  } catch (e: Exception) {
                      // 沒有就不用
                  }
                  pages = out
                  return out
              }

              private val charNames = mapOf(
                  "リナ" to "莉娜", "ナーガ" to "那加", "アメリア" to "亞美莉亞",
                  "ゼルガディス" to "傑爾加帝斯", "ゼル" to "傑爾加帝斯", "シルフィール" to "希菲爾",
                  "ガウリイ" to "高里"
              )

              /** 這一行除了角色名稱 (リナ、ナーガ、ガウリイ…) 之外沒有別的字,例如戰鬥畫面下方的數值欄 */
              fun onlyNames(line: String): Boolean {
                  var t = line.replace(" ", "").replace("　", "").replace("・", "")
                  for (k in charNames.keys.sortedByDescending { x -> x.length }) t = t.replace(k, "")
                  return t.length < 3
              }

              /** 狀態欄上的角色名稱 (容許辨識錯一個字),不是角色名稱就回傳 null */
              fun charOf(line: String): String? {
                  // 名字常和旁邊的 PUSH R1/2 之類英數字黏在同一行,只留日文字再比對
                  val t = line.filter { c -> c in '぀'..'ヿ' && c != '・' || c in '一'..'鿿' }
                  if (t.isEmpty() || t.length > 8) return null
                  charNames[t]?.let { return it }
                  for ((k, v) in charNames) {
                      if (k.length >= 3 && Math.abs(k.length - t.length) <= 1 && lev(t, k) <= 1) return v
                  }
                  return null
              }

              /** 辨識到的魔法如果大多落在某一頁 (莉娜、那加的選單每頁固定),就把那一頁完整照畫面順序列出 */
              fun pageFor(ctx: Context, who: String?, hits: List<Spell>, pageNo: Int? = null): List<Spell>? {
                  var best: Page? = null
                  var bestN = 0
                  var tie = false
                  for (pg in loadPages(ctx)) {
                      if (who != null && pg.who != who) continue
                      val n = pg.spells.count { x -> hits.any { h -> h.key == x.key } }
                      if (n > bestN) {
                          bestN = n
                          best = pg
                          tie = false
                      } else if (n == bestN && n > 0) {
                          tie = true
                      }
                  }
                  // 知道角色和頁碼:直接用那一頁 (只要有 1 個吻合)
                  if (who != null && pageNo != null) {
                      val pg = loadPages(ctx).firstOrNull { x -> x.who == who && x.no == pageNo }
                      if (pg != null && (hits.isEmpty() || pg.spells.any { x -> hits.any { h -> h.key == x.key } })) return pg.spells
                  }
                  if (best == null) return null
                  // 不知道是哪個角色時,要有 5 個以上吻合而且沒有並列才用
                  if (who == null && (bestN < 2 || tie)) return null
                  if (bestN >= 2) return best.spells
                  return if (who != null && bestN == 1 && !tie) best.spells else null
              }

              /** HELP 開頭「魔法名稱・・・說明」:回傳 (固定中文名, 說明內文),認不出魔法名稱就回傳 null */
              fun splitHelp(ctx: Context, jp: String): Pair<String, String>? {
                  val t = jp.replace(" ", "").replace("　", "")
                  val dots = "・·•.．…‥,，、:：∴"
                  var i = -1
                  var j = 0
                  while (j < t.length - 1) {
                      if (t[j] in dots && t[j + 1] in dots) {
                          i = j
                          break
                      }
                      j++
                  }
                  if (i !in 3..22) {
                      // 找不到那排點:名稱就是開頭那串片假名,後面如果接一個英文字母 / 圓圈字,算變化版
                      // 名稱 = 開頭到第一個平假名/漢字為止 (中間的點只認出一個、變化版字母被認成別的字也沒關係)
                      var k = 0
                      while (k < t.length && (t[k] in '゠'..'ヿ' || t[k] in "・·•.．" || (t[k].code < 128 && t[k].isLetterOrDigit()) || t[k] in "○〇◯Ｃ")) k++
                      while (k > 0 && t[k - 1] in "・·•.．") k--
                      if (k < 4 || k > 22) return null
                      i = k
                  }
                  val nameRaw = t.substring(0, i)
                  var sp = match(ctx, nameRaw) ?: return null
                  // 名稱後面多出一個字 (變化版字母被認成 ロ、エ、可 之類的字,或根本認不出來) 而且這個魔法有變化版 → 一定是變化版,不能當成原版
                  if (sp.key.last() !in "SCBFN") {
                      val nk = norm(nameRaw)
                      if (nk.length > sp.key.length) {
                          val vs = load(ctx).filter { x -> x.key.length == sp.key.length + 1 && x.key.startsWith(sp.key) && x.key.last() in "SCBFN" }
                          if (vs.isNotEmpty()) {
                              val lc = nk.last()
                              val want = when (lc) {
                                  'ロ', '口', 'O', '0', '〇', '○', 'Ｏ', 'c', 'Ｃ' -> 'C'
                                  '8', 'Ｂ', 'ß', 'b' -> 'B'
                                  'E', 'Ｅ', 'Ｆ', 'f', 'エ' -> 'F'
                                  '5', 'Ｓ', 's' -> 'S'
                                  'Ｎ', 'n' -> 'N'
                                  else -> lc
                              }
                              sp = vs.firstOrNull { x -> x.key.last() == want } ?: vs.first()
                          }
                      }
                  }
                  return Pair(sp.name, t.substring(i).trimStart { c -> c in dots })
              }

              /** HELP 說明開頭「魔法名稱(含變化版字母)」那一段,用來確認兩次辨識是不是同一個魔法 */
              fun helpHead(jp: String): String {
                  val t = jp.replace(" ", "").replace("　", "")
                  val d = Regex("[・·•.．…‥:：]{2,}").find(t)?.range?.first ?: -1
                  return norm(if (d > 0) t.substring(0, d) else t.take(10))
              }

              private var nameRx: List<Pair<Regex, String>>? = null

              /** 任何要翻譯的日文裡出現的魔法名稱 (有沒有中間的「・」都算) 先換成固定的台灣動畫譯名,再交給翻譯 */
              fun replaceNames(ctx: Context, text: String, terms: MutableList<String>? = null): String {
                  fun put(n: String): String {
                      if (terms == null) return n
                      terms.add(n)
                      return "W" + terms.size + "W"
                  }
                  var rx = nameRx
                  if (rx == null) {
                      val l = ArrayList<Pair<Regex, String>>()
                      for (sp in load(ctx).sortedByDescending { x -> x.key.length }) {
                          if (sp.key.length < 4) continue
                          val pat = sp.key.map { c -> Regex.escape(c.toString()) }.joinToString("[・·•\\s]*")
                          l.add(Pair(Regex(pat), sp.name))
                      }
                      rx = l
                      nameRx = l
                  }
                  var t = text
                  for ((r, n) in rx) {
                      if (r.containsMatchIn(t)) t = r.replace(t) { put(n) }
                  }
                  // 辨識有錯字時用相似度找魔法名 (含結尾 S/C/B/F/N)
                  t = Regex("[゠-ヿ][゠-ヿ・·\\s]{3,}[SCBFNOE58]?").replace(t) { m ->
                      val sp = match(ctx, m.value, 0.75f)
                      if (sp != null) put(sp.name) else m.value
                  }
                  return t
              }

              private var helps: List<Pair<String, String>>? = null

              /** 固定譯文:HELP 說明的日文跟 spellhelp.txt 裡某一條夠像,就直接用存好的中文 */
              fun helpText(ctx: Context, jp: String): String? {
                  var h = helps
                  if (h == null) {
                      val l = ArrayList<Pair<String, String>>()
                      try {
                          ctx.assets.open("spellhelp.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                              for (x in lines) {
                                  if (x.startsWith("#")) continue
                                  val i = x.lastIndexOf('|')
                                  if (i <= 0) continue
                                  l.add(Pair(x.substring(0, i).replace(" ", "").replace("　", ""), x.substring(i + 1)))
                              }
                          }
                      } catch (e: Exception) {
                      }
                      h = l
                      helps = l
                  }
                  val t = jp.replace(" ", "").replace("　", "")
                  var best: String? = null
                  var bs = 0f
                  // 名稱後面的變化版字母 (F/C/B/S/N) 一定要一樣,否則 ブレスB 會被當成 ブレスS 的固定譯文
                  fun variantOf(x: String): Char {
                      val d = Regex("[・·•.．…‥:：]{2,}").find(x)?.range?.first ?: -1
                      val head = if (d > 0) x.substring(0, d) else x.take(12)
                      val c = head.trimEnd('・', '·', '•', '.', '．', '…', '‥').lastOrNull() ?: ' '
                      if (c in '゠'..'ヿ' || c in '぀'..'ゟ') return ' '
                      return when (c) {
                          'O', '0', '〇', '○', 'Ｏ', 'ｃ', 'Ｃ', 'c' -> 'C'
                          '8', 'Ｂ', 'ß', 'B' -> 'B'
                          'E', 'Ｅ', 'Ｆ', 'f', 'F' -> 'F'
                          '5', 'Ｓ', 's', 'S' -> 'S'
                          'Ｎ', 'n', 'N' -> 'N'
                          else -> ' '
                      }
                  }
                  val tv = variantOf(t)
                  for ((k, v) in h) {
                      if (variantOf(k) != tv) continue
                      // 只比開頭那一段 (魔法名稱 + 前面一小段),後面辨識錯很多也沒關係
                      val n = minOf(k.length, t.length, 24)
                      if (n < 6) continue
                      val d = lev(k.take(n), t.take(n))
                      val sc = 1f - d.toFloat() / n
                      if (sc > bs) {
                          bs = sc
                          best = v
                      }
                  }
                  if (bs >= 0.7f) return best
                  return null
              }

              /** 說明裡的「MP 莉娜10 那加8 …」只留指定角色那一個 */
              fun forChar(info: String, who: String): String {
                  val parts = info.split(" / ")
                  val out = ArrayList<String>()
                  for (p in parts) {
                      if (p.startsWith("MP ")) {
                          val m = Regex(Regex.escape(who) + "([0-9]+)").find(p)
                          out.add(if (m != null) "MP " + m.groupValues[1] else "(攻略沒有" + who + "的 MP 資料)")
                      } else {
                          out.add(p)
                      }
                  }
                  return out.joinToString(" / ")
              }
          }
