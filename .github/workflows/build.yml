          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.util.TypedValue
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs

          /**
           * 翻譯範圍編輯器:全螢幕、可觸控。拖曳黃框的上緣或下緣調整高度,拖曳中間移動整個框,按「完成」儲存。
           * rTop / rBot 都是螢幕座標 (像素)。
           */
          class RegionEditView(context: Context) : View(context) {

              var rTop: Int = 0
              var rBot: Int = 0
              var screenH: Int = 0
              var onDone: ((Int, Int) -> Unit)? = null

              private var mode = 0
              private var lastY = 0f
              private val btn = RectF()

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x33FFEB3B }
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFEB3B.toInt()
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }
              private val bar = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFFFFEB3B.toInt() }
              private val btnPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFF1565C0.toInt() }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
                  textAlign = Paint.Align.CENTER
                  textSize = 44f
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val loc = IntArray(2)
                  getLocationOnScreen(loc)
                  canvas.save()
                  canvas.translate(-loc[0].toFloat(), -loc[1].toFloat())
                  val w = (width + loc[0]).toFloat()
                  val r = RectF(0f, rTop.toFloat(), w, rBot.toFloat())
                  canvas.drawRect(r, fill)
                  canvas.drawRect(r, line)
                  val hw = dp(60f)
                  val hh = dp(6f)
                  val cx = w / 2
                  canvas.drawRoundRect(RectF(cx - hw, rTop - hh, cx + hw, rTop + hh), hh, hh, bar)
                  canvas.drawRoundRect(RectF(cx - hw, rBot - hh, cx + hw, rBot + hh), hh, hh, bar)
                  val midY = (rTop + rBot) / 2f
                  btn.set(cx - dp(60f), midY - dp(22f), cx + dp(60f), midY + dp(22f))
                  canvas.drawRoundRect(btn, dp(8f), dp(8f), btnPaint)
                  canvas.drawText("完成", cx, midY + 15f, text)
                  text.textSize = 34f
                  canvas.drawText("拖曳上緣/下緣調整,拖曳中間移動", cx, rTop - dp(14f), text)
                  text.textSize = 44f
                  canvas.restore()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val y = e.rawY
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastY = y
                          val near = dp(40f)
                          mode = if (btn.contains(e.rawX, y)) {
                              4
                          } else if (abs(y - rTop) < near) {
                              1
                          } else if (abs(y - rBot) < near) {
                              2
                          } else if (y > rTop && y < rBot) {
                              3
                          } else {
                              0
                          }
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dy = (y - lastY).toInt()
                          lastY = y
                          val minH = dp(40f).toInt()
                          when (mode) {
                              1 -> rTop = (rTop + dy).coerceIn(0, rBot - minH)
                              2 -> rBot = (rBot + dy).coerceIn(rTop + minH, screenH)
                              3 -> {
                                  val h = rBot - rTop
                                  var nt = rTop + dy
                                  if (nt < 0) nt = 0
                                  if (nt + h > screenH) nt = screenH - h
                                  rTop = nt
                                  rBot = nt + h
                              }
                          }
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          if (mode == 4 && btn.contains(e.rawX, y)) {
                              onDone?.invoke(rTop, rBot)
                          }
                          mode = 0
                          return true
                      }
                  }
                  return true
              }
          }
