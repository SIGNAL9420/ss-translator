              private fun enhance(src: Bitmap, scale: Float, contrast: Float): Bitmap {
                  val w = (src.width * scale).toInt()
                  val h = (src.height * scale).toInt()
                  val scaled = Bitmap.createScaledBitmap(src, w, h, true)
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val cm = ColorMatrix()
                  cm.setSaturation(0f)
                  val t = 128f * (1f - contrast)
                  cm.postConcat(
                      ColorMatrix(
                          floatArrayOf(
                              contrast, 0f, 0f, 0f, t,
                              0f, contrast, 0f, 0f, t,
                              0f, 0f, contrast, 0f, t,
                              0f, 0f, 0f, 1f, 0f
                          )
                      )
                  )
                  val p = Paint(Paint.FILTER_BITMAP_FLAG)
                  p.colorFilter = ColorMatrixColorFilter(cm)
                  Canvas(out).drawBitmap(scaled, 0f, 0f, p)
                  if (scaled !== src) scaled.recycle()
                  return out
              }

              // 清理一行辨識結果:狀態欄數字、背景亂碼整行丟掉;日文裡混進的英數字雜訊去掉
              private fun cleanLine(raw: String): String? {
                  var s = raw.replace(" ", "").replace("　", "")
                  var kana = 0
                  var kanji = 0
                  for (c in s) {
                      if (c in '\u3040'..'\u30FF') kana++ else if (c in '\u4E00'..'\u9FFF') kanji++
                  }
                  val jpN = kana + kanji
                  if (jpN == 0) return s
                  if (jpN * 10 < s.length * 6) return null
                  if (kana < 2 && kanji < 4) return null
                  val noise = "*|[]{}<>=+_~^#@%&/\\`\$"
                  val sb = StringBuilder()
                  for (c in s) {
                      if (c in noise) continue
                      sb.append(c)
                  }
                  s = sb.toString()
                  // 英文字母雜訊去掉,但遊戲裡真的會出現的 HP、MP 等保留
                  val before = s
                  s = Regex("[A-Za-z]+").replace(s) { m ->
                      // 魔法名後面的變化版字母:在行尾,或後面接著那排點點 (HELP 標題「ドラグ・スレイブF····」)
                      val prevC = if (m.range.first > 0) before[m.range.first - 1] else ' '
                      val afterS = before.substring(m.range.last + 1)
                      val atEnd = afterS.isEmpty() || Regex("^[·•・.．…‥]{2,}").containsMatchIn(afterS)
                      val keepVariant = m.value.length == 1 && m.value in "SCBFNOE" && atEnd &&
                          (prevC in '゠'..'ヿ' || (prevC in "-−ー" && m.range.first > 1 && before[m.range.first - 2] in '゠'..'ヿ'))
                      if (keepVariant || m.value.uppercase() in setOf("HP", "MP", "AT", "OK", "DATE", "STEP", "HIT", "PAGE")) m.value else ""
                  }
                  // 只去掉「雜點記號後面接的數字」(像 なによ·1),不動句中或句首的數字 (價格、數量)
                  s = s.replace(Regex("[·•・.][0-9０-９]+$"), "")
                  s = s.replace(Regex("[·•]+$"), "")
                  s = s.replace(Regex("^[トﾄ]+(?=[\\u3041-\\u3096\\u4E00-\\u9FFF])"), "")
                  // 句尾的 ♪ ♥ 符號常被辨識成 の、や 這類平假名:片假名後面句尾的「の」、「ね/よ/わ」後面句尾的「や」當成符號
                  s = s.replace(Regex("(?<=[ァ-ヶー])の$"), "♪")
                  s = s.replace(Regex("(?<=[ねよわぞなさ])[やゆゃゅ]$"), "♥")
                  return if (s.isEmpty()) null else s
              }

              // 不再刪句尾殘字:寧可多翻一個字,也不冒險刪掉真正的內容
              private fun tidyJp(t: String): String = t

              // 這一行要不要翻:日文至少 2 個字,或是像樣的英文 (至少 5 個字母,字母佔大部分)
              private fun isJapanese(s: String): Boolean {
                  var n = 0
                  var latin = 0
                  for (c in s) {
                      if (c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF') n++
                      if (c in 'A'..'Z' || c in 'a'..'z') latin++
                  }
                  if (n >= 2) return true
                  val body = s.count { c -> !c.isWhitespace() && c !in ".,!?'\"-:;…" }
                  return n == 0 && latin >= 5 && body > 0 && latin * 10 >= body * 7 &&
                      Regex("[A-Za-z]{3,}").containsMatchIn(s)
              }

              // 不同版本辨識到同一個位置的文字只留一份 (留比較長的)
              private fun addBlock(list: ArrayList<Blk>, b: Blk) {
                  for (o in list) {
                      val ix = minOf(o.rect.right, b.rect.right) - maxOf(o.rect.left, b.rect.left)
                      val iy = minOf(o.rect.bottom, b.rect.bottom) - maxOf(o.rect.top, b.rect.top)
                      if (ix > 0 && iy > 0) {
                          val inter = ix.toLong() * iy
                          val minArea = minOf(
                              o.rect.width().toLong() * o.rect.height(),
                              b.rect.width().toLong() * b.rect.height()
                          )
                          if (minArea > 0 && inter * 2 > minArea) {
                              if (b.text.length > o.text.length) {
                                  o.text = b.text
                                  o.rect.set(b.rect)
                              }
                              return
                          }
                      }
                  }
                  list.add(b)
              }

              // 把同一段對話的碎片合併成一句:由上到下分群,同一行的由左到右接起來
              private fun merge(list: List<Blk>): List<Blk> {
                  val sorted = list.sortedBy { it.rect.top }
                  val groups = ArrayList<ArrayList<Blk>>()
                  for (b in sorted) {
                      val g = groups.lastOrNull()
                      if (g != null) {
                          var bottom = 0
                          for (x in g) {
                              if (x.rect.bottom > bottom) bottom = x.rect.bottom
                          }
                          if (b.rect.top - bottom <= g[0].lineH) {
                              g.add(b)
                              continue
                          }
                      }
                      val ng = ArrayList<Blk>()
                      ng.add(b)
                      groups.add(ng)
                  }
                  val out = ArrayList<Blk>()
                  for (g in groups) {
                      val rows = ArrayList<ArrayList<Blk>>()
                      for (b in g.sortedBy { it.rect.top }) {
                          val row = rows.lastOrNull { r ->
                              Math.abs(r[0].rect.centerY() - b.rect.centerY()) <= maxOf(r[0].lineH, b.lineH) / 2
                          }
                          if (row != null) {
                              row.add(b)
                          } else {
                              val nr = ArrayList<Blk>()
                              nr.add(b)
                              rows.add(nr)
                          }
                      }
                      val sb = StringBuilder()
                      val rect = Rect(g[0].rect)
                      for (row in rows) {
                          for (b in row.sortedBy { it.rect.left }) {
                              sb.append(b.text)
                              rect.union(b.rect)
                          }
                      }
                      out.add(Blk(rect, sb.toString(), g[0].lineH))
                  }
                  return out
              }

