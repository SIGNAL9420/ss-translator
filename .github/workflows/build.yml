                      val sv = subtitle
                      if (sv != null) wm.removeView(sv)
                  } catch (e: Exception) {
                      // ignore
                  }
                  subtitle = null
                  ui.removeCallbacks(stableRun)
                  latestCrop?.recycle()
                  latestCrop = null
                  clearAutoQueue()
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  try {
                      button?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  try {
                      overlay?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  button = null
                  overlay = null
                  try {
                      virtualDisplay?.release()
                  } catch (e: Exception) {
                      // ignore
                  }
                  virtualDisplay = null
                  try {
                      imageReader?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  imageReader = null
                  try {
                      projection?.stop()
                  } catch (e: Exception) {
                      // ignore
                  }
                  projection = null
                  try {
                      recognizer?.close()
                      translator?.close()
                      enTr?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  worker.shutdownNow()
                  bgThread.quitSafely()
                  super.onDestroy()
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/java/com/example/sstranslator/Walkthrough.kt' <<'__SSFILE_EOF__'
          package com.example.sstranslator

          import android.content.Context

          /** 每章的流程步驟 (資料來自攻略本),玩到哪一步由玩家用 ◀ ▶ 自己標記 */
          object Walkthrough {

              class Step(val place: String, val page: Int, val text: String)

              private var data: HashMap<Int, ArrayList<Step>>? = null

              private fun load(ctx: Context): HashMap<Int, ArrayList<Step>> {
                  val d = data
                  if (d != null) return d
                  val out = HashMap<Int, ArrayList<Step>>()
                  try {
                      ctx.assets.open("walkthrough.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              val p = l.split("|", limit = 6)
                              if (p.size >= 6 && p[0] == "S") {
                                  val ch = p[1].trim().toIntOrNull() ?: continue
                                  val page = p[4].trim().toIntOrNull() ?: 0
                                  out.getOrPut(ch) { ArrayList() }.add(Step(p[3].trim(), page, p[5].trim()))
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // 沒有資料就不顯示
                  }
                  data = out
                  return out
              }

              fun steps(ctx: Context, ch: Int): List<Step> = load(ctx)[ch] ?: emptyList()

              fun index(ctx: Context, ch: Int): Int =
                  ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getInt("wt_step_" + ch, 0)

              fun setIndex(ctx: Context, ch: Int, i: Int) {
                  ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).edit().putInt("wt_step_" + ch, i).apply()
              }
          }
          __SSFILE_EOF__
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'__SSFILE_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
