              private fun onFrame(bmp: Bitmap) {
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  button?.visibility = View.VISIBLE
                  worker.execute {
                      val result = try {
                          Result.success(process(bmp))
                      } catch (e: Exception) {
                          Result.failure<List<ResultView.Item>>(e)
                      }
                      bmp.recycle()
                      ui.post {
                          val list = result.getOrNull()
                          if (list == null) {
                              done("翻譯失敗:" + (result.exceptionOrNull()?.message ?: result.exceptionOrNull()?.toString() ?: "未知錯誤"))
                          } else if (list.isEmpty()) {
                              showResult(emptyList())
                              done("沒有辨識到日文" + (if (lastRaw.length > 6) "\n讀到:" + lastRaw.take(60) else ""))
                          } else {
                              showResult(list)
                              done(null)
                          }
                      }
