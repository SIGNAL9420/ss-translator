          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Bitmap
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * 呼叫 OpenAI 格式的 AI 服務 (Gemini、Groq、OpenAI、其他相容服務都可以)。
           * 網址、金鑰、模型名稱由使用者在主畫面的 AI 設定填入。
           */
          object AiClient {

              class Config(val url: String, val key: String, val model: String)

              fun config(ctx: Context): Config? {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val url = (p.getString("ai_url", "https://generativelanguage.googleapis.com/v1beta/openai/") ?: "").trim()
                  val key = (p.getString("ai_key", "") ?: "").trim()
                  val model = (p.getString("ai_model", "gemini-3.5-flash-lite") ?: "").trim()
                  if (url.isEmpty() || model.isEmpty()) return null
                  return Config(url, key, model)
              }

              private fun endpoint(base: String): String {
                  val b = base.trim().trimEnd('/')
                  return if (b.endsWith("/chat/completions")) b else b + "/chat/completions"
              }

              private fun chat(cfg: Config, messages: JSONArray): String {
                  val body = JSONObject()
                  body.put("model", cfg.model)
                  body.put("messages", messages)
                  body.put("temperature", 0.2)
                  val c = URL(endpoint(cfg.url)).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 8000
                  c.readTimeout = 40000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                  if (cfg.key.isNotEmpty()) c.setRequestProperty("Authorization", "Bearer " + cfg.key)
                  try {
                      c.outputStream.use { os -> os.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val text = stream?.bufferedReader(Charsets.UTF_8)?.use { r -> r.readText() } ?: ""
                      if (code !in 200..299) {
                          val ra = c.getHeaderField("Retry-After")
                          throw IllegalStateException("AI 回應 HTTP " + code + (if (ra != null) " [retry-after=" + ra.trim() + "]" else "") + ":" + text.take(200))
                      }
                      val choices = JSONObject(text).getJSONArray("choices")
                      val msg = choices.getJSONObject(0).getJSONObject("message")
                      if (msg.isNull("content")) return ""
                      return msg.optString("content", "").trim()
                  } finally {
                      c.disconnect()
                  }
              }

              private fun systemPrompt(ctx: Context, vision: Boolean): String {
                  val terms = Glossary.promptTerms(ctx)
                  val base = if (vision) {
                      "你是日本遊戲《秀逗魔導士 (Slayers)》的專業翻譯。請把遊戲畫面裡的日文或英文對白翻成自然流暢的臺灣繁體中文,語氣要符合角色。"
                  } else {
                      "你是日本遊戲《秀逗魔導士 (Slayers)》的專業翻譯。使用者給你的日文或英文是從遊戲畫面辨識出來的對白,可能有錯字、漏字、重複或多餘的符號," +
                          "請依上下文與遊戲設定推測正確的原文,翻成自然流暢的臺灣繁體中文,語氣要符合角色。只輸出譯文,不要解釋,不要加引號或前綴。"
                  }
                  return if (terms.isNotEmpty()) base + "\n專有名詞請固定使用以下譯法:\n" + terms else base
              }

              private fun historyText(history: List<String>): String {
                  if (history.isEmpty()) return ""
                  val sb = StringBuilder()
                  sb.append("前面已經翻好的對白 (只供參考語氣與稱呼,不要重翻):\n")
                  for (h in history) {
                      sb.append("・").append(h).append('\n')
                  }
                  sb.append('\n')
                  return sb.toString()
              }

              private fun clean(s: String): String {
                  return s.trim()
                      .removePrefix("譯文:")
                      .removePrefix("譯文：")
                      .trim()
                      .trim('"')
                      .trim()
              }

              // 純文字翻譯:把辨識到的日文交給 AI
              fun translateText(ctx: Context, jp: String, history: List<String>): String {
                  val cfg = config(ctx) ?: throw IllegalStateException("還沒設定 AI,請到主畫面的「AI 設定」填入")
                  val msgs = JSONArray()
                  msgs.put(JSONObject().put("role", "system").put("content", systemPrompt(ctx, false)))
                  msgs.put(JSONObject().put("role", "user").put("content", historyText(history) + "請翻譯這句:\n" + jp))
                  val out = clean(chat(cfg, msgs))
                  if (out.isEmpty()) throw IllegalStateException("AI 沒有回傳內容")
                  return out
              }

              // 看圖翻譯:直接把對白框的截圖交給 AI。回傳 (日文原文, 中文譯文),畫面沒有日文時回傳 null
              fun translateImage(ctx: Context, bmp: Bitmap, history: List<String>): Pair<String, String>? {
                  val cfg = config(ctx) ?: throw IllegalStateException("還沒設定 AI,請到主畫面的「AI 設定」填入")
                  val src = if (bmp.width > 1280) {
                      Bitmap.createScaledBitmap(bmp, 1280, (bmp.height * 1280L / bmp.width).toInt(), true)
                  } else {
                      bmp
                  }
                  val bos = ByteArrayOutputStream()
                  src.compress(Bitmap.CompressFormat.JPEG, 85, bos)
                  if (src !== bmp) src.recycle()
                  val b64 = Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)

                  val ask = historyText(history) +
                      "這是遊戲對白框的截圖 (可能是半透明的小字,背景雜亂)。請讀出畫面中的日文或英文對白,並翻成臺灣繁體中文。\n" +
                      "請嚴格用下面兩行格式輸出,不要多說別的:\n原文:<原文>\n譯文:<繁體中文>\n" +
                      "如果畫面裡沒有日文或英文對白,只輸出一個字:無"
                  val content = JSONArray()
                  content.put(JSONObject().put("type", "text").put("text", ask))
                  content.put(
                      JSONObject().put("type", "image_url")
                          .put("image_url", JSONObject().put("url", "data:image/jpeg;base64," + b64))
                  )
                  val msgs = JSONArray()
                  msgs.put(JSONObject().put("role", "system").put("content", systemPrompt(ctx, true)))
                  msgs.put(JSONObject().put("role", "user").put("content", content))
                  return parseImageReply(chat(cfg, msgs))
              }

              private fun parseImageReply(out: String): Pair<String, String>? {
                  val t = out.trim()
                  if (t == "無" || t == "无" || t.isEmpty()) return null
                  val orig = StringBuilder()
                  val zh = StringBuilder()
                  var cur = 0
                  for (line in t.split('\n')) {
                      val l = line.trim()
                      if (l.startsWith("原文:") || l.startsWith("原文：")) {
                          cur = 1
                          orig.append(l.substring(3).trim())
                      } else if (l.startsWith("譯文:") || l.startsWith("譯文：")) {
                          cur = 2
                          zh.append(l.substring(3).trim())
                      } else if (l.isNotEmpty()) {
                          if (cur == 1) orig.append(l) else if (cur == 2) zh.append('\n').append(l)
                      }
                  }
                  var z = zh.toString().trim()
                  if (z.isEmpty()) z = clean(t)
                  if (z.isEmpty() || z == "無") return null
                  return Pair(orig.toString().trim(), z)
              }
          }

          /**
           * AI 用量控制 (背景運作,各家各自的規則,互不影響):
           *
           * 【Google Gemini】
           *  - 收到 429 就暫停 AI 1 分鐘 (每分鐘額度會自己恢復),期間改用 Google 翻譯。
           *  - 429 訊息說是「每日」額度,就暫停到下一個太平洋時間午夜 (Gemini 每日額度重置時間)。
           *  - 背景默默記今天呼叫幾次,超過 1500 次先不送。
           *
           * 【其他家 (OpenAI / Groq / 自訂)】
           *  - 沒有每日次數保險。收到 429 時,照伺服器回的 Retry-After 秒數暫停 (10 秒到 24 小時),
           *    沒有的話暫停 1 分鐘。
           */
          object AiQuota {
              @Volatile
              private var blockedUntil = 0L

              private const val GEMINI_DAILY_SOFT_CAP = 1500
              private const val PER_MINUTE_CAP = 12
              private val recent = java.util.ArrayDeque<Long>()

              private val pt = java.util.TimeZone.getTimeZone("America/Los_Angeles")

              private fun isGemini(ctx: Context): Boolean {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  return (p.getString("ai_url", "") ?: "").contains("generativelanguage.googleapis.com")
              }

              private fun dayKey(): String {
                  val f = java.text.SimpleDateFormat("yyyyMMdd", java.util.Locale.US)
                  f.timeZone = pt
                  return f.format(java.util.Date())
              }

              // 下一個太平洋時間午夜 (多加 1 分鐘保險)
              private fun nextResetMs(): Long {
                  val c = java.util.Calendar.getInstance(pt)
                  c.add(java.util.Calendar.DAY_OF_YEAR, 1)
                  c.set(java.util.Calendar.HOUR_OF_DAY, 0)
                  c.set(java.util.Calendar.MINUTE, 1)
                  c.set(java.util.Calendar.SECOND, 0)
                  c.set(java.util.Calendar.MILLISECOND, 0)
                  return c.timeInMillis
              }

              /** 可以呼叫就回傳 null;暫停中回傳原因 */
              @Synchronized
              fun tryAcquire(ctx: Context): String? {
                  val now = System.currentTimeMillis()
                  if (now < blockedUntil) return "AI 暫停中"
                  // Gemini 免費版每分鐘最多 15 次:我們自己先限制在 12 次 (留一點餘裕),超過的句子這一輪改用 Google 翻譯
                  if (isGemini(ctx)) {
                      while (recent.isNotEmpty() && now - recent.first() > 60_000L) recent.removeFirst()
                      if (recent.size >= PER_MINUTE_CAP) return "AI 每分鐘次數已滿"
                      recent.addLast(now)
                  }
                  if (isGemini(ctx)) {
                      val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                      val day = dayKey()
                      var n = if (p.getString("ai_day", "") == day) p.getInt("ai_day_n", 0) else 0
                      if (n >= GEMINI_DAILY_SOFT_CAP) {
                          blockedUntil = nextResetMs()
                          return "AI 暫停中"
                      }
                      n += 1
                      p.edit().putString("ai_day", day).putInt("ai_day_n", n).apply()
                  }
                  return null
              }

              /** 伺服器回 503 (Google 那邊忙線):先暫停 AI 30 秒,這段改用 Google 翻譯,不要每句都再試一次 */
              fun onServerBusy() {
                  val t = System.currentTimeMillis() + 30 * 1000L
                  if (t > blockedUntil) blockedUntil = t
              }

              /** 伺服器回 429 */
              fun onServer429(ctx: Context, msg: String) {
                  val now = System.currentTimeMillis()
                  if (isGemini(ctx)) {
                      val daily = msg.contains("PerDay", true) || msg.contains("per day", true) || msg.contains("daily", true)
                      blockedUntil = if (daily) nextResetMs() else now + 60 * 1000L
                      return
                  }
                  val m = Regex("retry-after=(\\d+)").find(msg)
                  val sec = if (m != null) (m.groupValues[1].toLongOrNull() ?: 60L).coerceIn(10L, 24L * 3600L) else 60L
                  blockedUntil = now + sec * 1000L
              }
          }
