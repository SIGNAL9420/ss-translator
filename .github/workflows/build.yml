              private fun makeAiSettings(cfg: android.content.SharedPreferences): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val tv = TextView(this)
                  tv.text = "AI 設定 (用 AI 翻譯才需要填;辨識到的日文或截圖會傳給該服務)。選好服務和模型,貼上金鑰就能用。"
                  tv.setPadding(0, dp(12), 0, 0)
                  box.addView(tv)

                  val provSpin = Spinner(this)
                  provSpin.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, providers.map { x -> x.label })
                  val modelSpin = Spinner(this)
                  val urlEdit = EditText(this)
                  urlEdit.hint = "自訂網址 (OpenAI 格式)"
                  urlEdit.setSingleLine(true)
                  val modelEdit = EditText(this)
                  modelEdit.hint = "自訂模型名稱"
                  modelEdit.setSingleLine(true)
                  val keyEdit = EditText(this)
                  keyEdit.hint = "API 金鑰"
                  keyEdit.setSingleLine(true)

                  var curProv = cfg.getInt("ai_provider", 0).coerceIn(0, providers.size - 1)
                  var loading = true

                  fun applyProvider() {
                      val p = providers[curProv]
                      val custom = p.models.isEmpty()
                      modelSpin.visibility = if (custom) View.GONE else View.VISIBLE
                      urlEdit.visibility = if (custom) View.VISIBLE else View.GONE
                      modelEdit.visibility = if (custom) View.VISIBLE else View.GONE
                      if (!custom) {
                          modelSpin.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, p.models)
                          val saved = cfg.getString("ai_model_" + curProv, p.models[0])
                          val idx = p.models.indexOf(saved).let { i -> if (i < 0) 0 else i }
                          modelSpin.setSelection(idx)
                          cfg.edit().putString("ai_url", p.url).putString("ai_model", p.models[idx]).apply()
                      } else {
                          urlEdit.setText(cfg.getString("ai_url_custom", ""))
                          modelEdit.setText(cfg.getString("ai_model_custom", ""))
                          cfg.edit().putString("ai_url", urlEdit.text.toString().trim())
                              .putString("ai_model", modelEdit.text.toString().trim()).apply()
                      }
                      keyEdit.setText(cfg.getString("ai_key_" + curProv, ""))
                      cfg.edit().putInt("ai_provider", curProv).putString("ai_key", keyEdit.text.toString().trim()).apply()
                  }

                  provSpin.setSelection(curProv)
                  provSpin.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          if (position != curProv || loading) {
                              curProv = position
                              applyProvider()
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  modelSpin.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          val p = providers[curProv]
                          if (p.models.isNotEmpty() && position < p.models.size) {
                              cfg.edit().putString("ai_model", p.models[position])
                                  .putString("ai_model_" + curProv, p.models[position]).apply()
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  keyEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          val k = s?.toString()?.trim() ?: ""
                          cfg.edit().putString("ai_key", k).putString("ai_key_" + curProv, k).apply()
                      }

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })
                  urlEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          if (providers[curProv].models.isEmpty()) {
                              val u = s?.toString()?.trim() ?: ""
                              cfg.edit().putString("ai_url", u).putString("ai_url_custom", u).apply()
                          }
                      }

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })
                  modelEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          if (providers[curProv].models.isEmpty()) {
                              val u = s?.toString()?.trim() ?: ""
                              cfg.edit().putString("ai_model", u).putString("ai_model_custom", u).apply()
                          }
                      }

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })

                  box.addView(provSpin)
                  box.addView(modelSpin)
                  box.addView(urlEdit)
                  box.addView(modelEdit)
                  box.addView(keyEdit)
                  applyProvider()
                  loading = false

                  val res = TextView(this)
                  box.addView(makeButton("測試 AI 連線") {
                      res.text = "測試中…"
                      val ctx = applicationContext
                      Thread {
                          val msg = try {
                              val z = AiClient.translateText(ctx, "魔導士リナ・インバースが竜破斬を唱えた。", emptyList())
                              "✅ 成功:" + z
                          } catch (e: Exception) {
                              "❌ " + (e.message ?: e.toString())
                          }
                          runOnUiThread { res.text = msg }
                      }.start()
                  })
                  box.addView(res)
                  return box
              }

              private fun makeSizeSlider(label: String, key: String, def: Int, lo: Int, hi: Int, cfg: android.content.SharedPreferences): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val tv = TextView(this)
