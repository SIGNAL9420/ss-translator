          package com.example.sstranslator

          import android.content.Context

          /**
           * 章節判斷:看對話裡出現的地名、人物、敵人,猜目前玩到攻略本的第幾章。
           * 規則:章節只往前不往回;需要證據累積夠才換章;猜錯時可以在選單手動指定。
           */
          object ChapterGuide {

              class Ch(val n: Int, val title: String, val start: Int, val end: Int)

              class Kw(val key: String, val ch: Int, val page: Int, val label: String)

              class Hint(val chapter: Int, val title: String, val page: Int, val text: String)

              private var chapters: List<Ch>? = null
              private var kws: List<Kw>? = null
              private val score = FloatArray(10)
              private var lastPlaceKey = ""
              private var lastPlaceAt = 0L

              private fun load(ctx: Context) {
                  if (chapters != null) return
                  val cs = ArrayList<Ch>()
                  val ks = ArrayList<Kw>()
                  try {
                      ctx.assets.open("guide_chapters.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("#")) continue
                              val p = l.split("|")
                              if (p[0] == "C" && p.size >= 5) {
                                  cs.add(Ch(p[1].toInt(), p[2], p[3].toInt(), p[4].toInt()))
                              } else if (p[0] == "K" && p.size >= 5) {
                                  ks.add(Kw(p[1], p[2].toInt(), p[3].toInt(), p[4]))
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // 沒有資料就不提示
                  }
                  chapters = cs
                  kws = ks
              }

              fun chapterInfo(ctx: Context, n: Int): Ch? {
                  load(ctx)
                  return chapters?.firstOrNull { c -> c.n == n }
              }

              fun current(ctx: Context): Int =
                  ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getInt("chapter", 0)

              fun set(ctx: Context, n: Int) {
                  ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).edit().putInt("chapter", n).apply()
                  for (i in score.indices) score[i] = 0f
                  lastPlaceKey = ""
              }

              /** 看這一句對話 (日文 + 譯文),回傳要顯示的章節提示;沒有就回傳 null */
              fun update(ctx: Context, text: String): Hint? {
                  load(ctx)
                  val all = kws ?: return null
                  val cs = chapters ?: return null
                  if (all.isEmpty()) return null

                  // 找出這段文字裡有哪些關鍵字
                  val hitKeys = LinkedHashSet<String>()
                  for (k in all) {
                      if (text.contains(k.key)) hitKeys.add(k.key)
                  }
                  if (hitKeys.isEmpty()) return null

                  for (i in score.indices) score[i] = score[i] * 0.85f
                  val seenLabel = HashSet<String>()
                  for (key in hitKeys) {
                      val label = all.first { k -> k.key == key }.label
                      if (!seenLabel.add(label)) continue // 同一個名字的日文/中文寫法只算一次
                      val chs = all.filter { k -> k.key == key }.map { k -> k.ch }.toSet()
                      val w = 3f / chs.size
                      for (c in chs) score[c] += w
                  }

                  val cur = current(ctx)
                  // 找分數最高、而且比現在章節新的候選;已經在某章時一次最多往後一章 (證據很強才可以跳兩章)
                  var best = 0
                  var bestScore = 0f
                  for (c in 1..8) {
                      if (c <= cur) continue
                      if (cur > 0 && c > cur + 1 && score[c] < 6f) continue
                      if (score[c] > bestScore) {
                          bestScore = score[c]
                          best = c
                      }
                  }
                  if (best > 0 && bestScore >= 4.5f) {
                      val info = cs.firstOrNull { c -> c.n == best }
                      set(ctx, best)
                      if (info != null) {
                          return Hint(
                              best, info.title, info.start,
                              "現在大概在第" + best + "章「" + info.title + "」→ 看第" + info.start + "頁"
                          )
                      }
                  }

                  // 目前章節裡有出現的地點/人物:提示對應頁
                  if (cur > 0) {
                      val now = System.currentTimeMillis()
                      for (key in hitKeys) {
                          val k = all.firstOrNull { x -> x.key == key && x.ch == cur } ?: continue
                          if (k.label == lastPlaceKey && now - lastPlaceAt < 60000L) continue
                          lastPlaceKey = k.label
                          lastPlaceAt = now
                          val info = cs.firstOrNull { c -> c.n == cur }
                          return Hint(cur, info?.title ?: "", k.page, "第" + cur + "章:" + k.label + " → 看第" + k.page + "頁")
                      }
                  }
                  return null
              }
          }
