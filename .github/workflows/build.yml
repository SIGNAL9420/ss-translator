                  })
                  addRow({ "翻譯方式:" + engineName() }, {
                      val next = when (prefs.getString("engine", "both")) {
                          "both" -> "online"
                          "online" -> "ai"
                          "ai" -> "aiv"
                          "aiv" -> "offline"
                          else -> "both"
                      }
                      prefs.edit().putString("engine", next).apply()
                  })
                  addRow({ "顯示辨識到的日文:" + (if (prefs.getBoolean("show_orig", true)) "開" else "關") }, {
                      val now = !prefs.getBoolean("show_orig", true)
                      prefs.edit().putBoolean("show_orig", now).apply()
                      val sv = subtitle
