                      }
                      val ov = overlay
                      if (ov != null) {
                          ov.showOrig = now
                          ov.invalidate()
                      }
                  })
                  addRow({ "調整譯文框位置 / 大小" }, {
                      if (!autoOn()) {
                          toast("譯文框只在「自動」模式使用")
                      } else {
                          closeMenu()
                          showSubtitle("拖曳這裡可以移動\n拖曳右下角的三角形可以調整大小", "(範例文字)")
                      }
                  })
                  addRow({ "重設譯文框位置" }, {
                      prefs.edit().remove("sub_x").remove("sub_y").remove("sub_w").remove("sub_h").apply()
                      val sv = subtitle
