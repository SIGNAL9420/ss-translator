              private var guideChip: View? = null
              private var guideIndex: List<Triple<String, Int, String>>? = null

              private fun loadGuideIndex(): List<Triple<String, Int, String>> {
                  val g = guideIndex
                  if (g != null) return g
                  val out = ArrayList<Triple<String, Int, String>>()
                  try {
                      assets.open("guide_index.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("#")) continue
                              val eq = l.indexOf('=')
                              val bar = l.indexOf('|')
                              if (eq <= 0 || bar <= eq) continue
                              val n = l.substring(eq + 1, bar).trim().toIntOrNull() ?: continue
                              out.add(Triple(l.substring(0, eq).trim(), n, l.substring(bar + 1).trim()))
                          }
                      }
                  } catch (e: Exception) {
                      // 沒有索引就不提示
                  }
                  guideIndex = out
                  return out
              }

              private fun hideGuideHint() {
                  val c = guideChip
                  if (c != null) {
                      ui.removeCallbacks(hideChipRun)
                      try {
                          wm.removeView(c)
                      } catch (e: Exception) {
                          // ignore
                      }
                  }
                  guideChip = null
              }

              private val hideChipRun = Runnable { hideGuideHint() }

              private fun showGuideHint(text: String) {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  // 章節判斷一直在背景進行 (就算提示關掉,也會記住玩到哪)
                  val chap = ChapterGuide.update(applicationContext, text)
                  ui.post {
                      if (walkPanel != null) refreshWalk()
                      else if (prefs.getBoolean("wt_on", false)) showWalk()
                  }
                  if (!prefs.getBoolean("guide_hint", true)) return
                  val hits = ArrayList<Triple<String, Int, String>>()
                  for (e in loadGuideIndex()) {
                      if (text.contains(e.first) && hits.none { x -> x.third == e.third }) {
                          hits.add(e)
                          if (hits.size >= 2) break
                      }
                  }
                  if (chap == null) {
                      hideGuideHint()
                      return
                  }
                  hideGuideHint()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  fun addLine(label: String, page: Int) {
                      val tv = TextView(this)
                      tv.text = label
                      tv.setTextColor(0xFFFFFFFF.toInt())
                      tv.textSize = 14f
                      tv.setPadding(dp(12), dp(8), dp(12), dp(8))
                      tv.setBackgroundColor(0xE61565C0.toInt())
                      tv.setOnClickListener {
                          hideGuideHint()
                          showWalk()
                      }
                      tv.setOnLongClickListener {
                          val i = Intent(this, GuideActivity::class.java)
                          i.putExtra("page", page)
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                          hideGuideHint()
                          true
                      }
                      val lpp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      lpp.topMargin = dp(4)
                      lpp.gravity = Gravity.END
                      box.addView(tv, lpp)
                  }
                  if (chap != null) addLine("📖 " + chap.text + "(點我看本章步驟)", chap.page)
                  val tv = box
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.END
                  lp.x = dp(8)
                  lp.y = dp(8)
                  try {
                      wm.addView(tv, lp)
                      guideChip = tv
                      ui.postDelayed(hideChipRun, 12000)
                  } catch (e: Exception) {
                      // ignore
                  }
              }

              // ---------------------------------------------------------------- 任務步驟面板

              private var walkPanel: LinearLayout? = null
              private var walkLp: WindowManager.LayoutParams? = null
              private var walkTitle: TextView? = null
              private var walkBody: TextView? = null
              private var walkScroll: ScrollView? = null
              private var walkExpanded = false

              private fun hideWalk() {
                  val p = walkPanel ?: return
                  try {
                      wm.removeView(p)
                  } catch (e: Exception) {
                      // ignore
                  }
                  walkPanel = null
                  walkLp = null
              }

              private fun walkBtn(label: String, onClick: () -> Unit): TextView {
                  val b = TextView(this)
                  b.text = label
                  b.textSize = 18f
                  b.setTextColor(0xFFFFFFFF.toInt())
                  b.setPadding(dp(10), dp(4), dp(10), dp(4))
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun walkMove(delta: Int) {
                  val c = ChapterGuide.current(applicationContext)
                  if (c == 0) return
                  val n = Walkthrough.steps(applicationContext, c).size
                  if (n == 0) return
                  val i = Walkthrough.index(applicationContext, c)
                  val j = i + delta
                  if (j >= n) {
                      if (c < 8) {
                          ChapterGuide.set(applicationContext, c + 1)
                          Walkthrough.setIndex(applicationContext, c + 1, 0)
                          toast("本章完成,進入第" + (c + 1) + "章")
                      } else {
                          toast("已經是最後一步")
                      }
                  } else if (j >= 0) {
                      Walkthrough.setIndex(applicationContext, c, j)
                  }
                  refreshWalk()
              }

              private fun showWalk() {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  prefs.edit().putBoolean("wt_on", true).apply()
                  if (walkPanel != null) {
                      refreshWalk()
                      return
                  }
                  val mt = readMetrics()
                  val rows = regionRows(mt[1])
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setBackgroundColor(0xEE102030.toInt())
                  box.setPadding(dp(8), dp(4), dp(8), dp(6))

                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.gravity = Gravity.CENTER_VERTICAL
                  val title = TextView(this)
                  title.textSize = 13f
                  title.setTextColor(0xFFFFD54F.toInt())
                  head.addView(title, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  head.addView(walkBtn("◀") { walkMove(-1) })
                  head.addView(walkBtn("▶") { walkMove(1) })
                  head.addView(walkBtn("☰") {
                      walkExpanded = !walkExpanded
                      refreshWalk()
                  })
                  head.addView(walkBtn("📄") {
                      val c = ChapterGuide.current(applicationContext)
                      val st = Walkthrough.steps(applicationContext, c)
                      val i = Walkthrough.index(applicationContext, c).coerceIn(0, maxOf(0, st.size - 1))
                      val gi = Intent(this, GuideActivity::class.java)
                      gi.putExtra("page", if (st.isNotEmpty()) st[i].page else (ChapterGuide.chapterInfo(applicationContext, c)?.start ?: 27))
                      gi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(gi)
                  })
                  head.addView(walkBtn("✕") {
                      prefs.edit().putBoolean("wt_on", false).apply()
                      hideWalk()
                  })
                  box.addView(head, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))

                  val scroll = ScrollView(this)
                  val body = TextView(this)
                  body.textSize = 16f
                  body.setTextColor(0xFFFFFFFF.toInt())
                  scroll.addView(body)
                  box.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(96)))

                  val lp = WindowManager.LayoutParams(
                      prefs.getInt("wt_w", mt[0] - dp(16)),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = prefs.getInt("wt_x", dp(8))
                  lp.y = prefs.getInt("wt_y", rows[1] + dp(170))

                  // 拖曳標題列可以移動面板
                  var lx = 0f
                  var ly = 0f
                  title.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              lx = e.rawX
                              ly = e.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x += (e.rawX - lx).toInt()
                              lp.y += (e.rawY - ly).toInt()
                              lx = e.rawX
                              ly = e.rawY
                              try {
                                  wm.updateViewLayout(box, lp)
                              } catch (ex: Exception) {
                                  // ignore
                              }
                          }
                          MotionEvent.ACTION_UP -> prefs.edit().putInt("wt_x", lp.x).putInt("wt_y", lp.y).apply()
                      }
                      true
                  }

                  walkPanel = box
                  walkLp = lp
                  walkTitle = title
                  walkBody = body
                  walkScroll = scroll
                  try {
                      wm.addView(box, lp)
                  } catch (e: Exception) {
                      walkPanel = null
                      walkLp = null
                      return
                  }
                  bringButtonToFront()
                  refreshWalk()
              }

              private fun refreshWalk() {
                  val box = walkPanel ?: return
                  val title = walkTitle ?: return
                  val body = walkBody ?: return
                  val scroll = walkScroll ?: return
                  val c = ChapterGuide.current(applicationContext)
                  val steps = if (c == 0) emptyList() else Walkthrough.steps(applicationContext, c)
                  if (steps.isEmpty()) {
                      title.text = "📖 任務步驟"
                      body.text = "還不知道你玩到第幾章。長按懸浮球開選單,點「目前章節」選擇。"
                      return
                  }
                  val i = Walkthrough.index(applicationContext, c).coerceIn(0, steps.size - 1)
                  title.text = "📖 第" + c + "章  第" + (i + 1) + "/" + steps.size + "步  " + steps[i].place
                  val sb = SpannableStringBuilder()
                  if (!walkExpanded) {
                      sb.append(steps[i].text)
                      if (i + 1 < steps.size) {
                          val st = sb.length
                          sb.append("\n下一步:" + steps[i + 1].text)
                          sb.setSpan(ForegroundColorSpan(0xFF9AA7B4.toInt()), st, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      }
                  } else {
                      var curStart = 0
                      for (k in steps.indices) {
                          val st = sb.length
                          sb.append((if (k == i) "👉 " else "") + (k + 1) + ". " + steps[k].text + "\n")
                          if (k == i) {
                              curStart = st
                              sb.setSpan(ForegroundColorSpan(0xFFFFD54F.toInt()), st, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              sb.setSpan(StyleSpan(Typeface.BOLD), st, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          } else if (k < i) {
                              sb.setSpan(ForegroundColorSpan(0xFF7C8793.toInt()), st, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          }
                      }
                      body.post {
                          val ly = body.layout
                          if (ly != null) scroll.scrollTo(0, ly.getLineTop(ly.getLineForOffset(curStart)))
                      }
                  }
                  body.text = sb
                  scroll.scrollTo(0, 0)
                  val h = if (walkExpanded) dp(260) else dp(96)
                  val slp = scroll.layoutParams
                  if (slp != null && slp.height != h) {
                      slp.height = h
                      scroll.layoutParams = slp
                  }
                  try {
                      walkLp?.let { wm.updateViewLayout(box, it) }
                  } catch (e: Exception) {
                      // ignore
                  }
              }

