          package com.example.sstranslator

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.util.TypedValue
          import android.view.MotionEvent
          import android.view.View

          /**
           * 可以用手指移動、調整大小的譯文框 (自動翻譯模式使用)。
           * 拖曳框的任何地方 = 移動;拖曳右下角的三角形 = 調整大小。
           * 文字會自動縮小到剛好放得進框裡。
           */
          class SubtitleView(context: Context) : View(context) {

              // 內容比框高時,手指在框內上下滑動就能看前後文;新的譯文進來會自動捲到最底
              var zh: String = ""
                  set(v) {
                      if (field != v) {
                          field = v
                          if (System.currentTimeMillis() - lastTouch > 4000) autoBottom = true
                      }
                  }
              private var sc = 0f
              private var maxSc = 0f
              private var autoBottom = true
              // 魔法清單:固定從最上面開始顯示 (第一行才不會被捲掉)
              var alignTop = false
              private var lastTouch = 0L
              var orig: String = ""
              var showOrig: Boolean = true

              // 手指拖曳時通知 service,由它更新視窗位置並儲存
              var onMove: ((Int, Int) -> Unit)? = null
              var onResize: ((Int, Int) -> Unit)? = null
              var onFinish: (() -> Unit)? = null
              var onClose: (() -> Unit)? = null

              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xE6101820.toInt()
              }
              private val textPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
              }
              private val origPaint = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFD54F.toInt()
              }
              private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xCCFFFFFF.toInt()
              }

              private val closeBg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xCC555555.toInt() }
              private val closeX = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
                  strokeWidth = 4f
              }

              private var mode = 0
              private var lastX = 0f
              private var lastY = 0f

              private fun sp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_SP, v, resources.displayMetrics)

              private fun dp(v: Float): Float =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, resources.displayMetrics)

              private fun makeLayout(paint: TextPaint, text: String, size: Float, width: Int): StaticLayout {
                  paint.textSize = size
                  return StaticLayout.Builder.obtain(text, 0, text.length, paint, width)
                      .setAlignment(Layout.Alignment.ALIGN_NORMAL)
                      .build()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  canvas.drawRoundRect(RectF(0f, 0f, w, h), dp(8f), dp(8f), bgPaint)

                  val pad = dp(8f)
                  val inner = maxOf(1, (w - 2 * pad).toInt())
                  val baseSp = context.getSharedPreferences("cfg", Context.MODE_PRIVATE).getInt("sub_sp", 18).toFloat()
                  val minSize = sp(baseSp)
                  val withOrig = showOrig && orig.isNotEmpty()

                  // 右上角留給 ✕ 按鈕,第一塊文字的寬度縮短,才不會被擋到
                  val reserve = dp(30f).toInt()
                  val zhW = if (withOrig) inner else maxOf(1, inner - reserve)
                  val orW = maxOf(1, inner - reserve)
                  var size = sp(baseSp)
                  var layout = makeLayout(textPaint, zh, size, zhW)
                  var oLayout: StaticLayout? = if (withOrig) makeLayout(origPaint, orig, maxOf(size * 0.55f, sp(10f)), orW) else null
                  while (layout.height + (oLayout?.height ?: 0) + 2 * pad > h && size > minSize) {
                      size -= 1f
                      layout = makeLayout(textPaint, zh, size, zhW)
                      oLayout = if (withOrig) makeLayout(origPaint, orig, maxOf(size * 0.55f, sp(10f)), orW) else null
                  }

                  val ol = oLayout
                  val oh = (ol?.height ?: 0).toFloat()
                  val viewH = h - 2 * pad - oh
                  maxSc = maxOf(0f, layout.height - viewH)
                  if (autoBottom) {
                      sc = if (alignTop) 0f else maxSc
                      autoBottom = false
                  }
                  sc = sc.coerceIn(0f, maxSc)

                  canvas.save()
                  canvas.translate(pad, pad)
                  if (ol != null) ol.draw(canvas)
                  canvas.save()
                  canvas.clipRect(0f, oh, inner.toFloat(), oh + viewH)
                  canvas.translate(0f, oh - sc)
                  layout.draw(canvas)
                  canvas.restore()
                  canvas.restore()

                  if (maxSc > 0f) {
                      // 右側的捲動條
                      val trackTop = pad + oh
                      val trackH = viewH
                      val barH = maxOf(dp(16f), trackH * viewH / layout.height)
                      val barY = trackTop + (trackH - barH) * (sc / maxSc)
                      canvas.drawRoundRect(RectF(w - dp(5f), barY, w - dp(2f), barY + barH), dp(2f), dp(2f), handlePaint)
                  }

                  // 右上角的關閉按鈕
                  val cr = dp(10f)
                  val cx = w - dp(14f)
                  val cy = dp(14f)
                  canvas.drawCircle(cx, cy, cr, closeBg)
                  val d = cr * 0.45f
                  canvas.drawLine(cx - d, cy - d, cx + d, cy + d, closeX)
                  canvas.drawLine(cx - d, cy + d, cx + d, cy - d, closeX)

                  // 右下角的調整大小把手
                  val hs = dp(22f)
                  val path = Path()
                  path.moveTo(w - 2f, h - hs)
                  path.lineTo(w - 2f, h - 2f)
                  path.lineTo(w - hs, h - 2f)
                  path.close()
                  canvas.drawPath(path, handlePaint)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          val hs = dp(44f)
                          mode = if (e.x > width - hs && e.y > height - hs) {
                              2
                          } else if (e.x > width - hs && e.y < hs) {
                              3
                          } else if (maxSc > 0f && e.y > dp(28f)) {
                              4
                          } else {
                              1
                          }
                          lastTouch = System.currentTimeMillis()
                          lastX = e.rawX
                          lastY = e.rawY
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = (e.rawX - lastX).toInt()
                          val dy = (e.rawY - lastY).toInt()
                          lastX = e.rawX
                          lastY = e.rawY
                          if (mode == 1) {
                              onMove?.invoke(dx, dy)
                          } else if (mode == 2) {
                              onResize?.invoke(dx, dy)
                          } else if (mode == 4) {
                              sc = (sc - dy).coerceIn(0f, maxSc)
                              lastTouch = System.currentTimeMillis()
                              invalidate()
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          val wasClose = mode == 3 && e.action == MotionEvent.ACTION_UP &&
                              e.x > width - dp(44f) && e.y < dp(44f)
                          mode = 0
                          if (wasClose) {
                              onClose?.invoke()
                              return true
                          }
                          onFinish?.invoke()
                          return true
                      }
                  }
                  return true
              }
          }
