              private fun newReader(w: Int, h: Int): ImageReader {
                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                  r.setOnImageAvailableListener({ reader ->
                      val img = try {
                          reader.acquireLatestImage()
                      } catch (e: Exception) {
                          null
                      }
                      if (img != null) {
                          try {
                              if (wantFrame.compareAndSet(true, false)) {
                                  val plane = img.planes[0]
                                  val pixelStride = plane.pixelStride
                                  val rowPadding = plane.rowStride - pixelStride * img.width
                                  val wide = Bitmap.createBitmap(
                                      img.width + rowPadding / pixelStride,
                                      img.height,
                                      Bitmap.Config.ARGB_8888
                                  )
                                  wide.copyPixelsFromBuffer(plane.buffer)
                                  val bmp = if (rowPadding == 0) {
                                      wide
                                  } else {
                                      val cropped = Bitmap.createBitmap(wide, 0, 0, img.width, img.height)
                                      wide.recycle()
                                      cropped
                                  }
                                  ui.post { onFrame(bmp) }
                              } else {
                                  val nowTs = SystemClock.uptimeMillis()
                                  if (nowTs - lastAutoTs >= 250 && autoOn()) {
                                      lastAutoTs = nowTs
                                      try {
                                          val rows = captureRows(img.height)
                                          val crop = cropRegion(img, rows)
                                          val top = rows[0]
                                          ui.post { onAutoFrame(crop, top) }
                                      } catch (e2: Exception) {
                                          // 自動模式下的單次失敗直接略過
                                      }
                                  }
                              }
                          } catch (e: Exception) {
                              ui.post { done("擷取失敗:" + (e.message ?: e.toString())) }
                          } finally {
                              img.close()
                          }
                      }
                  }, bgHandler)
                  return r
              }

              private fun ensureDisplay() {
                  val p = projection ?: throw IllegalStateException("projection")
                  val mt = readMetrics()
                  val w = mt[0]
                  val h = mt[1]
                  val dpi = mt[2]
                  val vd = virtualDisplay
                  if (vd == null) {
                      val r = newReader(w, h)
                      imageReader = r
                      virtualDisplay = p.createVirtualDisplay(
                          "ss-translate", w, h, dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          r.surface, null, null
                      )
                      capW = w
                      capH = h
                      capDpi = dpi
                  } else if (w != capW || h != capH) {
                      // 螢幕轉向了:調整虛擬螢幕大小
                      val old = imageReader
                      val r = newReader(w, h)
                      imageReader = r
                      vd.resize(w, h, dpi)
                      vd.setSurface(r.surface)
                      old?.close()
                      capW = w
                      capH = h
                      capDpi = dpi
                  }
              }

              private fun recreateReader() {
                  val vd = virtualDisplay ?: return
                  val old = imageReader
                  val r = newReader(capW, capH)
                  imageReader = r
                  vd.setSurface(r.surface)
                  old?.close()
              }

