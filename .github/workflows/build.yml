              }

              private fun enhance(src: Bitmap, scale: Float, contrast: Float): Bitmap {
                  val w = (src.width * scale).toInt()
                  val h = (src.height * scale).toInt()
                  val scaled = Bitmap.createScaledBitmap(src, w, h, true)
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val cm = ColorMatrix()
                  cm.setSaturation(0f)
                  val t = 128f * (1f - contrast)
                  cm.postConcat(
                      ColorMatrix(
                          floatArrayOf(
                              contrast, 0f, 0f, 0f, t,
                              0f, contrast, 0f, 0f, t,
                              0f, 0f, contrast, 0f, t,
                              0f, 0f, 0f, 1f, 0f
                          )
                      )
                  )
                  val p = Paint(Paint.FILTER_BITMAP_FLAG)
                  p.colorFilter = ColorMatrixColorFilter(cm)
                  Canvas(out).drawBitmap(scaled, 0f, 0f, p)
                  if (scaled !== src) scaled.recycle()
                  return out
              }

              private fun isJapanese(s: String): Boolean {
                  var n = 0
                  for (c in s) {
                      if (c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF') n++
                  }
                  return n >= 2
              }

              // 不同版本辨識到同一個位置的文字只留一份 (留比較長的)
              private fun addBlock(list: ArrayList<Blk>, b: Blk) {
                  for (o in list) {
                      val ix = minOf(o.rect.right, b.rect.right) - maxOf(o.rect.left, b.rect.left)
                      val iy = minOf(o.rect.bottom, b.rect.bottom) - maxOf(o.rect.top, b.rect.top)
                      if (ix > 0 && iy > 0) {
                          val inter = ix.toLong() * iy
                          val minArea = minOf(
                              o.rect.width().toLong() * o.rect.height(),
                              b.rect.width().toLong() * b.rect.height()
                          )
                          if (minArea > 0 && inter * 2 > minArea) {
                              if (b.text.length > o.text.length) {
                                  o.text = b.text
                                  o.rect.set(b.rect)
                              }
                              return
                          }
                      }
                  }
                  list.add(b)
              }

              // 把同一段對話的碎片合併成一句:由上到下分群,同一行的由左到右接起來
              private fun merge(list: List<Blk>): List<Blk> {
                  val sorted = list.sortedBy { it.rect.top }
                  val groups = ArrayList<ArrayList<Blk>>()
                  for (b in sorted) {
                      val g = groups.lastOrNull()
                      if (g != null) {
                          var bottom = 0
                          for (x in g) {
                              if (x.rect.bottom > bottom) bottom = x.rect.bottom
                          }
                          if (b.rect.top - bottom <= g[0].lineH) {
                              g.add(b)
                              continue
                          }
                      }
                      val ng = ArrayList<Blk>()
                      ng.add(b)
                      groups.add(ng)
                  }
                  val out = ArrayList<Blk>()
                  for (g in groups) {
                      val rows = ArrayList<ArrayList<Blk>>()
                      for (b in g.sortedBy { it.rect.top }) {
                          val row = rows.lastOrNull { r ->
                              Math.abs(r[0].rect.centerY() - b.rect.centerY()) <= maxOf(r[0].lineH, b.lineH) / 2
                          }
                          if (row != null) {
                              row.add(b)
                          } else {
                              val nr = ArrayList<Blk>()
                              nr.add(b)
                              rows.add(nr)
                          }
                      }
                      val sb = StringBuilder()
                      val rect = Rect(g[0].rect)
                      for (row in rows) {
                          for (b in row.sortedBy { it.rect.left }) {
                              sb.append(b.text)
                              rect.union(b.rect)
                          }
                      }
                      out.add(Blk(rect, sb.toString(), g[0].lineH))
                  }
                  return out
              }

              // ---------------------------------------------------------------- 顯示譯文

              private fun createOverlay(): ResultView {
                  val v = ResultView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  wm.addView(v, lp)
                  overlay = v

                  // 讓「譯」按鈕保持在譯文上方
                  val b = button
                  val blp = buttonLp
                  if (b != null && blp != null) {
                      try {
                          wm.removeView(b)
                          wm.addView(b, blp)
                      } catch (e: Exception) {
                          // ignore
                      }
                  }
                  return v
              }

              private fun showResult(list: List<ResultView.Item>) {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  if (autoOn()) {
                      // 自動模式:用可以移動、調整大小的譯文框,不蓋住原文
                      val o = overlay
                      if (o != null) {
                          o.items = emptyList()
                          o.region = null
                          o.invalidate()
                      }
                      if (list.isEmpty()) {
                          hideSubtitle()
                      } else {
                          showSubtitle(
                              list.joinToString("\n") { x -> x.text },
                              list.joinToString(" ") { x -> x.orig }
                          )
                      }
                      return
                  }
                  val v = overlay ?: createOverlay()
                  v.showOrig = prefs.getBoolean("show_orig", true)
                  v.items = list
                  v.region = lastRegion
                  v.visibility = View.VISIBLE
                  v.invalidate()
              }

              // ---------------------------------------------------------------- 結束

              override fun onDestroy() {
                  closeMenu()
                  try {
                      val sv = subtitle
                      if (sv != null) wm.removeView(sv)
                  } catch (e: Exception) {
                      // ignore
                  }
                  subtitle = null
                  ui.removeCallbacks(stableRun)
                  latestCrop?.recycle()
                  latestCrop = null
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  try {
                      button?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  try {
                      overlay?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  button = null
                  overlay = null
                  try {
                      virtualDisplay?.release()
                  } catch (e: Exception) {
                      // ignore
                  }
                  virtualDisplay = null
                  try {
                      imageReader?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  imageReader = null
                  try {
                      projection?.stop()
                  } catch (e: Exception) {
                      // ignore
                  }
                  projection = null
                  try {
                      recognizer?.close()
                      translator?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  worker.shutdownNow()
                  bgThread.quitSafely()
                  super.onDestroy()
              }
          }
