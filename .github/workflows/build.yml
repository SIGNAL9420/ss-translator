              private fun showResult(list: List<ResultView.Item>) {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val isSpell = list.size == 1 && list[0].orig.startsWith("\u0001")
                  if (!isSpell) showGuideHint(list.joinToString(" ") { x -> x.orig + " " + x.text })
                  if (isSpell) {
                      // 魔法清單:一次全部列出,不進對話歷史;右上角的攻略提示先收起來,免得擋到清單
                      val o = overlay
                      if (o != null) {
                          o.items = emptyList()
                          o.region = null
                          o.invalidate()
                      }
                      hideGuideHint()
                      history.clear()
                      lastWasSpell = true
                      lastSpellOk = SystemClock.uptimeMillis()
                      ui.removeCallbacks(emptyHide)
                      showSubtitle(list[0].text, list[0].orig.removePrefix("\u0001"), true)
                      return
                  }
                  lastWasSpell = false
                  if (true) {
                      // 自動模式:用可以移動、調整大小的譯文框,不蓋住原文
                      val o = overlay
                      if (o != null) {
                          o.items = emptyList()
                          o.region = null
                          o.invalidate()
                      }
                      if (list.isNotEmpty()) {
                          ui.removeCallbacks(emptyHide)
                          if (autoOn()) {
                              pushHistory(list)
                              renderHistory()
                          } else {
                              // 手動翻譯:也用同一個譯文框、同一組字體大小設定
                              showSubtitle(list.joinToString("\n") { x -> x.text }, list.joinToString(" ") { x -> x.orig })
                          }
                      }
                      return
                  }
                  val v = overlay ?: createOverlay()
                  v.showOrig = prefs.getBoolean("show_orig", true)
                  v.items = list
                  v.region = lastRegion
                  v.visibility = View.VISIBLE
                  v.invalidate()
              }

