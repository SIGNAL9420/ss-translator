                          }
                          subtitle = null
                      }
                      toast("已重設,下次翻譯時會回到預設位置")
                  })
                  addRow({ "立即翻譯一次" }, {
                      closeMenu()
                      startCapture()
                  })
                  addRow({ "清除譯文" }, {
                      hideOverlay()
                  })
                  addRow({ "停止翻譯服務" }, {
                      closeMenu()
                      stopSelf()
                  })
                  addRow({ "關閉選單" }, {
                      closeMenu()
                  })

                  box.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_OUTSIDE) {
                          closeMenu()
