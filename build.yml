          package com.example.sstranslator

          import android.content.Context

          /**
           * 專有名詞表:翻譯前先把名詞換成暗號,翻完再換成指定的中文。
           * 來源有兩個:內建 (assets 的 glossary.txt) 與使用者在主畫面輸入的自訂內容,自訂優先。
           */
          object Glossary {

              class Protected(val text: String, val terms: List<String>)

              private class Entry(val jp: String, val zh: String)

              private class Sets(val entries: List<Entry>, val fixes: List<Entry>, val rx: List<Entry> = emptyList(), val pre: List<Entry> = emptyList())

              @Volatile
              private var builtin: Sets? = null

              private fun parse(src: String, entries: MutableList<Entry>, fixes: MutableList<Entry>, rx: MutableList<Entry>? = null, pre: MutableList<Entry>? = null) {
                  for (raw in src.split('\n')) {
                      val line = raw.trim()
                      if (line.isEmpty() || line.startsWith("#")) continue
                      if (line.startsWith("<") && pre != null) {
                          val b = line.substring(1)
                          val q = b.indexOf('=')
                          if (q > 0) pre.add(Entry(b.substring(0, q).trim(), b.substring(q + 1).trim()))
                          continue
                      }
                      if (line.startsWith("~") && rx != null) {
                          val b = line.substring(1)
                          val q = b.indexOf('=')
                          if (q > 0) rx.add(Entry(b.substring(0, q).trim(), b.substring(q + 1).trim()))
                          continue
                      }
                      val isFix = line.startsWith(">")
                      val body = if (isFix) line.substring(1) else line
                      val eq = body.indexOf('=')
                      if (eq <= 0) continue
                      val k = body.substring(0, eq).trim()
                      val v = body.substring(eq + 1).trim()
                      if (k.isEmpty() || v.isEmpty()) continue
                      if (isFix) fixes.add(Entry(k, v)) else entries.add(Entry(k, v))
                  }
              }

              private fun loadBuiltin(ctx: Context): Sets {
                  val b = builtin
                  if (b != null) return b
                  val e = ArrayList<Entry>()
                  val f = ArrayList<Entry>()
                  val x = ArrayList<Entry>()
                  val pr = ArrayList<Entry>()
                  try {
                      ctx.assets.open("glossary.txt").bufferedReader(Charsets.UTF_8).use { r ->
                          parse(r.readText(), e, f, x, pr)
                      }
                  } catch (ex: Exception) {
                      // 沒有內建名詞表就只用自訂的
                  }
                  val s = Sets(e, f, x, pr)
                  builtin = s
                  return s
              }

              private fun merged(ctx: Context): Sets {
                  val user = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getString("glossary_user", "") ?: ""
                  val ue = ArrayList<Entry>()
                  val uf = ArrayList<Entry>()
                  parse(user, ue, uf)
                  val b = loadBuiltin(ctx)
                  val map = LinkedHashMap<String, Entry>()
                  for (x in ue) map[x.jp] = x
                  for (x in b.entries) {
                      if (!map.containsKey(x.jp)) map[x.jp] = x
                  }
                  val entries = map.values.sortedByDescending { x -> x.jp.length }
                  val fixes = ArrayList<Entry>()
                  fixes.addAll(uf)
                  fixes.addAll(b.fixes)
                  return Sets(entries, fixes, b.rx, b.pre)
              }

              // 把日文裡的專有名詞換成暗號 Q1Q、Q2Q…,同時記下每個暗號對應的中文
              fun protect(ctx: Context, text: String): Protected {
                  val set = merged(ctx)
                  val terms = ArrayList<String>()
                  val sb = StringBuilder()
                  var i = 0
                  while (i < text.length) {
                      var hit: Entry? = null
                      for (e in set.entries) {
                          if (text.startsWith(e.jp, i)) {
                              hit = e
                              break
                          }
                      }
                      if (hit != null) {
                          terms.add(hit.zh)
                          sb.append('Q').append(terms.size).append('Q')
                          i += hit.jp.length
                      } else {
                          sb.append(text[i])
                          i++
                      }
                  }
                  return Protected(sb.toString(), terms)
              }

              // 翻完之後把暗號換回指定的中文。如果有暗號被翻譯引擎吃掉了,回傳 null
              fun restore(zh: String, terms: List<String>): String? {
                  val re = Regex("[Qq]\\s*([0-9]+)\\s*[Qq]")
                  val seen = HashSet<Int>()
                  val out = re.replace(zh) { m ->
                      val n = m.groupValues[1].toIntOrNull() ?: 0
                      if (n in 1..terms.size) {
                          seen.add(n)
                          terms[n - 1]
                      } else {
                          m.value
                      }
                  }
                  if (seen.size < terms.size) return null
                  return out
              }

              // 套用「>錯的=對的」修正,並把名字中間的 = 或 ・ 改成 ·
              fun fix(ctx: Context, text: String): String {
                  var s = text
                  for (f in merged(ctx).fixes) {
                      s = s.replace(f.jp, f.zh)
                  }
                  for (r in merged(ctx).rx) {
                      try {
                          s = Regex(r.jp).replace(s, r.zh)
                      } catch (ex: Exception) {
                          // 規則寫錯就略過
                      }
                  }
                  s = Regex("([\\u4E00-\\u9FFF])[＝=・]([\\u4E00-\\u9FFF])").replace(s, "\$1·\$2")
                  return s
              }

              // 給 AI 看的名詞對照表 (每行 日文=中文)
              fun promptTerms(ctx: Context): String {
                  val sb = StringBuilder()
                  for (e in merged(ctx).entries) {
                      sb.append(e.jp).append('=').append(e.zh).append('\n')
                  }
                  return sb.toString().trim()
              }

              // 翻譯前先整理日文 (笑聲、口語、辨識多出來的字),讓機器翻譯比較不會翻歪
              fun pre(ctx: Context, text: String): String {
                  var s = text
                  for (r in merged(ctx).pre) {
                      try {
                          s = Regex(r.jp).replace(s, r.zh)
                      } catch (ex: Exception) {
                          // 規則寫錯就略過
                      }
                  }
                  return s
              }
          }
