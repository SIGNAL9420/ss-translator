                  hideOverlay()
                  if (autoOn()) {
                      try {
                          ensureDisplay()
                      } catch (e: Exception) {
                          toast("無法擷取畫面:" + (e.message ?: e.toString()))
                      }
                      toast("已切換:自動翻譯")
                  } else {
                      toast("已切換:手動翻譯")
                  }
              }

