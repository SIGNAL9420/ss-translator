              private fun createSubtitle(): SubtitleView {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val mt = readMetrics()
                  val rows = regionRows(mt[1])
                  val w = prefs.getInt("sub_w", mt[0] - dp(16))
                  val h = prefs.getInt("sub_h", dp(150))
                  val x = prefs.getInt("sub_x", dp(8))
                  val y = prefs.getInt("sub_y", rows[1] + dp(8))
                  val v = SubtitleView(this)
                  val lp = WindowManager.LayoutParams(
                      w,
                      h,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = x
                  lp.y = y
                  v.onMove = { dx, dy ->
                      lp.x += dx
                      lp.y += dy
                      wm.updateViewLayout(v, lp)
                  }
                  v.onResize = { dw, dh ->
                      lp.width = maxOf(dp(120), lp.width + dw)
                      lp.height = maxOf(dp(60), lp.height + dh)
                      wm.updateViewLayout(v, lp)
                  }
                  v.onClose = { pauseAuto() }
                  v.onFinish = {
                      prefs.edit()
                          .putInt("sub_x", lp.x)
                          .putInt("sub_y", lp.y)
                          .putInt("sub_w", lp.width)
                          .putInt("sub_h", lp.height)
                          .apply()
                  }
                  wm.addView(v, lp)
                  subtitle = v
                  bringButtonToFront()
                  return v
              }

              private fun showSubtitle(zh: String, orig: String) {
                  val v = subtitle ?: createSubtitle()
                  v.zh = zh
                  v.orig = orig
                  v.showOrig = getSharedPreferences("cfg", Context.MODE_PRIVATE).getBoolean("show_orig", true)
                  v.visibility = View.VISIBLE
                  v.invalidate()
              }

              private fun hideSubtitle() {
                  val v = subtitle ?: return
                  v.zh = ""
                  v.orig = ""
                  v.visibility = View.GONE
              }

