                  })
                  addRow({ "開啟攻略本" }, {
                      closeMenu()
                      val gi = Intent(this, GuideActivity::class.java)
                      gi.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(gi)
                  })
                  addRow({ "顯示辨識到的日文:" + (if (prefs.getBoolean("show_orig", true)) "開" else "關") }, {
                      val now = !prefs.getBoolean("show_orig", true)
