                              .putString("ai_model", modelEdit.text.toString().trim()).apply()
                      }
                      keyEdit.setText(cfg.getString("ai_key_" + curProv, ""))
                      cfg.edit().putInt("ai_provider", curProv).putString("ai_key", keyEdit.text.toString().trim()).apply()
                  }

                  provSpin.setSelection(curProv)
                  provSpin.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          if (position != curProv || loading) {
                              curProv = position
                              applyProvider()
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  modelSpin.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          val p = providers[curProv]
                          if (p.models.isNotEmpty() && position < p.models.size) {
                              cfg.edit().putString("ai_model", p.models[position])
                                  .putString("ai_model_" + curProv, p.models[position]).apply()
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  keyEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          val k = s?.toString()?.trim() ?: ""
                          cfg.edit().putString("ai_key", k).putString("ai_key_" + curProv, k).apply()
                      }

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })
                  urlEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          if (providers[curProv].models.isEmpty()) {
                              val u = s?.toString()?.trim() ?: ""
                              cfg.edit().putString("ai_url", u).putString("ai_url_custom", u).apply()
                          }
                      }

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })
                  modelEdit.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          if (providers[curProv].models.isEmpty()) {
                              val u = s?.toString()?.trim() ?: ""
                              cfg.edit().putString("ai_model", u).putString("ai_model_custom", u).apply()
                          }
                      }

                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}

                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })

                  box.addView(provSpin)
                  box.addView(modelSpin)
                  box.addView(urlEdit)
                  box.addView(modelEdit)
                  box.addView(keyEdit)
                  applyProvider()
                  loading = false

                  val res = TextView(this)
                  box.addView(makeButton("測試 AI 連線") {
                      res.text = "測試中…"
                      val ctx = applicationContext
                      Thread {
                          val msg = try {
                              val z = AiClient.translateText(ctx, "魔導士リナ・インバースが竜破斬を唱えた。", emptyList())
                              "✅ 成功:" + z
                          } catch (e: Exception) {
                              "❌ " + (e.message ?: e.toString())
                          }
                          runOnUiThread { res.text = msg }
                      }.start()
                  })
                  box.addView(res)
                  return box
              }

              private fun makeSlider(label: String, key: String, def: Int, cfg: android.content.SharedPreferences): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val tv = TextView(this)
                  val sb = SeekBar(this)
                  sb.max = 100
                  val cur = cfg.getInt(key, def)
                  sb.progress = cur
                  tv.text = label + " " + cur + "%"
                  tv.setPadding(0, dp(8), 0, 0)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          tv.text = label + " " + p + "%"
                          cfg.edit().putInt(key, p).apply()
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}

                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  box.addView(tv)
                  box.addView(sb)
                  return box
              }

              private fun makeRadios(
                  title: String,
                  key: String,
                  def: String,
                  opts: List<Pair<String, String>>,
                  cfg: android.content.SharedPreferences
              ): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val tv = TextView(this)
                  tv.text = title
                  tv.setPadding(0, dp(12), 0, 0)
                  box.addView(tv)
                  val rg = RadioGroup(this)
                  rg.orientation = LinearLayout.VERTICAL
                  val cur = cfg.getString(key, def)
                  for (i in opts.indices) {
                      val rb = RadioButton(this)
                      rb.id = View.generateViewId()
                      rb.text = opts[i].second
                      rb.isChecked = (opts[i].first == cur)
                      val value = opts[i].first
                      rb.setOnClickListener { cfg.edit().putString(key, value).apply() }
                      rg.addView(rb)
                  }
                  box.addView(rg)
                  return box
              }

              private fun makeRadioInts(
                  title: String,
                  key: String,
                  def: Int,
                  opts: List<Pair<Int, String>>,
                  cfg: android.content.SharedPreferences
              ): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  val tv = TextView(this)
                  tv.text = title
                  tv.setPadding(0, dp(12), 0, 0)
                  box.addView(tv)
                  val rg = RadioGroup(this)
                  rg.orientation = LinearLayout.VERTICAL
                  val cur = cfg.getInt(key, def)
                  for (i in opts.indices) {
                      val rb = RadioButton(this)
                      rb.id = View.generateViewId()
                      rb.text = opts[i].second
                      rb.isChecked = (opts[i].first == cur)
                      val value = opts[i].first
                      rb.setOnClickListener { cfg.edit().putInt(key, value).apply() }
                      rg.addView(rb)
                  }
                  box.addView(rg)
                  return box
              }

              private fun makeButton(label: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.isAllCaps = false
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun openOverlaySettings() {
                  if (Settings.canDrawOverlays(this)) {
                      status.text = "✅ 懸浮窗權限已開啟"
                      return
                  }
                  val i = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName))
                  startActivity(i)
              }

              private fun downloadModel() {
                  status.text = "下載中… (約 60MB,請保持網路連線,完成前請勿離開)"
                  val t = Translation.getClient(
                      TranslatorOptions.Builder()
                          .setSourceLanguage(TranslateLanguage.JAPANESE)
                          .setTargetLanguage(TranslateLanguage.CHINESE)
                          .build()
                  )
                  t.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener {
                          status.text = "✅ 日文模型已就緒,正在下載英文模型…"
                          t.close()
                          val e = Translation.getClient(
                              TranslatorOptions.Builder()
                                  .setSourceLanguage(TranslateLanguage.ENGLISH)
                                  .setTargetLanguage(TranslateLanguage.CHINESE)
                                  .build()
                          )
                          e.downloadModelIfNeeded(DownloadConditions.Builder().build())
                              .addOnSuccessListener {
                                  status.text = "✅ 日文、英文翻譯模型都已就緒,之後可離線使用"
                                  e.close()
                              }
                              .addOnFailureListener { ex ->
                                  status.text = "日文模型已就緒;英文模型下載失敗:" + (ex.message ?: ex.toString())
                                  e.close()
                              }
                      }
                      .addOnFailureListener { e ->
                          status.text = "❌ 下載失敗:" + (e.message ?: e.toString())
                          t.close()
                      }
              }

              @Suppress("DEPRECATION")
              private fun startCapture() {
                  if (!Settings.canDrawOverlays(this)) {
                      status.text = "請先完成 ①:開啟懸浮窗權限"
                      return
                  }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              private fun stopService() {
                  val i = Intent(this, TranslateService::class.java)
                  i.action = TranslateService.ACTION_STOP
                  startService(i)
                  status.text = "已停止"
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != reqCapture) return
                  if (resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, TranslateService::class.java)
                      i.putExtra(TranslateService.EXTRA_CODE, resultCode)
                      i.putExtra(TranslateService.EXTRA_DATA, data)
                      startForegroundService(i)
                      status.text = "✅ 已啟動!現在切換到模擬器,畫面上會有藍色「譯」按鈕。"
                  } else {
                      status.text = "你取消了螢幕擷取授權"
                  }
              }
          }
