          package com.example.sstranslator

          import android.content.Context
          import java.io.IOException

          /**
           * 簡體 -> 繁體(台灣用詞) 離線轉換。
           * 使用 OpenCC 字典 (assets 裡的 opencc 資料夾),做法等同 OpenCC 的 s2twp:
           *   1) STPhrases + STCharacters  簡 -> 繁
           *   2) TWPhrases*                 詞彙改成台灣用語 (軟件 -> 軟體)
           *   3) TWVariants                 異體字 (裏 -> 裡)
           * 每一階段都用「最長詞優先」比對。
           */
          object Traditionalizer {

              private class Dict(val map: HashMap<String, String>, val maxLen: Int)

              @Volatile
              private var stages: List<Dict>? = null

              @Synchronized
              fun load(ctx: Context) {
                  if (stages != null) return
                  stages = listOf(
                      loadDicts(ctx, listOf("STCharacters.txt", "STPhrases.txt")),
                      loadDicts(
                          ctx,
                          listOf("TWPhrasesIT.txt", "TWPhrasesName.txt", "TWPhrasesOther.txt", "TWPhrases.txt")
                      ),
                      loadDicts(ctx, listOf("TWVariants.txt"))
                  )
              }

              private fun loadDicts(ctx: Context, names: List<String>): Dict {
                  val map = HashMap<String, String>()
                  var maxLen = 1
                  for (name in names) {
                      try {
                          ctx.assets.open("opencc/" + name).bufferedReader(Charsets.UTF_8).useLines { lines ->
                              for (line in lines) {
                                  if (line.isEmpty() || line.startsWith("#")) continue
                                  val tab = line.indexOf('\t')
                                  if (tab <= 0) continue
                                  val key = line.substring(0, tab)
                                  val value = line.substring(tab + 1).trim().split(' ', '\t').firstOrNull()
                                  if (value.isNullOrEmpty()) continue
                                  map[key] = value
                                  if (key.length > maxLen) maxLen = key.length
                              }
                          }
                      } catch (e: IOException) {
                          // 該字典檔不存在就略過
                      }
                  }
                  return Dict(map, maxLen)
              }

              // 備用:如果字典沒載入,改用 Android 內建的 ICU 簡轉繁 (只有逐字轉換)
              private val icu: android.icu.text.Transliterator? by lazy {
                  try {
                      android.icu.text.Transliterator.getInstance("Hans-Hant")
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun icuConvert(s: String): String {
                  val tr = icu ?: return s
                  return try {
                      tr.transliterate(s)
                  } catch (e: Exception) {
                      s
                  }
              }

              fun status(): String {
                  val st = stages ?: return "字典:尚未載入"
                  return "簡繁字典 " + st[0].map.size + " 筆 / 台灣用語 " + st[1].map.size + " 筆" +
                      (if (st[0].map.isEmpty()) " (字典是空的,改用內建簡轉繁)" else "")
              }

              fun convert(text: String): String {
                  val st = stages ?: return icuConvert(text)
                  if (st[0].map.isEmpty()) return icuConvert(text)
                  var s = text
                  for (d in st) {
                      s = apply(d, s)
                  }
                  return s
              }

              private fun apply(d: Dict, s: String): String {
                  if (d.map.isEmpty()) return s
                  val sb = StringBuilder(s.length)
                  val n = s.length
                  var i = 0
                  while (i < n) {
                      var len = minOf(d.maxLen, n - i)
                      var matched = false
                      while (len > 0) {
                          val v = d.map[s.substring(i, i + len)]
                          if (v != null) {
                              sb.append(v)
                              i += len
                              matched = true
                              break
                          }
                          len--
                      }
                      if (!matched) {
                          sb.append(s[i])
                          i++
                      }
                  }
                  return sb.toString()
              }
          }
