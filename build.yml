           */
          class GuideActivity : Activity() {

              private lateinit var web: WebView
              private lateinit var info: TextView
              private var page = 1
              private var total = 0

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val names = try {
                      assets.list("guide")?.filter { x -> x.endsWith(".jpg") } ?: emptyList()
                  } catch (e: Exception) {
                      emptyList()
                  }
                  total = names.size
                  page = intent.getIntExtra("page", 1)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL

                  if (total == 0) {
                      val t = TextView(this)
                      t.text = "這個版本沒有包含攻略圖片。\n請把 guide.zip 上傳到 GitHub 專案的最外層 (跟 build.yml 的上一層資料夾同一層,不是 .github 裡面),重新編譯後再安裝。"
                      t.textSize = 16f
                      t.setPadding(dp(16), dp(24), dp(16), dp(16))
                      root.addView(t)
                      setContentView(root)
                      return
                  }

                  web = WebView(this)
                  web.settings.builtInZoomControls = true
                  web.settings.displayZoomControls = false
                  web.settings.useWideViewPort = true
                  web.settings.loadWithOverviewMode = true
                  web.setBackgroundColor(0xFF111111.toInt())
                  root.addView(web, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.setBackgroundColor(0xFFEEEEEE.toInt())
                  val prev = Button(this)
                  prev.text = "上一頁"
                  val next = Button(this)
                  next.text = "下一頁"
                  val toc = Button(this)
                  toc.text = "目錄"
                  info = TextView(this)
                  info.gravity = Gravity.CENTER
                  prev.setOnClickListener { go(page - 1) }
                  next.setOnClickListener { go(page + 1) }
                  toc.setOnClickListener { showToc() }
                  bar.addView(prev, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  bar.addView(info, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  bar.addView(next, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  bar.addView(toc, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(bar)
                  setContentView(root)
                  go(page)
              }

              private fun go(p: Int) {
                  if (total == 0) return
                  page = p.coerceIn(1, total)
                  info.text = page.toString() + " / " + total
                  val name = String.format("p%03d.jpg", page)
                  val html = "<html><body style='margin:0;background:#111'>" +
                      "<img src='file:///android_asset/guide/" + name + "' style='width:100%'/>" +
                      "<div style='color:#999;font-size:12px;padding:6px'>出處:華曜出版《秀逗魔導士 完全攻略本》," +
                      "掃描檔來自 archive.org/details/rp-001 (公開資料)</div></body></html>"
                  web.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null)
              }

              private fun showToc() {
                  val items = ArrayList<String>()
                  val pages = ArrayList<Int>()
                  try {
                      assets.open("guide_toc.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              val bar = l.indexOf('|')
                              if (bar <= 0) continue
                              val n = l.substring(0, bar).trim().toIntOrNull() ?: continue
                              pages.add(n)
                              items.add(l.substring(bar + 1) + "  (第 " + n + " 頁)")
                          }
                      }
                  } catch (e: Exception) {
                      // ignore
                  }
                  AlertDialog.Builder(this)
                      .setTitle("攻略目錄")
                      .setItems(items.toTypedArray()) { _, i -> go(pages[i]) }
                      .show()
              }
          }
