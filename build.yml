              }

              private fun enhance(src: Bitmap, scale: Float, contrast: Float): Bitmap {
                  val w = (src.width * scale).toInt()
                  val h = (src.height * scale).toInt()
                  val scaled = Bitmap.createScaledBitmap(src, w, h, true)
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val cm = ColorMatrix()
                  cm.setSaturation(0f)
                  val t = 128f * (1f - contrast)
                  cm.postConcat(
                      ColorMatrix(
                          floatArrayOf(
                              contrast, 0f, 0f, 0f, t,
                              0f, contrast, 0f, 0f, t,
                              0f, 0f, contrast, 0f, t,
                              0f, 0f, 0f, 1f, 0f
                          )
                      )
                  )
                  val p = Paint(Paint.FILTER_BITMAP_FLAG)
                  p.colorFilter = ColorMatrixColorFilter(cm)
                  Canvas(out).drawBitmap(scaled, 0f, 0f, p)
                  if (scaled !== src) scaled.recycle()
                  return out
              }

              // 這一行要不要翻:日文至少 2 個字,或是像樣的英文 (至少 5 個字母,字母佔大部分)
              private fun isJapanese(s: String): Boolean {
                  var n = 0
                  var latin = 0
                  for (c in s) {
                      if (c in '\u3040'..'\u30FF' || c in '\u4E00'..'\u9FFF') n++
                      if (c in 'A'..'Z' || c in 'a'..'z') latin++
                  }
                  if (n >= 2) return true
                  val body = s.count { c -> !c.isWhitespace() && c !in ".,!?'\"-:;…" }
                  return n == 0 && latin >= 5 && body > 0 && latin * 10 >= body * 7 &&
                      Regex("[A-Za-z]{3,}").containsMatchIn(s)
              }

              // 不同版本辨識到同一個位置的文字只留一份 (留比較長的)
              private fun addBlock(list: ArrayList<Blk>, b: Blk) {
                  for (o in list) {
                      val ix = minOf(o.rect.right, b.rect.right) - maxOf(o.rect.left, b.rect.left)
                      val iy = minOf(o.rect.bottom, b.rect.bottom) - maxOf(o.rect.top, b.rect.top)
                      if (ix > 0 && iy > 0) {
                          val inter = ix.toLong() * iy
                          val minArea = minOf(
                              o.rect.width().toLong() * o.rect.height(),
                              b.rect.width().toLong() * b.rect.height()
                          )
                          if (minArea > 0 && inter * 2 > minArea) {
                              if (b.text.length > o.text.length) {
                                  o.text = b.text
                                  o.rect.set(b.rect)
                              }
                              return
                          }
                      }
                  }
                  list.add(b)
              }

              // 把同一段對話的碎片合併成一句:由上到下分群,同一行的由左到右接起來
              private fun merge(list: List<Blk>): List<Blk> {
                  val sorted = list.sortedBy { it.rect.top }
                  val groups = ArrayList<ArrayList<Blk>>()
                  for (b in sorted) {
                      val g = groups.lastOrNull()
                      if (g != null) {
                          var bottom = 0
                          for (x in g) {
                              if (x.rect.bottom > bottom) bottom = x.rect.bottom
                          }
                          if (b.rect.top - bottom <= g[0].lineH) {
                              g.add(b)
                              continue
                          }
                      }
                      val ng = ArrayList<Blk>()
                      ng.add(b)
                      groups.add(ng)
                  }
                  val out = ArrayList<Blk>()
                  for (g in groups) {
                      val rows = ArrayList<ArrayList<Blk>>()
                      for (b in g.sortedBy { it.rect.top }) {
                          val row = rows.lastOrNull { r ->
                              Math.abs(r[0].rect.centerY() - b.rect.centerY()) <= maxOf(r[0].lineH, b.lineH) / 2
                          }
                          if (row != null) {
                              row.add(b)
                          } else {
                              val nr = ArrayList<Blk>()
                              nr.add(b)
                              rows.add(nr)
                          }
                      }
                      val sb = StringBuilder()
                      val rect = Rect(g[0].rect)
                      for (row in rows) {
                          for (b in row.sortedBy { it.rect.left }) {
                              sb.append(b.text)
                              rect.union(b.rect)
                          }
                      }
                      out.add(Blk(rect, sb.toString(), g[0].lineH))
                  }
                  return out
              }

              // ---------------------------------------------------------------- 顯示譯文

              private fun createOverlay(): ResultView {
                  val v = ResultView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  wm.addView(v, lp)
                  overlay = v

                  // 讓「譯」按鈕保持在譯文上方
                  val b = button
                  val blp = buttonLp
                  if (b != null && blp != null) {
                      try {
                          wm.removeView(b)
                          wm.addView(b, blp)
                      } catch (e: Exception) {
                          // ignore
                      }
                  }
                  return v
              }

              private fun showResult(list: List<ResultView.Item>) {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  showGuideHint(list.joinToString(" ") { x -> x.orig + " " + x.text })
                  if (autoOn()) {
                      // 自動模式:用可以移動、調整大小的譯文框,不蓋住原文
                      val o = overlay
                      if (o != null) {
                          o.items = emptyList()
                          o.region = null
                          o.invalidate()
                      }
                      if (list.isEmpty()) {
                          hideSubtitle()
                      } else {
                          showSubtitle(
                              list.joinToString("\n") { x -> x.text },
                              list.joinToString(" ") { x -> x.orig }
                          )
                      }
                      return
                  }
                  val v = overlay ?: createOverlay()
                  v.showOrig = prefs.getBoolean("show_orig", true)
                  v.items = list
                  v.region = lastRegion
                  v.visibility = View.VISIBLE
                  v.invalidate()
              }

              // ---------------------------------------------------------------- 攻略提示

              private var guideChip: TextView? = null
              private var guideIndex: List<Triple<String, Int, String>>? = null

              private fun loadGuideIndex(): List<Triple<String, Int, String>> {
                  val g = guideIndex
                  if (g != null) return g
                  val out = ArrayList<Triple<String, Int, String>>()
                  try {
                      assets.open("guide_index.txt").bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (l in lines) {
                              if (l.startsWith("#")) continue
                              val eq = l.indexOf('=')
                              val bar = l.indexOf('|')
                              if (eq <= 0 || bar <= eq) continue
                              val n = l.substring(eq + 1, bar).trim().toIntOrNull() ?: continue
                              out.add(Triple(l.substring(0, eq).trim(), n, l.substring(bar + 1).trim()))
                          }
                      }
                  } catch (e: Exception) {
                      // 沒有索引就不提示
                  }
                  guideIndex = out
                  return out
              }

              private fun hideGuideHint() {
                  val c = guideChip
                  if (c != null) {
                      ui.removeCallbacks(hideChipRun)
                      try {
                          wm.removeView(c)
                      } catch (e: Exception) {
                          // ignore
                      }
                  }
                  guideChip = null
              }

              private val hideChipRun = Runnable { hideGuideHint() }

              private fun showGuideHint(text: String) {
                  val prefs = getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("guide_hint", true)) return
                  val hits = ArrayList<Triple<String, Int, String>>()
                  for (e in loadGuideIndex()) {
                      if (text.contains(e.first) && hits.none { x -> x.third == e.third }) {
                          hits.add(e)
                          if (hits.size >= 2) break
                      }
                  }
                  if (hits.isEmpty()) {
                      hideGuideHint()
                      return
                  }
                  hideGuideHint()
                  val tv = TextView(this)
                  tv.text = "📖 攻略:" + hits.joinToString("、") { x -> x.third }
                  tv.setTextColor(0xFFFFFFFF.toInt())
                  tv.textSize = 14f
                  tv.setPadding(dp(12), dp(8), dp(12), dp(8))
                  tv.setBackgroundColor(0xE61565C0.toInt())
                  val page = hits[0].second
                  tv.setOnClickListener {
                      val i = Intent(this, GuideActivity::class.java)
                      i.putExtra("page", page)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                      hideGuideHint()
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.END
                  lp.x = dp(8)
                  lp.y = dp(8)
                  try {
                      wm.addView(tv, lp)
                      guideChip = tv
                      ui.postDelayed(hideChipRun, 12000)
                  } catch (e: Exception) {
                      // ignore
                  }
              }

              // ---------------------------------------------------------------- 結束

              override fun onDestroy() {
                  try {
                      val re = regionEditor
                      if (re != null) wm.removeView(re)
                  } catch (e: Exception) {
                      // ignore
                  }
                  regionEditor = null
                  hideGuideHint()
                  closeMenu()
                  try {
                      val sv = subtitle
                      if (sv != null) wm.removeView(sv)
                  } catch (e: Exception) {
                      // ignore
                  }
                  subtitle = null
                  ui.removeCallbacks(stableRun)
                  latestCrop?.recycle()
                  latestCrop = null
                  ui.removeCallbacks(kick)
                  ui.removeCallbacks(giveUp)
                  try {
                      button?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  try {
                      overlay?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                      // ignore
                  }
                  button = null
                  overlay = null
                  try {
                      virtualDisplay?.release()
                  } catch (e: Exception) {
                      // ignore
                  }
                  virtualDisplay = null
                  try {
                      imageReader?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  imageReader = null
                  try {
                      projection?.stop()
                  } catch (e: Exception) {
                      // ignore
                  }
                  projection = null
                  try {
                      recognizer?.close()
                      translator?.close()
                      enTr?.close()
                  } catch (e: Exception) {
                      // ignore
                  }
                  worker.shutdownNow()
                  bgThread.quitSafely()
                  super.onDestroy()
              }
          }
